<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT-4 论文核心词汇</title>
<style>
:root{--c4:#3b82f6;--c6:#8b5cf6;--ckaon:#f59e0b;--cphd:#ef4444;--ct:#0d9488;--cg:#d946ef}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;transition:background .3s,color .3s}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:4px;color:#fff;vertical-align:2px;margin-left:6px;font-style:normal;flex:none;white-space:nowrap}
.tag.t4{background:var(--c4)}.tag.t6{background:var(--c6)}.tag.tk{background:var(--ckaon)}.tag.tp{background:var(--cphd)}
.tag.tt{background:var(--ct)}.tag.tg{background:var(--cg)}
.ipa{font-family:"SF Mono",Menlo,monospace;font-size:.82em;font-weight:400;opacity:.62;margin-left:6px}


/* 论文原标题小字 */
.ptitle{font-size:12.5px;letter-spacing:.3px;margin-top:6px}
.ptitle i{font-family:Georgia,serif}
.theme-mag .ptitle{color:#999;text-transform:none}
.theme-dark .ptitle{color:#6e7681}
.theme-paper .ptitle{color:#a09578}
.theme-fresh .ptitle{color:#9ca3af}
body.lv-mode .ptitle{color:#7d8590}

/* 预览工具条 */
.toolbar{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px;background:rgba(20,22,30,.88);padding:12px;border-radius:14px;backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toolbar .row{display:flex;gap:6px}
.toolbar button{border:none;cursor:pointer;padding:7px 12px;border-radius:8px;font-size:12.5px;background:#3a3f4d;color:#cbd2e0;transition:.15s}
.toolbar button:hover{background:#4a5164}
.toolbar button.on{background:#fff;color:#111;font-weight:600}
.toolbar .lbl{font-size:10px;color:#8a93a6;text-align:left;margin:2px 0 -2px 2px}

/* ---------- A 纸质阅读 ---------- */
body.theme-paper{background:#faf6ee;color:#2c2a25}
.theme-paper .wrap{max-width:880px;margin:0 auto;padding:56px 24px 140px}
.theme-paper .hero h1{font-family:Georgia,"Songti SC",serif;font-size:34px}
.theme-paper .hero p{color:#8a8272;margin:10px 0 42px;font-size:14px}
.theme-paper .sec{margin-bottom:44px}
.theme-paper .sec>h2{font-family:Georgia,"Songti SC",serif;font-size:20px;padding-left:14px;border-left:4px solid #b08d4f;margin-bottom:18px}
.theme-paper .word{display:flex;gap:14px;padding:14px 16px;border-bottom:1px dashed #ddd2bc;align-items:baseline}
.theme-paper .word:hover{background:#f3ecdc}
.theme-paper .w{font-family:Georgia,serif;font-size:19px;font-weight:700;min-width:250px}
.theme-paper .pos{color:#a09578;font-size:13px;margin-right:6px}
.theme-paper .m{color:#4a463c;font-size:15px}
.theme-paper .ex{margin-left:auto;max-width:270px;font-size:12.5px;color:#9a8f76;font-style:italic;text-align:right}
.theme-paper .from{display:block;font-size:11px;color:#b3a888;font-style:normal;margin-top:3px}

/* ---------- B 暗色科技 ---------- */
body.theme-dark{background:#0d1117;color:#e6edf3}
.theme-dark .wrap{max-width:1000px;margin:0 auto;padding:56px 24px 140px}
.theme-dark .hero h1{font-family:"SF Mono",Menlo,monospace;font-size:26px}
.theme-dark .hero h1::before{content:"$ ";color:#3fb950}
.theme-dark .hero p{color:#7d8590;margin:10px 0 40px;font-size:14px;font-family:Menlo,monospace}
.theme-dark .sec>h2{font-size:15px;font-family:Menlo,monospace;color:#58a6ff;padding:10px 16px;background:#161b22;border:1px solid #30363d;border-radius:8px 8px 0 0;margin-bottom:-1px}
.theme-dark .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:20px;background:#161b22;border:1px solid #30363d;border-radius:0 0 8px 8px}
.theme-dark .card{background:#0d1117;border:1px solid #30363d;border-left:4px solid #58a6ff;border-radius:6px;padding:15px 17px;transition:.2s;cursor:pointer;font-family:Menlo,monospace}
.theme-dark .card:hover{border-color:#58a6ff;box-shadow:0 0 14px rgba(88,166,255,.25);transform:translateY(-2px)}
.theme-dark .w{font-family:Menlo,monospace;font-size:17px;color:#79c0ff}
.theme-dark .ipa{color:#7ee787;opacity:.9}
.theme-dark .m{color:#8b949e;font-size:13.5px;margin-top:7px;line-height:1.55}
.theme-dark .ex{font-size:12px;color:#6e7681;margin-top:8px;border-top:1px solid #21262d;padding-top:8px;font-style:italic}
.theme-dark .from{color:#484f58;font-size:11px;margin-top:4px}

/* ---------- C 清新卡片 ---------- */
body.theme-fresh{background:linear-gradient(160deg,#eef4ff 0%,#f6f0ff 50%,#fff7ec 100%);color:#1f2430}
.theme-fresh .wrap{max-width:1020px;margin:0 auto;padding:56px 24px 140px}
.theme-fresh .hero h1{font-size:32px;font-weight:800;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.theme-fresh .hero p{color:#6b7280;margin:10px 0 40px;font-size:14px}
.theme-fresh .sec>h2{font-size:19px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.theme-fresh .sec>h2 .n{width:30px;height:30px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.theme-fresh .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.theme-fresh .card{background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-radius:18px;padding:17px 19px 15px;box-shadow:0 3px 14px rgba(80,80,140,.09);transition:.2s;cursor:pointer;border-top:5px solid #dbe3f5}
.theme-fresh .card.lv4{border-top-color:#3b82f6}.theme-fresh .card.lv6{border-top-color:#8b5cf6}
.theme-fresh .card.lvk{border-top-color:#f59e0b}.theme-fresh .card.lvp{border-top-color:#ef4444}
.theme-fresh .card .w{display:inline-block;background:#f3f5fb;border-radius:8px;padding:2px 10px}
.theme-fresh .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(80,80,140,.16)}
.theme-fresh .w{font-size:18px;font-weight:700}
.theme-fresh .m{color:#4b5563;font-size:14px;margin-top:6px;line-height:1.55}
.theme-fresh .ex{color:#9ca3af;font-size:12.5px;margin-top:8px}
.theme-fresh .from{color:#b6bcc9;font-size:11.5px;margin-top:4px}

/* ---------- D 杂志表格（宽松版） ---------- */
body.theme-mag{background:#fff;color:#111}
.theme-mag .wrap{max-width:960px;margin:0 auto;padding:52px 28px 140px}
.theme-mag .hero{border-bottom:3px solid #111;padding-bottom:16px;margin-bottom:10px}
.theme-mag .hero h1{font-family:"Songti SC",Georgia,serif;font-size:38px;font-weight:900}
.theme-mag .hero p{color:#888;font-size:13.5px;margin-top:8px}
.theme-mag .sec>h2{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#c2410c;margin:44px 0 8px;border-bottom:1px solid #e5e5e5;padding-bottom:8px}
.theme-mag table{width:100%;border-collapse:collapse}
.theme-mag td{padding:16px 12px;border-bottom:1px solid #f0f0f0;font-size:15.5px;line-height:1.65;vertical-align:top}
.theme-mag tr:hover td{background:#fff8f3}
.theme-mag .w{font-weight:700;font-size:17px;width:300px}
.theme-mag .lv{width:60px}
.theme-mag .lv b{font-size:11.5px;padding:3px 0;display:block;text-align:center;border-radius:3px;color:#fff;font-weight:600}
.theme-mag .m{color:#3d3d3d}
.theme-mag .ex{color:#9a9a9a;font-size:13px;font-style:italic}
.theme-mag .from{display:block;color:#c9c9c9;font-size:11.5px;font-style:normal;margin-top:4px}

/* ---------- 按级别：学习模式同款暗色大页 ---------- */
body.lv-mode{background:#0b0e13 !important}
body.lv-mode .hero h1,body.lv-mode .hero p{color:#e8ecf3}
body.lv-mode .hero p{color:#7d8590}
.lvslide{background:#101318;color:#e8ecf3;border-radius:20px;padding:26px 32px 22px;margin-bottom:26px;border-top:6px solid var(--c4)}
.lvslide.l6{border-top-color:var(--c6)}.lvslide.lk{border-top-color:var(--ckaon)}.lvslide.lp{border-top-color:var(--cphd)}
.lvslide.lt{border-top-color:var(--ct)}.lvslide.lg{border-top-color:var(--cg)}
.lvslide .ltitle{font-size:26px;font-weight:800;font-family:Georgia,serif;display:flex;align-items:baseline;gap:14px}
.lvslide .ltitle small{font-size:14px;color:#7d8590;font-family:Menlo,monospace;font-weight:400}
.lvslide .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:20px 0 8px}
.lvslide .lcard{background:#171c26;border:1px solid #2b3342;border-radius:14px;padding:15px 17px;cursor:pointer;transition:.15s}
.lvslide .lcard:hover{border-color:#79c0ff;transform:translateY(-2px)}
.lvslide .lcard .w{font-size:19px;font-weight:700;font-family:Georgia,serif}
.lvslide .lcard .ipa{font-family:Menlo,monospace;font-size:13px;color:#7ee787;margin-left:8px}
.lvslide .lcard .m{color:#aeb6c4;font-size:14px;margin-top:7px;line-height:1.55}
.lvslide .lcard .ex{color:#646d7d;font-size:12px;font-style:italic;margin-top:7px}
.lvslide .lcard .from{color:#4d5563;font-size:11px;margin-top:6px}


/* ---------- 白天 / 夜晚 ---------- */
body.lv-mode:not(.night){background:#eef1f6 !important}
body.lv-mode:not(.night) .hero h1{color:#1f2430}
body.lv-mode:not(.night) .hero p{color:#6b7280}
body.lv-mode:not(.night) .lvslide{background:#fff;color:#1f2430;box-shadow:0 4px 18px rgba(80,80,140,.10)}
body.lv-mode:not(.night) .lvslide .lcard{background:#f7f9fd;border-color:#e4e9f3}
body.lv-mode:not(.night) .lvslide .lcard:hover{border-color:#3b82f6}
body.lv-mode:not(.night) .lvslide .lcard .m{color:#4b5563}
body.lv-mode:not(.night) .lvslide .lcard .ex{color:#98a0ae}
body.lv-mode:not(.night) .lvslide .lcard .from{color:#b3bac6}
body.lv-mode:not(.night) .lvslide .lcard .ipa{color:#0a7d33}
body.night.theme-mag{background:#0d1117;color:#e6edf3}
body.night.theme-mag .hero{border-bottom-color:#e6edf3}
body.night.theme-mag .hero p{color:#8b949e}
body.night.theme-mag .sec>h2{color:#fbbf24;border-bottom-color:#30363d}
body.night.theme-mag td{border-bottom-color:#1c2230}
body.night.theme-mag tr:hover td{background:#161b22}
body.night.theme-mag .m{color:#c9d1d9}
body.night.theme-mag .ex{color:#8b949e}
body.night.theme-mag .from{color:#57606a}
body.night.theme-mag .w{color:#e6edf3}
body.night.theme-mag .ptitle{color:#8b949e}
body.night.theme-mag .ipa{opacity:.55}
#study.day{background:#f5f7fa;color:#1f2430}
#study.day .scard{background:#fff;border-color:#e4e9f3}
#study.day .scard .m{color:#4b5563}
#study.day .scard .ex{color:#98a0ae}
#study.day .scard:hover{border-color:#3b82f6}
#study.day .sfoot{color:#98a0ae;border-top-color:#e6e9f0}
#study.day .snav button,#study.day #sClose{background:#fff;color:#1f2430;border-color:#d7dce6}
#study.day .sfoot kbd{background:#e8ecf3;color:#1f2430}

/* ---------- 学习模式（PPT 按章节翻页） ---------- */
#study{position:fixed;inset:0;z-index:200;display:none;background:#101318;color:#e8ecf3;flex-direction:column}
#study.on{display:flex}
#study .sprog{height:4px;background:#262c38}
#study .sprog i{display:block;height:100%;background:linear-gradient(90deg,#58a6ff,#8b5cf6);width:0;transition:width .25s}
#study .sbody{flex:1;overflow:auto;padding:20px 40px}
#study .stitle{font-size:24px;font-weight:800;font-family:Georgia,serif;padding:6px 4px 2px}
#study .stitle small{color:#5b6472;font-size:14px;font-family:Menlo,monospace;font-weight:400;margin-left:12px}
#study .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:16px 2px 30px}
#study .scard{background:#171c26;border:1px solid #2b3342;border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s}
#study .scard:hover{border-color:#58a6ff;transform:translateY(-2px)}
#study .scard .w{font-size:22px;font-weight:700;font-family:Georgia,serif}
#study .scard .ipa{color:#7ee787;font-size:14px;margin-left:8px}
#study .scard .m{color:#aeb6c4;font-size:14.5px;margin-top:8px;line-height:1.55}
#study .scard .ex{color:#646d7d;font-size:12px;font-style:italic;margin-top:6px}
#study .sfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;color:#5b6472;font-size:13px;border-top:1px solid #1d232e}
#study .sfoot kbd{background:#262c38;border-radius:5px;padding:2px 8px;margin:0 2px;font-family:Menlo,monospace;font-size:12px}
#study .snav{display:flex;gap:10px;align-items:center}
#study .snav button{border:1px solid #333b4a;background:#1a2029;color:#cbd2e0;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:14px}
#study .snav button:hover{border-color:#58a6ff}
#study .snav button:disabled{opacity:.35;cursor:default}
</style>
</head>

const LVCLS={"4":"t4","6":"t6","k":"tk","p":"tp","t":"tt","g":"tg"};
const LVNAME={"4":"四级","6":"六级","k":"考研","p":"考博","t":"雅思 · 托福","g":"GRE"};
const LVSHORT={"4":"4","6":"6","k":"考研","p":"考博","t":"托福","g":"GRE"};
const LVORDER=["4","6","k","p","t","g"];

let mode="sec";
let theme="theme-mag"; // 章节视图固定杂志风；按级别视图固定暗色大页

function cardHTML(x,sec){
  const from = mode==="lv" ? `<div class="from">出自 ${sec}</div>` : "";
  if(theme==="theme-paper"){
    return `<div class="word"><span class="w">${x.w}<span class="ipa">/${x.ipa}/</span><i class="tag ${LVCLS[x.lv]}">${LVSHORT[x.lv]}</i></span>
      <span><span class="pos">${x.pos}</span><span class="m">${x.m}</span>${from}</span>
      <span class="ex">${x.ex}</span></div>`;
  }
  if(theme==="theme-mag") return "";
  return `<div class="card lv${x.lv}" data-say="${x.w}"><span class="w">${x.w}</span><span class="ipa">/${x.ipa}/</span><span class="tag ${LVCLS[x.lv]}">${LVSHORT[x.lv]}</span>
    <div class="m">${x.pos} ${x.m}</div><div class="ex">${x.ex}</div>${from}</div>`;
}
function magRow(x,sec){
  return `<tr data-say="${x.w}"><td class="w">${x.w}<span class="ipa">/${x.ipa}/</span></td>
    <td class="lv"><b class="tag ${LVCLS[x.lv]}">${LVSHORT[x.lv]}</b></td>
    <td class="m">${x.pos} ${x.m}${mode==="lv"?`<span class="from">出自 ${sec}</span>`:""}</td>
    <td class="ex">${x.ex}</td></tr>`;
}
function groupHTML(title,icon,inner){
  if(theme==="theme-mag") return `<div class="sec"><h2>${title}</h2><table>${inner}</table></div>`;
  if(theme==="theme-dark"||theme==="theme-fresh")
    return `<div class="sec"><h2>${theme==="theme-dark"?"":"<span class='n'>"+icon+"</span>"}${title}</h2><div class="grid">${inner}</div></div>`;
  return `<div class="sec"><h2>${title}</h2>${inner}</div>`;
}
function render(){
  document.body.classList.toggle("lv-mode",mode==="lv");
  if(mode==="sec")document.body.className="theme-mag";
  const app=document.getElementById("app");
  let html="";
  if(mode==="sec"){
    for(const s of DATA){
      html += theme==="theme-mag"
        ? groupHTML(s.sec,s.icon,s.words.map(x=>magRow(x,s.short)).join(""))
        : groupHTML(s.sec,s.icon,s.words.map(x=>cardHTML(x,s.short)).join(""));
    }
  }else{
    // 学习模式同款暗色大页：每个级别一块
    const dot={4:"var(--c4)",6:"var(--c6)",k:"var(--ckaon)",p:"var(--cphd)",t:"var(--ct)",g:"var(--cg)"};
    html=LVORDER.map(lv=>{
      const items=[];
      DATA.forEach(s=>s.words.forEach(x=>{if(x.lv===lv||x.ov===lv)items.push([x.ov===lv?{...x,lv:x.ov}:x,s.short])}));
      items.sort((a,b)=>a[0].w.localeCompare(b[0].w));
      const cls={4:"",6:"l6",k:"lk",p:"lp",t:"lt",g:"lg"}[lv];
      return `<div class="lvslide ${cls}">
        <div class="ltitle"><span style="color:${dot[lv]}">${LVNAME[lv]}</span>词汇<small>${items.length} words · 按字母排序 · 悬停看原文例句 · 点击发音</small></div>
        <div class="sgrid">${items.map(([x,sec])=>`
          <div class="lcard" data-say="${x.w}">
            <span class="w">${x.w}</span><span class="ipa">/${x.ipa}/</span>
            <div class="m">${x.pos} ${x.m}</div>
            <div class="ex">${x.ex}</div>
            <div class="from">出自 ${sec}</div>
          </div>`).join("")}</div></div>`;
    }).join("");
  }
  app.innerHTML=html;
}
function syncToolbar(){
  document.getElementById("v-sec").classList.toggle("on",mode==="sec");
  document.getElementById("v-lv").classList.toggle("on",mode==="lv");
}
document.getElementById("v-sec").onclick=()=>{mode="sec";theme="theme-mag";document.body.className="theme-mag";syncToolbar();render();};
document.getElementById("v-lv").onclick=()=>{mode="lv";syncToolbar();render();};

// 朗读：在线 TTS 多源自动降级（Polly → 百度 → 谷歌），选音色只对 Polly 源生效
const ALL_SRC=["yd1","yd0","bd","gg"];
const ONLINE_VOICES=[["yd1","美式 · 有道（推荐）"],["yd0","英式 · 有道"],["bd","百度翻译 · 女声"],["mute","🔇 不朗读"]];
let ONLINE="yd1";try{const sv=localStorage.getItem("vocab_voice");if(sv&&["yd1","yd0","bd","gg","mute"].includes(sv))ONLINE=sv;}catch(e){}
let SRC_ORDER=["yd1","yd0","bd","gg"],srcIdx=0; // 当前可用的源
function applyVoiceOrder(){const i=ALL_SRC.indexOf(ONLINE);SRC_ORDER=i<0?ALL_SRC.slice():ALL_SRC.slice(i).concat(ALL_SRC.slice(0,i));}
applyVoiceOrder();
let audio=null;
function ttsURL(src,t){
  const q=encodeURIComponent(t);
  if(src==="yd1")return `https://dict.youdao.com/dictvoice?type=1&audio=${q}`;
  if(src==="yd0")return `https://dict.youdao.com/dictvoice?type=0&audio=${q}`;
  if(src==="bd")return `https://fanyi.baidu.com/gettts?lan=en&text=${q}&spd=5&source=web`;
  return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${q}`;
}
function fillVoiceSel(){
  const sel=document.getElementById("voiceSel");if(!sel)return;
  sel.innerHTML=`<option value="mute" ${ONLINE==="mute"?"selected":""}>🔇 不朗读</option>`+ONLINE_VOICES.map(([v,l])=>`<option value="${v}" ${ONLINE===v?"selected":""}>${l}</option>`).join("");
  const st=document.getElementById("srcState");
  if(st)st.textContent={yd1:"有道·美音",yd0:"有道·英音",bd:"百度",gg:"谷歌"}[SRC_ORDER[srcIdx]]||"";
}
fillVoiceSel();
let saying=0; // 防并发
function say(t){
  if(ONLINE==="mute"){try{if(audio){audio.pause();audio=null}}catch(e){}return}
  const my=++saying;
  trySrc(0,t,my);
}
function trySrc(i,t,my){
  if(my!==saying)return;
  if(i>=SRC_ORDER.length){const st=document.getElementById("srcState");if(st)st.textContent="无可用源";return}
  const src=SRC_ORDER[i];
  const st=document.getElementById("srcState");
  if(st)st.textContent="尝试"+({yd1:"有道·美音",yd0:"有道·英音",bd:"百度",gg:"谷歌"}[src]);
  try{if(audio){audio.pause();audio=null}}catch(e){}
  const a=new Audio(ttsURL(src,t));
  let ok=false,advanced=false;
  const advance=()=>{ if(!ok&&!advanced&&my===saying){advanced=true;trySrc(i+1,t,my);} };
  a.addEventListener("playing",()=>{ok=true;
    if(srcIdx!==i){srcIdx=i;fillVoiceSel();} // 记住能用的源
  });
  a.addEventListener("error",advance);
  audio=a;
  a.play().catch(advance);
  setTimeout(()=>{ if(!ok&&my===saying&&a.paused)advance(); },2500);
}
document.getElementById("voiceSel").addEventListener("change",e=>{
  ONLINE=e.target.value; applyVoiceOrder(); // 换音色重新从头试源
  if(ONLINE!=="mute") say("Hello, let us learn new words together.");
});

let night=false;
try{night=(localStorage.getItem("vocab_dn")||"day")==="night"}catch(e){night=false}
function applyDN(){
  document.body.classList.toggle("night",night);
  document.getElementById("dn-day").classList.toggle("on",!night);
  document.getElementById("dn-night").classList.toggle("on",night);
  if(typeof studyEl!=="undefined"&&studyEl)studyEl.classList.toggle("day",!night);
}
document.getElementById("dn-day").onclick=()=>{night=false;try{localStorage.setItem("vocab_dn","day")}catch(e){};applyDN();};
document.getElementById("dn-night").onclick=()=>{night=true;try{localStorage.setItem("vocab_dn","night")}catch(e){};applyDN();};
document.getElementById("app").addEventListener("click",e=>{
  const el=e.target.closest("[data-say]"); if(el) say(el.dataset.say);
});

/* ---------- 学习模式：按章节分页的 PPT 翻页 ---------- */
const PER_PAGE = 12; // 每页最多词数，放不下自动续页
let slides=[],si=0;
function buildSlides(){
  slides=[];
  for(const s of DATA){
    for(let i=0;i<s.words.length;i+=PER_PAGE){
      slides.push({sec:s.sec,page:Math.floor(i/PER_PAGE)+1,
        pages:Math.ceil(s.words.length/PER_PAGE),words:s.words.slice(i,i+PER_PAGE)});
    }
  }
}
const studyEl=document.getElementById("study");
let open=false;
function showSlide(){
  const sl=slides[si];
  const title=sl.pages>1 ? `${sl.sec}（第 ${sl.page}/${sl.pages} 页）` : sl.sec;
  document.getElementById("sPage").innerHTML =
    `<div class="stitle">${title}<small>${sl.words.length} words</small></div>
     <div class="sgrid">${sl.words.map(x=>`
       <div class="scard" data-say="${x.w}">
         <span class="w">${x.w}</span><span class="ipa">/${x.ipa}/</span><span class="tag ${LVCLS[x.lv]}" style="font-size:11px;padding:2px 8px">${LVSHORT[x.lv]}</span>
         <div class="m">${x.pos} ${x.m}</div>
         <div class="ex">${x.ex}</div>
       </div>`).join("")}</div>`;
  document.getElementById("sIdx").textContent=(si+1)+" / "+slides.length;
  document.getElementById("sbar").style.width=((si+1)/slides.length*100)+"%";
  document.getElementById("sPrev").disabled=si===0;
  document.getElementById("sNext").disabled=si===slides.length-1;
  studyEl.querySelector(".sbody").scrollTop=0;
}
function studyOpen(){ buildSlides(); si=0; open=true; studyEl.classList.add("on"); applyDN(); showSlide(); }
function studyClose(){ open=false; studyEl.classList.remove("on"); }
function next(){ if(si<slides.length-1){ si++; showSlide(); } }
function prev(){ if(si>0){ si--; showSlide(); } }
document.getElementById("v-study").onclick=()=>open?studyClose():studyOpen();
document.getElementById("sClose").onclick=studyClose;
document.getElementById("sExit").onclick=studyClose;
document.getElementById("sNext").onclick=next;
document.getElementById("sPrev").onclick=prev;
studyEl.addEventListener("click",e=>{
  const el=e.target.closest("[data-say]"); if(el) say(el.dataset.say);
});
document.addEventListener("keydown",e=>{
  if(!open) return;
  if(e.code==="Space"||e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ prev(); }
  else if(e.key==="Escape"){ studyClose(); }
});
applyDN(); syncToolbar(); render();
</script>
