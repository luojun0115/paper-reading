<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT3_论文词汇_听力 · 单词连播</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;justify-content:center;font-family:"PingFang SC",-apple-system,sans-serif;background:#111}

  /* ============ 皮肤 ============ */
  .app{
    --h:356;
    --bg-a:#fcf6da; --bg-b:#f8ecb0; --bg-c:#eeda8e;
    --card-bg:rgba(255,252,240,.35); --card-br:rgba(255,255,255,.9);
    --disc-a:#eeda84; --disc-b:#d9bd5e;
    --groove:rgba(150,110,30,.10); --dshadow:rgba(160,120,30,.35);
    --arm-a:rgba(255,255,255,.95); --arm-b:rgba(255,255,255,.7);
    --tx:#2f2416; --tx2:#6b5a35; --tx3:#8a7850;
    --bar-bg:rgba(90,70,30,.25); --bar-fill:#2f2416;
    --sheet-bg:rgba(255,252,240,.97); --accent:#e4574f;
  }
  .app[data-skin="qq"]{
    --bg-a:hsl(356 85% 88%); --bg-b:hsl(352 70% 76%); --bg-c:hsl(348 62% 66%);
    --card-bg:rgba(255,255,255,.22); --card-br:rgba(255,255,255,.75);
    --disc-a:hsl(356 62% 66%); --disc-b:hsl(354 55% 58%);
    --groove:rgba(120,30,30,.10); --dshadow:rgba(120,40,40,.45);
    --tx:#332424; --tx2:#5a4644; --tx3:#6b5450;
    --bar-bg:rgba(70,40,40,.25); --bar-fill:#3a2c2c;
    --sheet-bg:rgba(255,252,250,.96);
  }
  .app[data-skin="nred"]{           /* 网易云 · 红 */
    --bg-a:#fdeeed; --bg-b:#fbdcd9; --bg-c:#f6c6c1;
    --card-bg:rgba(255,255,255,.42); --card-br:rgba(255,255,255,.9);
    --disc-a:#e0584f; --disc-b:#c0342c;
    --groove:rgba(150,40,30,.10); --dshadow:rgba(190,70,60,.35);
    --tx:#3a1f1c; --tx2:#7a524e; --tx3:#9b7a76;
    --bar-bg:rgba(120,50,40,.22); --bar-fill:#c0342c;
    --sheet-bg:rgba(255,246,245,.97); --accent:#d33a31;
  }
  .app[data-skin="qqgreen"]{        /* QQ音乐 · 绿 */
    --bg-a:#eafaf2; --bg-b:#d6f4e6; --bg-c:#bcead6;
    --card-bg:rgba(255,255,255,.45); --card-br:rgba(255,255,255,.9);
    --disc-a:#3fce8c; --disc-b:#22a96c;
    --groove:rgba(20,110,70,.10); --dshadow:rgba(30,150,100,.32);
    --tx:#123328; --tx2:#4a7a66; --tx3:#7ba191;
    --bar-bg:rgba(30,110,80,.2); --bar-fill:#1f9a63;
    --sheet-bg:rgba(246,255,251,.97); --accent:#31c27c;
  }
  .app[data-skin="kugou"]{          /* 酷狗 · 蓝 */
    --bg-a:#e9f6fe; --bg-b:#d3edfd; --bg-c:#b6e0fa;
    --card-bg:rgba(255,255,255,.45); --card-br:rgba(255,255,255,.9);
    --disc-a:#4cc0f7; --disc-b:#1a86d0;
    --groove:rgba(20,90,150,.10); --dshadow:rgba(30,120,190,.32);
    --tx:#0f2b40; --tx2:#4a6c86; --tx3:#7a99b0;
    --bar-bg:rgba(30,90,140,.2); --bar-fill:#1a86d0;
    --sheet-bg:rgba(245,251,255,.97); --accent:#1a9bf0;
  }
  .app[data-skin="xiami"]{          /* 虾米 · 橙（白底） */
    --bg-a:#fff6ef; --bg-b:#ffe9d8; --bg-c:#ffd7ba;
    --card-bg:rgba(255,255,255,.5); --card-br:rgba(255,255,255,.95);
    --disc-a:#ff8a4c; --disc-b:#e85f1f;
    --groove:rgba(160,80,20,.10); --dshadow:rgba(220,120,50,.32);
    --tx:#3d2415; --tx2:#8a5f42; --tx3:#a8856a;
    --bar-bg:rgba(140,80,30,.2); --bar-fill:#e85f1f;
    --sheet-bg:rgba(255,250,245,.97); --accent:#ff5a1f;
  }
  .app[data-skin="netease"]{
    --bg-a:#3a2429; --bg-b:#241619; --bg-c:#150d10;
    --card-bg:rgba(255,255,255,.06); --card-br:rgba(255,255,255,.16);
    --disc-a:#1b1b1b; --disc-b:#0d0d0d;
    --groove:rgba(255,255,255,.055); --dshadow:rgba(0,0,0,.6);
    --tx:#f2ecec; --tx2:rgba(240,232,232,.72); --tx3:rgba(240,232,232,.5);
    --bar-bg:rgba(255,255,255,.22); --bar-fill:#f2ecec;
    --sheet-bg:rgba(28,20,20,.96); --accent:#ec4141;
  }
  .app[data-skin="vinyl"]{
    --bg-a:#eef0f6; --bg-b:#e3e6f0; --bg-c:#d6dae8;
    --card-bg:rgba(255,255,255,.55); --card-br:#fff;
    --disc-a:#1c1c1c; --disc-b:#0c0c0c;
    --groove:rgba(255,255,255,.05); --dshadow:rgba(40,50,90,.4);
    --arm-a:rgba(255,255,255,.95); --arm-b:#c9c9d8;
    --tx:#232333; --tx2:#5b5b76; --tx3:#7b7b95;
    --bar-bg:rgba(40,40,80,.18); --bar-fill:#35354a;
    --sheet-bg:rgba(252,252,255,.96); --accent:#6b6bf2;
  }
  .app[data-skin="gold"]{
    --bg-a:#f7ead0; --bg-b:#efdcbb; --bg-c:#e2c795;
    --card-bg:rgba(255,255,255,.38); --card-br:rgba(255,255,255,.8);
    --disc-a:#4a341c; --disc-b:#2e1f0f;
    --groove:rgba(255,235,200,.07); --dshadow:rgba(90,60,20,.45);
    --arm-a:rgba(255,250,240,.95); --arm-b:rgba(240,225,200,.72);
    --tx:#3a2a12; --tx2:#6b5430; --tx3:#8a7048;
    --bar-bg:rgba(80,55,20,.22); --bar-fill:#4a3418;
    --sheet-bg:rgba(255,250,240,.97); --accent:#b8860b;
  }
  .app[data-skin="vinylx"]{          /* 悬浮黑胶（参照网易云图标：黑盘+大蓝标+顶部细针） */
    --bg-a:#e9e8f0; --bg-b:#e9e8f0; --bg-c:#e2e1ec;
    --card-bg:transparent; --card-br:transparent;
    --disc-a:#191919; --disc-b:#0b0b0b;
    --groove:rgba(255,255,255,.055); --dshadow:rgba(70,70,110,.28);
    --tx:#2b2b38; --tx2:#5c5c6e; --tx3:#8b8b9c;
    --bar-bg:rgba(60,60,90,.18); --bar-fill:#2b2b38;
    --sheet-bg:rgba(250,250,253,.97); --accent:#5b5bd6;
  }
  .app[data-skin="vinylx"] .card{background:transparent;border-color:transparent;box-shadow:none}
  .app[data-skin="vinylx"] .vinyl{box-shadow:0 0 0 2px rgba(255,255,255,.45),0 16px 36px rgba(70,70,110,.3)}
  .app[data-skin="vinylx"] .art{inset:24%;box-shadow:none;
    background:radial-gradient(circle at 32% 26%,#7a7ae8,#4b4bcd 62%,#3d3dbe)}
  .app[data-skin="vinylx"] .arm{display:none}
  .app[data-skin="vinylx"] .needle{display:block}
  .app{
    position:relative;width:min(430px,100vw);max-width:430px;overflow:hidden;
    min-height:calc(100vh / var(--z,1));   /* 缩放后仍刚好铺满一屏 */
    zoom:var(--z,1);                        /* 整体等比放大（含所有 px 尺寸） */
    display:flex;flex-direction:column;color:var(--tx);
    background:
      radial-gradient(120% 60% at 85% 4%, var(--bg-a) 0%, transparent 55%),
      radial-gradient(140% 70% at 15% 30%, var(--bg-b) 0%, transparent 60%),
      linear-gradient(178deg,var(--bg-b) 0%,var(--bg-a) 55%,var(--bg-c) 100%);
    transition:background .5s,color .5s;
  }

  /* 顶栏 */
  .top{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
  .top .pt{flex:1;min-width:0;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .top .ic svg{width:20px;height:20px;stroke:var(--tx2);fill:none;stroke-width:2}
  .top .dot{stroke:var(--tx2);fill:var(--tx2)}
  /* 收藏/星标：未点亮时一律中性灰，避免被皮肤色染成"像已收藏的红心" */
  .top .ic.neutral svg{stroke:rgba(118,124,134,.92)}
  .top .ic.neutral .slash{stroke:rgba(118,124,134,.92)}
  .top .ic.neutral.on svg{stroke:var(--accent)}
  .top .ic.on svg{stroke:var(--accent)}
  .top .ic.on svg .fillable{fill:var(--accent)}
  .top .ic svg .slash{opacity:1;transition:opacity .2s}   /* 未收藏：心上有斜线 */
  .top .ic.on svg .slash{opacity:0}                        /* 已收藏：斜线消失、心填色 */
  .top{gap:9px}
  .top .ic{width:30px;height:30px}
  .top .ic svg{width:19px;height:19px}
  .srow.col{flex-direction:column;align-items:stretch;gap:9px}
  .seg.wrap{flex-wrap:wrap;justify-content:flex-start}
  .clr{font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600}
  .repin{width:56px;padding:4px 6px;border-radius:8px;border:1px solid var(--bar-bg);
    background:transparent;color:var(--tx);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
  .repin:focus{outline:none;border-color:var(--accent)}

  /* 唱片卡 */
  .card{
    position:relative;margin:10px 26px 0;aspect-ratio:1/1.02;border-radius:30px;
    background:var(--card-bg);border:2px solid var(--card-br);
    box-shadow:0 18px 44px var(--dshadow);flex:none;
  }
  .vinyl{
    position:absolute;left:50%;top:50%;width:86%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,var(--groove) 0 1px,transparent 1px 4px),
      radial-gradient(circle at 50% 50%,var(--disc-a) 0 61%,var(--disc-b) 61% 100%);
    box-shadow:0 10px 30px var(--dshadow),inset 0 0 0 1px rgba(255,255,255,.18);
    animation:spin 14s linear infinite;animation-play-state:paused;
  }
  .playing .vinyl{animation-play-state:running}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .vinyl::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 200deg,transparent 0 40deg,rgba(255,255,255,.22) 62deg,
      transparent 92deg 210deg,rgba(255,255,255,.12) 235deg,transparent 268deg);
  }
  /* 盘心标签：跟随皮肤色系（同盘深色 + 白色高光），不再用单词色相，避免红胶紫标这种撞色 */
  .art{
    position:absolute;inset:27%;border-radius:50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
      var(--disc-b);
    box-shadow:0 0 0 5px rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;
  }
  .art svg{width:42%;height:42%;fill:#fff;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
  .art .cl{font-size:clamp(30px,8vw,46px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3)}

  /* 唱臂 */
  .arm{position:absolute;top:-4px;right:0;width:110px;height:100%;z-index:5;pointer-events:none}
  .arm .cap{position:absolute;top:0;right:30px;width:30px;height:16px;border-radius:9px 9px 5px 5px;background:var(--arm-a);box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .arm .pivot{position:absolute;top:12px;right:20px;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--arm-a),var(--arm-b));box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .arm .pivot::before{content:"";position:absolute;inset:13px;border-radius:50%;background:rgba(140,140,160,.35)}
  .arm .bar{position:absolute;top:32px;right:40px;width:7px;height:70%;border-radius:4px;
    background:linear-gradient(var(--arm-a),var(--arm-b));transform-origin:3.5px 3.5px;
    transform:rotate(var(--arm,0deg));transition:transform .6s cubic-bezier(.34,1.2,.5,1);
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .arm .bar .head{position:absolute;left:50%;bottom:-10px;width:22px;height:44px;
    transform:translateX(-50%) rotate(12deg);border-radius:11px;
    background:linear-gradient(var(--arm-a),var(--arm-b));box-shadow:0 3px 8px rgba(0,0,0,.22)}

  /* 顶部细针（vinylx 悬浮黑胶：轴点在上，细臂弯折落盘，照网易云图标） */
  .needle{display:none;position:absolute;left:50%;top:-2px;width:26%;
    transform:translateX(-50%) rotate(var(--nd,-30deg));
    transform-origin:34% 3%;                 /* 旋转轴 = 轴点圆心 */
    z-index:6;pointer-events:none;transition:transform .7s cubic-bezier(.34,1.2,.5,1)}
  .needle svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}

  /* 主区：左唱片 + 右信息列；PC 自动变横向矩形 */
  .main{flex:1;display:flex;flex-direction:column;min-height:0}
  .side{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .timerChip{position:absolute;right:0;top:0;font-size:11px;color:var(--tx3);opacity:.9;
    letter-spacing:.4px;font-variant-numeric:tabular-nums;pointer-events:none}
  @media (min-width:760px){
    .app{width:min(1280px,96vw);max-width:none;zoom:1;min-height:auto;margin:auto;padding-bottom:8px}
    .main{flex-direction:row;align-items:center;gap:40px;padding:8px 30px 0}
    /* 唱片按视口宽高的较小者放大：既大又不至于撑出屏幕 */
    .main>.card{margin:0;flex:0 0 clamp(400px,min(40vw,66vh),640px);align-self:center}
    .side{align-self:stretch;justify-content:flex-start}
    /* 单词区在「角标」与「底部控制」之间的剩余空间里垂直居中 → 整体下移到中间 */
    .side .word{padding:0;min-height:0;text-align:center;margin-top:auto;margin-bottom:auto}
    .side .sec{font-size:11.5px;margin-bottom:12px}
    .side .word .big{font-size:clamp(50px,5vw,74px);text-shadow:0 2px 10px rgba(0,0,0,.06)}
    .side .word .ipa{font-size:20px;transform:translateY(-9px)}
    .side .word .wrow{gap:12px}
    .side .word .mean{font-size:clamp(16px,1.5vw,21px)}
    .side .word .ex{font-size:17px}
    .side .wav{--wvh:28px;height:42px;gap:5px}
    .side .slot{min-height:96px;margin-top:34px;margin-bottom:26px}
    .side .wav i{width:5px}
    .side .skins{margin-top:8px}   /* 由 .word 的下 auto 外边距顶到列底 */
    /* 用 .side 前缀提权重：压过写在后面的基础规则（margin-top:auto 等） */
    .side .prog{padding:14px 0 0}
    .side .ctrl{margin-top:8px;padding:6px 0 0}
    .side .ctrl svg{width:27px;height:27px}
    .side .ctrl .ord{font-size:13px}
    .side .play{width:72px;height:72px}
    .side .play svg{width:29px;height:29px}
    .top .pt{font-size:13px}
  }

  /* 波浪：恢复原来的紧凑居中款，峰值收敛（不铺满、不高） */
  .wav{--wvh:22px;display:none;align-items:flex-end;justify-content:center;gap:4px;height:34px}
  .wav i{width:4px;height:5px;border-radius:2px;background:var(--tx3);opacity:.5;transition:opacity .3s}
  .playing .wav i{opacity:.85;animation:wv .8s ease-in-out infinite alternate}
  @keyframes wv{from{height:5px}to{height:var(--wvh,22px)}}

  /* 单词区 */
  .word{padding:20px 26px 0;text-align:center;min-height:150px}
  /* 章节/级别/进度：左上角角标，弱化处理不抢单词（小字 + 拉开距离 + 降透明度） */
  .side .sec{font-size:10px;color:var(--tx3);opacity:.72;margin:0 0 10px;text-align:left;letter-spacing:.3px}
  .word .wrow{display:inline-flex;align-items:flex-end;justify-content:center;gap:9px}
  .word .big{font-size:clamp(36px,9.5vw,50px);font-weight:800;letter-spacing:.5px;line-height:1.15;color:var(--tx);
    font-family:var(--wfont,"PingFang SC",-apple-system,sans-serif)}
  /* 音标：贴在单词右下角当注音，不再单独占一行 */
  .word .ipa{font-size:15px;color:var(--tx2);white-space:nowrap;transform:translateY(-7px)}
  /* 固定槽位：高度锁死，波浪↔释义原地切换，不产生位移 */
  .slot{display:flex;align-items:center;justify-content:center;min-height:72px;margin-top:26px}
  .slot .txt{width:100%}
  /* 释义：压成一行、字号收小（过长时省略，避免撑破排版） */
  .word .mean{font-size:16px;font-weight:700;color:var(--tx);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .word .ex{font-size:13.5px;font-style:italic;color:var(--tx3);margin-top:8px;line-height:1.5}
  .hiddenl{filter:blur(9px);opacity:.55;transition:filter .4s,opacity .4s}

  /* 皮肤切换 */
  .skins{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
  .skins .lb{font-size:10.5px;color:var(--tx3)}
  .skins .sw{width:25px;height:25px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 7px rgba(0,0,0,.2);transition:transform .2s}
  .skins .sw:hover{transform:scale(1.08)}
  .skins .sw.on{border-color:var(--accent);transform:scale(1.14)}
  .skins .zbtn{font-size:10.5px;color:var(--tx2);border:1px solid var(--bar-bg);border-radius:99px;padding:3px 10px;cursor:pointer;user-select:none}
  .skins .zbtn:hover{color:var(--accent);border-color:var(--accent)}

  /* 进度：时间贴近两端（对齐官方） */
  .prog{display:flex;align-items:center;gap:10px;padding:14px 20px 0}
  .prog .t{flex:none;min-width:50px;font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .prog .t.r{text-align:right}
  .bar{position:relative;flex:1;height:4px;border-radius:2px;background:var(--bar-bg);cursor:pointer}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--bar-fill)}
  .bar .knob{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:var(--bar-fill);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}

  /* 控制：全宽分布 顺序 · 快退 · 播放 · 快进 · 列表 */
  .ctrl{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 22px 26px}
  .ctrl svg{width:24px;height:24px;stroke:var(--tx);fill:none;stroke-width:1.8;cursor:pointer;transition:stroke .15s}
  .ctrl svg:hover{stroke:var(--accent)}
  .ctrl .ord{font-size:12px;color:var(--tx2);cursor:pointer;user-select:none;min-width:36px}
  .ctrl .ord:hover{color:var(--accent)}
  .play{width:64px;height:64px;border-radius:50%;background:transparent;border:2.5px solid var(--tx);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .play:active{transform:scale(.92)}
  .play svg{width:26px;height:26px;stroke:none;fill:var(--tx)}

  /* 设置面板 */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--sheet-bg);backdrop-filter:blur(14px);
    border-radius:22px 22px 0 0;padding:16px 22px 28px;transform:translateY(105%);
    transition:transform .35s cubic-bezier(.3,1,.4,1);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .sheet.on{transform:translateY(0)}
  .sheet h3{font-size:14px;color:var(--tx);margin-bottom:0}
  .shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .shb{font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;user-select:none}
  .shb:hover{opacity:.75}
  .top .ic{flex:none}
  .srow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bar-bg)}
  .srow:last-of-type{border-bottom:none}
  .srow span{font-size:13.5px;color:var(--tx)}
  .seg{display:flex;gap:6px}
  .seg b{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;
    border:1px solid var(--bar-bg);color:var(--tx2)}
  .seg b.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sback{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:1px solid var(--bar-bg);
    background:transparent;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}

  .toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
    background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:8px 14px;border-radius:99px;
    opacity:0;transition:.3s;pointer-events:none;z-index:30;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app" data-skin="lemon">

  <div class="top">
    <div class="ic" id="backBtn" title="返回">
      <svg viewBox="0 0 24 24" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    </div>
    <div class="pt" id="ptitle">Language Models are Few-Shot Learners · GPT-3 · NeurIPS 2020</div>
    <div class="ic neutral" id="favBtn" title="收藏（再点取消）">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round">
        <defs>
          <clipPath id="favClip">
            <path transform="translate(12 12) scale(.86) translate(-12 -12)"
                  d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/>
          </clipPath>
        </defs>
        <path class="fillable heart" d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/>
        <path class="slash" d="M4 4 20 20" clip-path="url(#favClip)"/>
      </svg>
    </div>
    <div class="ic neutral" id="starBtn" title="标星（重点词，可只背星标）">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round">
        <path class="fillable star" d="m12 3.8 2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.75-5.2 2.75 1-5.8-4.2-4.1 5.8-.85Z"/>
      </svg>
    </div>
    <div class="ic" id="okBtn" title="认识，之后不再朗读">
      <svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>
    </div>
    <div class="ic" id="replayBtn" title="重听当前词">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19C8 12.5 12.5 8.5 18.6 6"/><path d="M13 5.4l6.2-.1-.1 6.2"/></svg>
    </div>
    <div class="ic" id="skinBtn" title="换皮肤（点一下换下一套）">
      <svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 3.2 3.4 5.9l2 3.6 1.9-1V20.8h9.4V8.5l1.9 1 2-3.6L15.8 3.2a3.8 3.8 0 0 1-7.6 0Z"/></svg>
    </div>
    <div class="ic" id="moreBtn" title="设置">
      <svg class="dot" viewBox="0 0 24 24" stroke="none"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
    </div>
  </div>

  <div class="main">
  <div class="card">
    <div class="vinyl">
      <div class="art" id="art">
        <svg class="wave" viewBox="0 0 24 24" fill="#fff">
          <rect x="3.2" y="9.5"  width="2.8" height="5"  rx="1.4"/>
          <rect x="8.2" y="6"    width="2.8" height="12" rx="1.4"/>
          <rect x="13.2" y="3"   width="2.8" height="18" rx="1.4"/>
          <rect x="18.2" y="7.5" width="2.8" height="9"  rx="1.4"/>
        </svg>
      </div>
    </div>
    <div class="arm">
      <div class="cap"></div><div class="pivot"></div>
      <div class="bar"><div class="head"></div></div>
    </div>
    <div class="needle">
      <svg viewBox="0 0 160 180" fill="none">
        <defs>
          <linearGradient id="ndg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d4d4e0"/><stop offset="1" stop-color="#8f8fa2"/>
          </linearGradient>
        </defs>
        <!-- 轴点 -->
        <circle cx="55" cy="6" r="7.5" fill="#c9c9d6"/>
        <circle cx="55" cy="6" r="3.2" fill="#9c9cad"/>
        <!-- 弯针：平滑贝塞尔，连续弧度而非两段直线 -->
        <path d="M55 12 C 63 52, 82 92, 108 126 C 115 135, 120 144, 121 152"
              stroke="url(#ndg)" stroke-width="4.6" stroke-linecap="round"/>
        <!-- 针头：沿曲线切线方向的圆头短粗段，与针身融为一体、不外凸 -->
        <path d="M120.6 149.5 L122.2 162.5" stroke="url(#ndg)" stroke-width="8.5"
              stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="side">
  <div class="sec" id="wsec">准备中…</div>
  <div class="timerChip" id="timerChip" style="display:none">⏱ 0:00</div>
  <div class="word">
    <div class="wrow">
      <span class="big" id="wbig">—</span>
      <span class="ipa" id="wipa"></span>
    </div>
    <!-- 波浪与释义共用同一个固定位置：未揭晓=波浪，揭晓=原地换释义，不跳动 -->
    <div class="slot">
      <div class="wav" id="wav"></div>
      <div class="txt" id="wtxt">
        <div class="mean" id="wmean"></div>
        <div class="ex" id="wex"></div>
      </div>
    </div>
  </div>


  <div class="prog">
    <span class="t" id="cur">第 0 词</span>
    <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <span class="t r" id="dur">共 0 词</span>
  </div>

  <div class="ctrl">
    <span class="ord" id="ordBtn">顺序</span>
    <svg viewBox="0 0 24 24" id="prevBtn"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 5v14"/></svg>
    <div class="play" id="play">
      <svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5.3v13.4L19 12Z"/></svg>
      <svg id="icPause" viewBox="0 0 24 24" style="display:none"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
    </div>
    <svg viewBox="0 0 24 24" id="nextBtn"><path d="M5 4l10 8-10 8V4Z"/><path d="M19 5v14"/></svg>
    <svg viewBox="0 0 24 24" id="listBtn"><path d="M4 6h16M4 12h16M4 18h12"/></svg>
  </div>
  </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="shd"><h3>播放设置</h3><span class="shb" id="sheetBack">← 返回播放</span></div>
    <div class="srow"><span>发音</span><div class="seg" id="segVoice"></div></div>
    <div class="srow"><span>单词重复</span>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="seg" id="segRepeat"></div>
        <input id="repInput" class="repin" type="number" min="1" max="20" step="1" title="自定义次数（1–20）">
      </div>
    </div>
    <div class="srow"><span>每词停顿</span><div class="seg" id="segPause"></div></div>
    <div class="srow"><span>先听后现</span><div class="seg" id="segReveal"></div></div>
    <div class="srow"><span>朗读中文</span><div class="seg" id="segZh"></div></div>
    <div class="srow"><span>朗读例句</span><div class="seg" id="segEx"></div></div>
    <div class="srow"><span>界面缩放</span><div class="seg" id="segZoom"></div></div>
    <div class="srow"><span>单词字体</span><div class="seg" id="segFont"></div></div>
    <div class="srow"><span>定时停止</span><div class="seg" id="segTimer"></div></div>
    <div class="srow"><span>词库来源</span><div class="seg" id="segSource"></div></div>
    <div class="srow"><span id="markCnt">⭐ 0 · ❤ 0 · ✓ 0</span><span class="clr" id="clearStar">清空星标</span></div>
    <div class="srow"><span>顺序</span><div class="seg" id="segOrder"></div></div>
    <div class="srow"><span>跳过已掌握</span><div class="seg" id="segSkip"></div></div>
    <div class="srow col"><span>范围（章节，点选）</span><div class="seg wrap" id="rangeBox"></div></div>
    <div class="srow"><span id="skipCnt">已跳过 0 词</span><span class="clr" id="clearSkip">清空</span></div>
    <button class="sback" id="setupBack">← 返回播放</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const ITEMS=[{"w": "pre-training", "ipa": "priːˈtreɪnɪŋ", "pos": "n.", "m": "预训练", "ex": "pre-training on a large corpus of text followed by fine-tuning on a specific task", "lv": "考博", "sec": "Abstract"}, {"w": "fine-tuning", "ipa": "faɪnˈtuːnɪŋ", "pos": "n.", "m": "微调", "ex": "task-specific fine-tuning datasets of thousands or tens of thousands of examples", "lv": "考博", "sec": "Abstract"}, {"w": "task-agnostic", "ipa": "tæsk ˈæɡnɒstɪk", "pos": "adj.", "m": "任务无关的", "ex": "typically task-agnostic in architecture", "lv": "考博", "sec": "Abstract"}, {"w": "few-shot", "ipa": "fjuː ʃɒt", "pos": "adj.", "m": "少样本的", "ex": "scaling up language models greatly improves task-agnostic, few-shot performance", "lv": "考博", "sec": "Abstract"}, {"w": "autoregressive", "ipa": "ˌɔːtoʊrɪˈɡresɪv", "pos": "adj.", "m": "自回归的", "ex": "an autoregressive language model with 175 billion parameters", "lv": "考博", "sec": "Abstract"}, {"w": "corpus", "ipa": "ˈkɔːrpəs", "pos": "n.", "m": "语料库", "ex": "pre-training on a large corpus of text", "lv": "考博", "sec": "Abstract"}, {"w": "benchmark", "ipa": "ˈbentʃmɑːrk", "pos": "n.", "m": "基准测试", "ex": "substantial gains on many NLP tasks and benchmarks", "lv": "考博", "sec": "Abstract"}, {"w": "gradient", "ipa": "ˈɡreɪdiənt", "pos": "n.", "m": "梯度", "ex": "GPT-3 is applied without any gradient updates or fine-tuning", "lv": "六级", "sec": "Abstract"}, {"w": "surpass", "ipa": "sərˈpæs", "pos": "v.", "m": "超越", "ex": "sometimes even reaching competitiveness with prior state-of-the-art fine-tuning approaches", "lv": "四级", "sec": "Abstract"}, {"w": "demonstration", "ipa": "ˌdemənˈstreɪʃn", "pos": "n.", "m": "演示；示范", "ex": "few-shot demonstrations specified purely via text interaction with the model", "lv": "六级", "sec": "Abstract"}, {"w": "gain", "ipa": "ɡeɪn", "pos": "n.", "m": "收益，提升", "ex": "Recent work has demonstrated substantial gains on many NLP tasks and benchmarks", "lv": "四级", "sec": "Abstract"}, {"w": "evaluator", "ipa": "ɪˈvæljueɪtər", "pos": "n.", "m": "评估者", "ex": "human evaluators have difﬁculty distinguishing", "lv": "考博", "sec": "Abstract"}, {"w": "representation", "ipa": "ˌreprɪzenˈteɪʃn", "pos": "n.", "m": "表征；表示", "ex": "pre-trained language representations in NLP systems", "lv": "六级", "sec": "Intro"}, {"w": "contextual", "ipa": "kənˈtekstʃuəl", "pos": "adj.", "m": "上下文的", "ex": "RNNs with multiple layers of representations and contextual state", "lv": "考博", "sec": "Intro"}, {"w": "paradigm", "ipa": "ˈpærədaɪm", "pos": "n.", "m": "范式", "ex": "this last paradigm has led to substantial progress", "lv": "考研", "sec": "Intro"}, {"w": "supervised", "ipa": "sərˈvɪzɪzd", "pos": "adj.", "m": "有监督的", "ex": "a large supervised training dataset", "lv": "考博", "sec": "Intro"}, {"w": "spurious", "ipa": "ˈspjʊəriəs", "pos": "adj.", "m": "虚假的；谬误的", "ex": "exploit spurious correlations in training data", "lv": "考博", "sec": "Intro"}, {"w": "generalization", "ipa": "ˌdʒenərələˈzeɪʃn", "pos": "n.", "m": "泛化", "ex": "larger models do not necessarily generalize better out-of-distribution", "lv": "四级", "sec": "Intro"}, {"w": "expressiveness", "ipa": "ɪkˈspresɪvnəs", "pos": "n.", "m": "表达能力", "ex": "the expressiveness of the model and the narrowness of the training distribution", "lv": "四级", "sec": "Intro"}, {"w": "meta-learning", "ipa": "ˈmetə lɜːrnɪŋ", "pos": "n.", "m": "元学习", "ex": "one potential route towards addressing these issues is meta-learning", "lv": "考博", "sec": "Intro"}, {"w": "in-context", "ipa": "ɪn ˈkɒntekst", "pos": "adj.", "m": "上下文内", "ex": "in-context learning, using the text input of a pretrained language model", "lv": "考博", "sec": "Intro"}, {"w": "adaptability", "ipa": "əˌdæptəˈbɪləti", "pos": "n.", "m": "适应性", "ex": "this adaptability has practical advantages", "lv": "考博", "sec": "Intro"}, {"w": "instruction", "ipa": "ɪnˈstrʌkʃn", "pos": "n.", "m": "指令", "ex": "a brief directive in natural language", "lv": "四级", "sec": "Intro"}, {"w": "demonstration", "ipa": "ˌdemənˈstreɪʃn", "pos": "n.", "m": "示范", "ex": "at most a tiny number of demonstrations", "lv": "六级", "sec": "Intro"}, {"w": "fluidity", "ipa": "fluːˈɪdəti", "pos": "n.", "m": "流畅性；灵活性", "ex": "we would someday like our NLP systems to have this same fluidity and generality", "lv": "考博", "sec": "Intro"}, {"w": "conceptual", "ipa": "kənˈseptʃuəl", "pos": "adj.", "m": "概念的", "ex": "pointing to a conceptual limitation in our current NLP techniques", "lv": "考博", "sec": "Intro"}, {"w": "inferior", "ipa": "ɪnˈfɪəriər", "pos": "adj.", "m": "较差的", "ex": "this approach still achieves results far inferior to fine-tuning", "lv": "四级", "sec": "Intro"}, {"w": "applicability", "ipa": "əˌplɪkəˈbɪləti", "pos": "n.", "m": "适用性", "ex": "the need for a large dataset of labeled examples for every new task limits the applicability of language models", "lv": "考博", "sec": "Intro"}, {"w": "encompass", "ipa": "ɪnˈkʌmpəs", "pos": "v.", "m": "涵盖，包含", "ex": "a very wide range of possible useful language tasks, encompassing anything from correcting grammar", "lv": "考博", "sec": "Intro"}, {"w": "critique", "ipa": "krɪˈtiːk", "pos": "v.", "m": "评论，批判", "ex": "to critiquing a short story", "lv": "考博", "sec": "Intro"}, {"w": "exploit", "ipa": "ɪkˈsplɔɪt", "pos": "v.", "m": "利用", "ex": "the potential to exploit spurious correlations in training data", "lv": "四级", "sec": "Intro"}, {"w": "fundamentally", "ipa": "ˌfʌndəˈmentli", "pos": "adv.", "m": "根本上", "ex": "fundamentally grows with the expressiveness of the model", "lv": "四级", "sec": "Intro"}, {"w": "nominally", "ipa": "ˈnɑːmɪnəli", "pos": "adv.", "m": "名义上", "ex": "even when it is nominally at human-level", "lv": "六级", "sec": "Intro"}, {"w": "underlying", "ipa": "ˌʌndərˈlaɪɪŋ", "pos": "adj.", "m": "底层的，根本的", "ex": "actual performance on the underlying task", "lv": "六级", "sec": "Intro"}, {"w": "directive", "ipa": "daɪˈrektɪv", "pos": "n.", "m": "指示", "ex": "a brief directive in natural language", "lv": "考博", "sec": "Intro"}, {"w": "competence", "ipa": "ˈkɑːmpɪtəns", "pos": "n.", "m": "能力", "ex" const $=id=>document.getElementById(id);

let S={voice:"us",pause:2000,reveal:true,zh:true,ex:true,order:"seq",skipOn:true,font:"sans",repeat:1,source:"all",timer:0};

/* 收藏 / 已掌握 / 章节范围（跨页面共享） */
const rd=(k)=>{try{return new Set(JSON.parse(localStorage.getItem(k)||"[]"))}catch(e){return new Set()}};
const wr=(k,s)=>{try{localStorage.setItem(k,JSON.stringify([...s]))}catch(e){}};
let stars=rd("listen_qq_star"), favs=rd("listen_qq_fav"), skips=rd("listen_qq_skip");
const SECS=[...new Set(ITEMS.map(i=>i.sec))];
let range={};
try{const r=JSON.parse(localStorage.getItem("listen_qq_range")||"null");if(r)range=r}catch(e){}
SECS.forEach(s=>{if(!(s in range))range[s]=true});

let queue=[], qi=0, playing=false, timer=null, audio=null;
let autoplayBlocked=false;   /* 只有浏览器明确拒绝播放（NotAllowedError）才置位 */

function buildQueue(){
  let list=ITEMS.filter(i=>range[i.sec]!==false);
  if(S.source==="star")      list=list.filter(i=>stars.has(i.w));    /* 只背星标词 */
  else if(S.source==="fav")  list=list.filter(i=>favs.has(i.w));     /* 只读收藏词 */
  else if(S.skipOn)          list=list.filter(i=>!skips.has(i.w));   /* 全部：按开关跳过不读的 */
  if(S.source!=="all")       list=list.filter(i=>!skips.has(i.w));   /* 专背模式下「不读」依然生效 */
  if(S.order==="rand"){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  queue=list;
  if(qi>=queue.length)qi=0;
}
function rebuild(keep){
  const cur=queue[qi];
  buildQueue();
  if(keep&&cur){const k=queue.findIndex(x=>x.w===cur.w);qi=k>=0?k:0}
}
function updateBtns(){
  const w=queue[qi];
  $("favBtn").classList.toggle("on",!!(w&&favs.has(w.w)));
  $("starBtn").classList.toggle("on",!!(w&&stars.has(w.w)));
  $("okBtn").classList.toggle("on",!!(w&&skips.has(w.w)));
}
function updateCounts(){
  $("skipCnt").textContent="已跳过 "+skips.size+" 词";
  $("markCnt").textContent="⭐ "+stars.size+" · ❤ "+favs.size+" · ✓ "+skips.size;
}
/* 标记后统一收尾：重建队列，空了就提示，否则接着播 */
function afterMark(){
  updateBtns(); updateCounts(); rebuild(true);   /* 保留当前词：随机模式下重排也不会跳走 */
  if(!queue.length){ clearT(); stopAudio(); setPlaying(false); emptyHint(); return }
  if(playing)playCurrent(); else render(queue[qi],true);
}
function renderRange(){
  const box=$("rangeBox"); box.innerHTML="";
  SECS.forEach(s=>{
    const c=document.createElement("b");
    c.textContent=s+" "+ITEMS.filter(i=>i.sec===s).length;
    c.className=range[s]?"on":"";
    c.onclick=()=>{
      range[s]=!range[s];
      try{localStorage.setItem("listen_qq_range",JSON.stringify(range))}catch(e){}
      renderRange(); rebuild(true); updateArm();
      if(!playing&&queue[qi])render(queue[qi],true);
    };
    box.appendChild(c);
  });
}

// 皮肤：右上角 👕 点一下按顺序循环，不需要挑颜色
let skinIdx=0;
function applySkin(id,announce){
  const i=SKINS.findIndex(s=>s.id===id);
  skinIdx=i<0?0:i;
  app.dataset.skin=SKINS[skinIdx].id;
  try{localStorage.setItem("listen_qq_skin",SKINS[skinIdx].id)}catch(e){}
  updateArm();
  if(announce)toast("皮肤： "+SKINS[skinIdx].n);
}
$("skinBtn").onclick=()=>{ skinIdx=(skinIdx+1)%SKINS.length; applySkin(SKINS[skinIdx].id,true); };
try{const sv=localStorage.getItem("listen_qq_skin"); if(sv)applySkin(sv,false)}catch(e){}

// 设置段
function seg(box,opts,get,set,after){
  box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("b"); b.textContent=o.t; b.dataset.v=o.v;
    b.className=get()===o.v?"on":"";
    b.onclick=()=>{set(o.v);box.querySelectorAll("b").forEach(x=>x.classList.remove("on"));b.classList.add("on");save();after&&after(o.v)};
    box.appendChild(b);
  });
}
/* 设置改完立刻生效：播放中重播当前词，暂停中按新设置重绘 —— 否则改了像没改 */
function refreshCurrent(msg){
  if(msg)toast(msg);
  if(!queue[qi])return;
  if(playing)playCurrent();
  else render(queue[qi],true);
}
seg($("segVoice"),[{t:"美音",v:"us"},{t:"英音",v:"uk"}],()=>S.voice,v=>S.voice=v,

seg($("segPause"),[{t:"2s",v:2000},{t:"4s",v:4000},{t:"6s",v:6000}],()=>S.pause,v=>S.pause=v,
  ()=>refreshCurrent("每词停顿： "+(S.pause/1000)+" 秒"));
/* 单词重复次数：1/3/5 快捷 + 右侧输入框自定义（1–20） */
function setRepeat(v,persist){
  v=Math.max(1,Math.min(20,Math.round(+v||1)));
  S.repeat=v; $("repInput").value=v;
  $("segRepeat").querySelectorAll("b").forEach(b=>b.classList.toggle("on",+b.dataset.v===v));
  if(persist)save();
}
seg($("segRepeat"),[{t:"1次",v:1},{t:"3次",v:3},{t:"5次",v:5}],()=>S.repeat,v=>S.repeat=v,
  ()=>{setRepeat(S.repeat,false);refreshCurrent("单词重复： "+S.repeat+" 次")});
$("repInput").addEventListener("change",()=>{setRepeat($("repInput").value,true);refreshCurrent("单词重复： "+S.repeat+" 次")});
$("repInput").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
setRepeat(S.repeat||1,false);

];
function applyFont(v){
  const f=FONTS.find(x=>x.v===v)||FONTS[0];
  app.style.setProperty("--wfont",f.f);
}
seg($("segFont"),FONTS.map(x=>({t:x.t,v:x.v})),()=>S.font,v=>{S.font=v;applyFont(v);save()});
$("segFont").querySelectorAll("b").forEach((b,i)=>{b.style.fontFamily=FONTS[i].f;b.style.fontSize="13px"});
applyFont(S.font);

/* 定时停止：到点自动停（最长 60 分钟），词区右上角显示倒计时 */
let timerLeft=0, timerInt=null;
function renderTimer(){
  const m=Math.floor(timerLeft/60), s=timerLeft%60;
  $("timerChip").textContent="⏱ "+m+":"+String(s).padStart(2,"0");
}
function stopTimer(fired){
  if(timerInt){clearInterval(timerInt);timerInt=null}
  timerLeft=0; $("timerChip").style.display="none";
  if(fired){ clearT(); stopAudio(); setPlaying(false); toast("⏱ 定时时间到，已停止播放") }
}
function startTimer(min){
  stopTimer(false);
  if(!min)return;
  timerLeft=Math.round(min*60);
  $("timerChip").style.display=""; renderTimer();
  timerInt=setInterval(()=>{
    timerLeft--;
    if(timerLeft<=0){ stopTimer(true); return }
    renderTimer();
  },1000);
}
seg($("segTimer"),[{t:"关",v:0},{t:"5分",v:5},{t:"10分",v:10},{t:"20分",v:20},{t:"30分",v:30},{t:"60分",v:60}],
  ()=>S.timer,v=>S.timer=v,m=>{ startTimer(m); if(m)toast("⏱ "+m+" 分钟后自动停止") });
if(S.timer>0)startTimer(S.timer);

/* 词库来源：全部 / 只背星标 / 只读收藏 */
function applySource(){
  qi=0; rebuild(false); updateArm(); updateCounts();
  if(!queue.length){ clearT(); stopAudio(); setPlaying(false); emptyHint(); return }
  if(playing)playCurrent(); else render(queue[qi],true);
}
seg($("segSource"),[{t:"全部",v:"all"},{t:"仅⭐",v:"star"},{t:"仅❤",v:"fav"}],()=>S.source,v=>S.source=v,applySource);

seg($("segOrder"),[{t:"顺序",v:"seq"},{t:"随机",v:"rand"}],()=>S.order,v=>S.order=v,
  ()=>{rebuild(true);updateArm();if(!playing&&queue[qi])render(queue[qi],true)});
seg($("segSkip"),[{t:"开",v:true},{t:"关",v:false}],()=>S.skipOn,v=>S.skipOn=v,
  ()=>{rebuild(true);updateArm()});
renderRange(); updateCounts();

$("favBtn").onclick=()=>{
  const w=queue[qi]; if(!w){toast("先进入一个词再收藏");return}
  if(favs.has(w.w)){favs.delete(w.w);toast("已取消收藏「"+w.w+"」")}else{favs.add(w.w);toast("已收藏「"+w.w+"」")}
  wr("listen_qq_fav",favs); afterMark();
};
$("starBtn").onclick=()=>{
  const w=queue[qi]; if(!w){toast("先进入一个词再标星");return}
  if(stars.has(w.w)){stars.delete(w.w);toast("已取消星标「"+w.w+"」")}else{stars.add(w.w);toast("已标星「"+w.w+"」，可只背星标")}
  wr("listen_qq_star",stars); afterMark();
};
$("okBtn").onclick=()=>{
  const w=queue[qi]; if(!w){toast("先进入一个词再标记");return}
  if(skips.has(w.w)){skips.delete(w.w);toast("已恢复朗读「"+w.w+"」")}
  else{skips.add(w.w);toast("此词不再朗读「"+w.w+"」")}
  wr("listen_qq_skip",skips); afterMark();
};
$("clearSkip").onclick=()=>{skips.clear();wr("listen_qq_skip",skips);updateCounts();rebuild(true);toast("已清空「不读」列表")};
$("clearStar").onclick=()=>{stars.clear();wr("listen_qq_star",stars);updateCounts();rebuild(true);toast("已清空星标")};
/* 弯箭头：沿用旧设计语义 = 重听当前词（不想启用时删掉这三行即可） */
$("replayBtn").onclick=()=>{
  if(!queue[qi])return;
  if(!playing)setPlaying(true);
  playCurrent(); toast("重听当前词");
};

// 颜色/封面
function hue(w){let h=7;for(const c of w)h=(h*31+c.charCodeAt(0))%360;return h}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1600)}

// 唱臂：静止垂直在盘右 → 播放落到盘面 → 随队列进度内移
const armBar=document.querySelector(".arm .bar");
const needle=document.querySelector(".needle");
const ARM_REST=0, ARM_START=16, ARM_END=24;
function updateArm(){
  const p=queue.length>1?Math.min(1,qi/(queue.length-1)):0;
  if(app.dataset.skin==="vinylx"){          /* 顶部细针：播放落盘（如图），暂停抬起 */
    needle.style.setProperty("--nd",(playing?6*p:-30).toFixed(2)+"deg");
    return;
  }
  const a=playing?ARM_START+(ARM_END-ARM_START)*p:ARM_REST;
  armBar.style.setProperty("--arm",a.toFixed(2)+"deg");
}

function render(w,reveal){
  app.style.setProperty("--h",hue(w.w));
  $("art").style.opacity=(S.reveal&&!reveal)?.42:1;   /* 先听后现：未揭晓时封面变暗 */
  $("wsec").textContent=w.sec+" · "+w.lv+" · 第 "+(qi+1)+"/"+queue.length+" 词";
  $("wbig").textContent=w.w;
  const ipaRaw=(w.ipa||"").trim().replace(/^[/\[]+|[/\]]+$/g,"");   /* 去掉可能已有的斜线/方括号 */
  $("wipa").textContent=ipaRaw?"/"+ipaRaw+"/":"";                    /* 统一包成 /.../ */
  $("wmean").textContent=(w.pos?w.pos+" ":"")+w.m;
  $("wex").textContent=w.ex?"“"+w.ex+"”":"";
  const hid=S.reveal&&!reveal;
  /* 同一个槽位内原地切换：未揭晓=波浪（正在听），揭晓=释义；高度不变，绝不跳动 */
  $("wav").style.display=hid?"flex":"none";
  $("wtxt").style.display=hid?"none":"";
  $("cur").textContent="第 "+(qi+1)+" 词";
  $("dur").textContent="共 "+queue.length+" 词";
  const pct=queue.length?qi/queue.length*100:0;
  $("fill").style.width=pct+"%"; $("knob").style.left=pct+"%";
  updateBtns();
}

function ttsURL(t,kind){
  if(kind==="zh")return "https://fanyi.baidu.com/gettts?lan=zh&text="+encodeURIComponent(t);
  if(kind==="sent")return "https://fanyi.baidu.com/gettts?lan=en&text="+encodeURIComponent(t);
  return "https://dict.youdao.com/dictvoice?type="+(S.voice==="uk"?0:1)+"&audio="+encodeURIComponent(t);
}
function say(text,kind,cb){
  stopAudio();
  audio=new Audio(ttsURL(text,kind));
  let done=false;
  const fin=ok=>{if(done)return;done=true;cb&&cb(ok)};
  audio.onended=()=>fin(true);
  audio.onerror=()=>fin(false);
  audio.play().catch(err=>{ if(err&&err.name==="NotAllowedError")autoplayBlocked=true; fin(false) });
  setTimeout(()=>fin(false),9000);
}
function stopAudio(){try{if(audio){audio.pause();audio=null}}catch(e){}}
function clearT(){if(timer){clearTimeout(timer);timer=null}}

/* 池子为空（比如「只背星标」但一个都没标）时的提示 */
function emptyHint(){
  const star=S.source==="star";
  $("wsec").textContent="";
  $("wbig").textContent="—";
  $("wipa").textContent="";
  $("wmean").textContent=star?"还没有 ⭐ 星标词":"还没有 ❤ 收藏词";
  $("wex").textContent="点右上角 "+(star?"☆":"❤")+" 标记后，这里会自动连播";
  $("wav").style.display="none";
  $("wtxt").style.display="";
  $("art").style.opacity=1;
  $("cur").textContent="第 0 词"; $("dur").textContent="共 0 词";
  $("fill").style.width="0%"; $("knob").style.left="0%";
}

function playCurrent(){
  clearT();stopAudio();
  const w=queue[qi]; if(!w)return;
  render(w,!(S.reveal));
  updateArm();
  if(!playing)return;
  const goNext=()=>{
    if(S.reveal)render(w,true);
    timer=setTimeout(()=>{qi=(qi+1)%queue.length;playCurrent()},S.pause);
  };
  const afterEx=()=>{ if(S.ex){say(w.ex,"sent",()=>goNext())} else goNext(); };
  const afterZh=()=>{ if(S.zh){setTimeout(()=>say(w.m.replace(/^[a-z]+\.\s*/i,""),"zh",afterEx),450)} else afterEx(); };
  /* 单词可重复朗读 N 次（默认 1），全部读完再走中文/例句 */
  let left=Math.max(1,Math.min(20,Math.round(+S.repeat||1)));
  const again=()=>{
    left--;
    if(left>0){ timer=setTimeout(()=>say(w.w,"word",again),420) }
    else afterZh();
  };
  say(w.w,"word",again);
}

function setPlaying(on){
  playing=on; app.classList.toggle("playing",on);
  $("icPlay").style.display=on?"none":""; $("icPause").style.display=on?"":"none";
  updateArm();
}
$("play").onclick=()=>{ setPlaying(!playing); if(playing)playCurrent(); else {clearT();stopAudio();} };
$("prevBtn").onclick=()=>{if(!queue.length)return;qi=(qi-1+queue.length)%queue.length;if(playing)playCurrent();else render(queue[qi],true)};
$("nextBtn").onclick=()=>{if(!queue.length)return;qi=(qi+1)%queue.length;if(playing)playCurrent();else render(queue[qi],true)};
$("moreBtn").onclick=()=>$("sheet").classList.add("on");
$("listBtn").onclick=()=>$("sheet").classList.add("on");
$("sheetBack").onclick=()=>{$("sheet").classList.remove("on");if(!playing){setPlaying(true);playCurrent()}};
$("backBtn").onclick=()=>{
  if(history.length>1)history.back();          // 从站点点进来的：退回上一页
  else location.href="../../listen/";          // 直接打开的：回听力索引
};
$("ordBtn").textContent=S.order==="rand"?"随机":"顺序";
$("ordBtn").onclick=()=>{
  S.order=S.order==="seq"?"rand":"seq"; save();
  $("ordBtn").textContent=S.order==="rand"?"随机":"顺序";
  rebuild(true); updateArm();
  toast(S.order==="rand"?"随机播放":"顺序播放");
  if(playing)playCurrent(); else if(queue[qi])render(queue[qi],true);
};
$("setupBack").onclick=()=>{$("sheet").classList.remove("on");if(!playing){setPlaying(true);playCurrent()}};
$("bar").onclick=e=>{
  if(!queue.length)return;
  const r=$("bar").getBoundingClientRect();
  qi=Math.min(queue.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*queue.length)));
  if(playing)playCurrent(); else render(queue[qi],true);
};
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();$("play").click()}
  else if(e.key==="ArrowRight")$("nextBtn").click();
  else if(e.key==="ArrowLeft")$("prevBtn").click();
  else if(e.key==="Escape")$("sheet").classList.remove("on");
});

// 释义/例句位置的律动波浪：恢复原来的固定 26 根、紧凑居中
(function(){
  const box=$("wav");
  for(let i=0;i<26;i++){
    const b=document.createElement("i");
    b.style.animationDuration=(0.55+Math.random()*0.55).toFixed(2)+"s";
    b.style.animationDelay=(-Math.random()*0.9).toFixed(2)+"s";
    box.appendChild(b);
  }
})();

// 界面缩放：设置面板里切档（窄屏才生效；宽屏走双栏，固定 1x）
const ZOOMS=[1,1.25,1.5,2];
function setZ(z,persist){
  app.style.setProperty("--z",z);
  const zs=$("segZoom");
  if(zs)zs.querySelectorAll("b").forEach(b=>b.classList.toggle("on",+b.dataset.v===+z));
  if(persist){try{localStorage.setItem("listen_qq_zoom",z)}catch(e){}}
}
seg($("segZoom"),ZOOMS.map(z=>({t:z+"x",v:z})),()=>+(localStorage.getItem("listen_qq_zoom")||1),v=>setZ(v,true));
function measureDesign(){
  const prev=app.style.minHeight; app.style.minHeight="0px";
  const h=app.scrollHeight; app.style.minHeight=prev; return h;
}
addEventListener("resize",()=>{
  if(innerWidth<760 && !localStorage.getItem("listen_qq_zoom")) initZoom();
});
function initZoom(){
  if(innerWidth>=760){ setZ(1,false); return }      // 宽屏：双栏布局，不叠加缩放
  const saved=+(localStorage.getItem("listen_qq_zoom")||0);
  if(saved&&ZOOMS.indexOf(saved)>=0){ setZ(saved,false); return }
  app.style.setProperty("--z","1");
  const dh=Math.max(measureDesign(),640);
  const fit=Math.min(2,(innerWidth-20)/430,(innerHeight-20)/dh);
  const ok=ZOOMS.filter(v=>v<=fit+1e-6);
  setZ(ok.length?ok[ok.length-1]:1,false);
}
initZoom();

// 进入即播放；被浏览器拦截则停在 ▶ 等点击
(function autoStart(){
  buildQueue();
  if(!queue.length){ emptyHint(); return }
  setPlaying(true); playCurrent();
  let heard=false; const mark=()=>{heard=true};
  const iv=setInterval(()=>{if(audio){audio.addEventListener("playing",mark);audio.addEventListener("timeupdate",mark)}},250);
  setTimeout(()=>{
    clearInterval(iv);
    if(heard)return;                        /* 真的出声了：正常播放 */
    if(!autoplayBlocked)return;             /* 没出声但不是被拦（网络慢/无音频设备）：不干预，别误暂停 */
    clearT();stopAudio();setPlaying(false);qi=0;render(queue[0],true);
    toast("浏览器拦截了自动播放，点 ▶ 开始");
  },3000);
})();
</script>
</body>
</html>
