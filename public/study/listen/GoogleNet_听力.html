<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoogleNet_论文词汇_听力</title>
<style>
:root{--bg:#101319;--panel:#181c25;--card:#1d2230;--line:#2a3040;--tx:#e8eaf0;--dim:#9aa3b5;--acc:#ff8c00;--accd:#eb6900;--red:#d33a31}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"PingFang SC","Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px}
.ptitle{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:4px}
h1{font-size:26px;margin-bottom:18px}
h1 b{color:var(--acc)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.sec h3{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec h3 .mini{font-size:12px;font-weight:400}
button{cursor:pointer;font:inherit}
.chip{display:inline-block;padding:5px 13px;margin:0 8px 8px 0;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--dim);font-size:14px}
.chip.on{color:#fff;border-color:var(--acc);background:rgba(255,140,0,.14)}
.chip .n{opacity:.55;font-size:12px;margin-left:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt{padding:7px 16px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--dim);font-size:14px}
.opt.on{color:#fff;border-color:var(--acc);background:rgba(255,140,0,.14)}
select{background:var(--card);color:var(--tx);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
#start{width:100%;margin-top:4px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--accd));color:#fff;font-size:17px;font-weight:700}
#cnt{color:var(--dim);font-size:13px}
.srcState{font-size:12px;color:var(--dim)}

/* ================= 网易云黑胶播放器 ================= */
/* ---- 品牌角标（风格致敬） ---- */
.brandmark{position:absolute;left:28px;bottom:14px;display:flex;align-items:center;gap:9px;opacity:.92;pointer-events:none;z-index:5}
.brandmark .ai{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.brandmark .bn{font-size:14px;font-weight:700;letter-spacing:1px;line-height:1.15}
.brandmark .bn i{display:block;font-style:normal;font-weight:400;font-size:9px;letter-spacing:2px;opacity:.5}
[data-theme="cinema"] .brandmark,[data-theme="glass"] .brandmark,[data-theme="neon"] .brandmark{display:none}
@media (max-width:620px){.brandmark{display:none}}
#toast{position:absolute;bottom:175px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.74);color:#fff;padding:9px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#player{position:fixed;inset:0;display:none;overflow:hidden;background:#171114}
#player.on{display:block}
#nbg{position:absolute;inset:-120px;filter:blur(90px) saturate(1.1);opacity:.55;transition:background 1.2s ease}
#nshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,5,4,.25),rgba(10,5,4,.12) 34%,rgba(8,4,3,.6) 92%)}
.ntop{position:absolute;top:16px;left:0;right:0;display:flex;align-items:flex-start;padding:0 34px}
.nico{background:transparent;border:none;color:rgba(255,255,255,.85);font-size:27px;line-height:1;padding:6px}
.nico:hover{color:#fff}
.ntitles{flex:1;padding:0 18px;text-align:center}
#tword{font-size:16px;font-weight:600;color:rgba(255,255,255,.6);line-height:1.2;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tsub{font-size:15px;color:rgba(255,255,255,.55);margin-top:2px}
/* 唱盘 */
.vinylwrap{position:absolute;top:70px;left:calc(50% - 220px);width:440px;height:440px;transform:scale(.6);transform-origin:top center}
.rotor{position:absolute;inset:0;border-radius:50%;animation:spin 16s linear infinite;animation-play-state:paused}
#player.playing .rotor{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{position:absolute;inset:30px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0b0b0e 0 2px,#151518 2px 5px);box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1),inset 0 0 60px rgba(0,0,0,.55)}
#cover{position:absolute;inset:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.45);transition:background 1.2s ease}
#cletter{font-size:118px;font-weight:900;color:rgba(25,10,4,.82);transition:opacity .3s}
/* 唱针（不随盘转）：pivot 在 (190,-90)，暂停时抬起 */
.needlebox{position:absolute;inset:0;transform-origin:190px -90px;transition:transform .8s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
#player.paused .needlebox{transform:rotate(-33deg)}
.nseg1{position:absolute;left:186px;top:-78px;width:11px;height:180px;border-radius:6px;background:linear-gradient(90deg,#f2f2f5,#b9b9c2);box-shadow:0 3px 10px rgba(0,0,0,.4);transform:rotate(-14deg);transform-origin:6px 8px}
.nseg2{position:absolute;left:231px;top:99px;width:13px;height:130px;border-radius:7px;background:linear-gradient(90deg,#ececf0,#c7c7cf);transform:rotate(55deg);transform-origin:5px 6px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.npivot{position:absolute;left:178px;top:-90px;width:22px;height:22px;border-radius:50%;background:#f4f4f7;box-shadow:0 2px 8px rgba(0,0,0,.5)}
/* 歌词区 */
.nlyr{position:absolute;left:0;right:0;top:336px;bottom:auto;text-align:center;transition:filter .4s,opacity .4s}
.nlyr.hiddenl{filter:blur(9px);opacity:.35}
#bigword{font-size:clamp(54px,8.2vw,102px);font-weight:800;color:#fff;line-height:1.12;letter-spacing:.5px;word-break:break-word;text-shadow:0 4px 40px rgba(0,0,0,.45)}
#ipa{color:rgba(255,255,255,.8);font-size:29px;font-family:Georgia,serif;margin-top:12px}
#ipa .p{color:rgba(255,255,255,.48);font-size:20px;font-family:-apple-system,sans-serif}
#mean{color:#fff;font-size:clamp(28px,3.6vw,46px);font-weight:700;margin-top:10px}
#ex{color:rgba(255,255,255,.55);font-size:20px;font-style:italic;margin-top:14px}
/* 图标排 */
.nicons{position:absolute;left:0;right:0;bottom:140px;text-align:center}
.nico2{font-size:25px;margin:0 26px;cursor:pointer;color:rgba(255,255,255,.85);user-select:none}
.nico2.dim{color:rgba(255,255,255,.55)}
.nico2.fav{color:var(--red);text-shadow:0 0 16px rgba(211,58,49,.5)}
.nico2:hover{color:#fff}
.nico2.fav:hover{color:var(--red)}
#starBtn.on{color:#ffd76a !important;text-shadow:0 0 14px rgba(255,215,106,.55)}
/* 进度 */
.nprog{position:absolute;bottom:108px;left:64px;right:64px;display:flex;align-items:center;gap:14px}
.nprog span{color:rgba(255,255,255,.55);font-size:14px;min-width:44px}
.nprog span:last-child{text-align:right}
.nbar{flex:1;height:2.5px;background:rgba(255,255,255,.25);border-radius:99px;position:relative}
#nfill{position:absolute;left:0;top:0;height:100%;background:#fff;border-radius:99px;width:0}
#nknob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 6px rgba(0,0,0,.5);left:0}
/* 控制行 */
.nctrl{position:absolute;bottom:8px;left:110px;right:110px;display:flex;align-items:center;justify-content:space-between}
.nplay{width:74px;height:74px;border-radius:50%;border:2.5px solid #fff;background:transparent;color:#fff;font-size:21px;display:inline-flex;align-items:center;justify-content:center}
.nplay:hover{transform:scale(1.05)}
.nctrl .nico{font-size:28px}
#ordBtn{font-size:16px;min-width:86px}
#skipBtn{font-size:16px}
#replayBtn{font-size:16px}
@media (max-width:620px){
  .vinylwrap{transform:scale(.5);top:56px}
  .nlyr{top:300px}
  .nctrl{left:40px;right:40px}
  .nprog{left:34px;right:34px}
}

/* ---- 级别徽章 ---- */
.badges{margin-bottom:18px}
.b{display:inline-block;font-size:13px;font-weight:800;padding:3px 12px;border-radius:8px;color:#111;margin:0 4px}
.lv4{background:#4da3ff}.lv6{background:#b07cff}.lvk{background:#ff8c00}.lvp{background:#ff5d5d}
.ovt{background:#39d0d8}.ovg{background:#e06bd6}
[data-theme="netease"] .badges{display:none}

/* ---- 主题：影院黑 ---- */
[data-theme] .vinylwrap{display:none}
[data-theme="netease"] .vinylwrap{display:block}
[data-theme="cinema"] .nicons,[data-theme="neon"] .nicons,[data-theme="ttplayer"] .nicons,[data-theme="ttpod"] .nicons,[data-theme="kugou"] .nicons,[data-theme="kuwo"] .nicons{display:none}
[data-theme="cinema"] #nbg{background:radial-gradient(120% 90% at 50% 38%,#171c2a 0%,#0a0d14 62%,#05070b 100%);filter:none;opacity:1}
[data-theme="cinema"] #nshade{background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 32%,rgba(0,0,0,.38))}
[data-theme="cinema"] #tword{letter-spacing:3px;text-transform:uppercase;font-size:15px}
[data-theme="cinema"] .nlyr{top:50%;transform:translateY(-54%)}
[data-theme="cinema"] #bigword{font-size:clamp(64px,11vw,150px);text-shadow:0 0 80px rgba(255,140,0,.28)}
[data-theme="cinema"] #player.playing #bigword{text-shadow:0 0 90px rgba(255,140,0,.5),0 0 30px rgba(255,140,0,.32)}
[data-theme="cinema"] #ipa{color:#ff9d2e}
[data-theme="cinema"] .nprog{top:50px;bottom:auto;left:0;right:0;padding:0 44px}
[data-theme="cinema"] .nprog span{visibility:hidden}
[data-theme="cinema"] .nctrl{bottom:44px}

/* ---- 主题：玻璃拟态 ---- */
[data-theme="glass"] #nbg{background:linear-gradient(135deg,#1b1140 0%,#2a1a5e 40%,#0f2a5c 100%);filter:none;opacity:1}
[data-theme="glass"] #nbg::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,110,60,.4);filter:blur(120px);top:-120px;left:-80px}
[data-theme="glass"] #nbg::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(70,140,255,.45);filter:blur(130px);bottom:-120px;right:-60px}
[data-theme="glass"] #nshade{background:none}
[data-theme="glass"] .nlyr{top:50%;left:50%;right:auto;transform:translate(-50%,-54%);width:min(800px,92vw);background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(24px);border-radius:44px;padding:42px 52px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
[data-theme="glass"] .nlyr.hiddenl{filter:none;opacity:1}
[data-theme="glass"] .nlyr.hiddenl #bigword{filter:blur(12px);opacity:.4}
[data-theme="glass"] .nlyr.hiddenl #mean,#player .nlyr.hiddenl #ipa{filter:blur(9px);opacity:.4}
[data-theme="glass"] .nlyr.hiddenl #ex{visibility:hidden}
[data-theme="glass"] .badges .b{padding:5px 16px;border-radius:999px;font-size:14px}
[data-theme="glass"] .badges .b+ .b{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
[data-theme="glass"] #ipa{display:inline-block;padding:7px 22px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
[data-theme="glass"] #bigword{text-shadow:0 4px 30px rgba(120,80,255,.5)}

/* ---- 主题：霓虹终端 ---- */
[data-theme="neon"] #nbg{background:#050807;filter:none;opacity:1}
[data-theme="neon"] #nshade{background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
[data-theme="neon"] .nlyr,[data-theme="neon"] #tword,[data-theme="neon"] .nico,[data-theme="neon"] .nplay{font-family:"SF Mono",Menlo,Consolas,monospace}
[data-theme="neon"] .nlyr{top:50%;transform:translateY(-54%)}
[data-theme="neon"] #bigword{color:#3dff8f;text-shadow:0 0 26px rgba(61,255,143,.85),0 0 90px rgba(61,255,143,.4)}
[data-theme="neon"] #player.playing #bigword::after{content:"▌";animation:neonblink 1s steps(2,start) infinite}
@keyframes neonblink{to{visibility:hidden}}
[data-theme="neon"] #ipa{color:#ffb02e;text-shadow:0 0 16px rgba(255,176,46,.6);font-family:inherit}
[data-theme="neon"] #mean{color:#d8ffe9}
[data-theme="neon"] #ex{color:#5f8f74;font-family:inherit}
[data-theme="neon"] .badges{color:#ffb02e;font-size:14px;letter-spacing:4px}
[data-theme="neon"] .badges .b{background:none;color:#ffb02e;padding:0;font-size:14px;letter-spacing:3px}
[data-theme="neon"] #nfill,#neon #nknob{background:#3dff8f}
[data-theme="neon"] #nfill{box-shadow:0 0 12px rgba(61,255,143,.8)}
[data-theme="neon"] #nknob{background:#3dff8f;box-shadow:0 0 10px rgba(61,255,143,.8)}
[data-theme="neon"] .nplay{border-color:#3dff8f;color:#3dff8f}
[data-theme="neon"] .nico{color:rgba(61,255,143,.85)}
[data-theme="neon"] .nico:hover{color:#3dff8f}
[data-theme="neon"] .nico2{color:rgba(61,255,143,.85)}
[data-theme="neon"] .nico2.dim{color:rgba(61,255,143,.5)}
[data-theme="neon"] .nico2.fav{color:#3dff8f;text-shadow:0 0 16px rgba(61,255,143,.5)}

/* ---- 主题：天天动听（桌面歌词绿字） ---- */
[data-theme="ttpod"] #nbg{background:radial-gradient(90% 60% at 50% 10%,#123039 0%,#081318 55%,#04070a 100%);filter:none;opacity:1}
[data-theme="ttpod"] #nshade{background:none}
[data-theme="ttpod"] .nicons{display:none}
[data-theme="ttpod"] .nlyr{top:50%;transform:translateY(-54%)}
[data-theme="ttpod"] #bigword{color:#8dff5e;-webkit-text-stroke:1.5px rgba(0,0,0,.85);text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 26px rgba(141,255,94,.4)}
[data-theme="ttpod"] #ipa{color:#39c6cf;font-family:"SF Mono",Menlo,monospace}
[data-theme="ttpod"] #nfill{background:#39c6cf;box-shadow:0 0 10px rgba(57,198,207,.8)}
[data-theme="ttpod"] #nknob{background:#eafffb;width:14px;height:14px}
[data-theme="ttpod"] .nplay{background:#0e2b31;border-color:#39c6cf;color:#8dff5e}

/* ---- 主题：千千静听（XP 面板 + LED 歌词 + 均衡器） ---- */
[data-theme="ttplayer"] #nbg{background:linear-gradient(180deg,#5c6672,#39424c);filter:none;opacity:1}
[data-theme="ttplayer"] #nshade{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.5))}
[data-theme="ttplayer"] .ntop{background:linear-gradient(180deg,#6f9fd8,#3b6fb0);border-radius:10px 10px 0 0;margin:30px 120px 0;padding:10px 24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.35)}
[data-theme="ttplayer"] .nico{color:#fff}
[data-theme="ttplayer"] .nicons{display:none}
[data-theme="ttplayer"] .nlyr{top:190px}
[data-theme="ttplayer"] #bigword{font-family:"SF Mono",Menlo,monospace;color:#ffb200;text-shadow:0 0 18px rgba(255,178,0,.55);font-size:clamp(44px,6.6vw,84px);letter-spacing:2px}
[data-theme="ttplayer"] #ipa{color:#9fb4c8;font-family:"SF Mono",Menlo,monospace}
[data-theme="ttplayer"] #mean{color:#e8eef5}
[data-theme="ttplayer"] #ex{color:#8b98a6}
[data-theme="ttplayer"] .badges .b{background:#1d2733;color:#ffd76a;border-radius:3px}
[data-theme="ttplayer"] .eqrow{position:absolute;left:0;right:0;top:540px;display:flex;justify-content:center;gap:22px;height:56px;align-items:flex-end}
[data-theme="ttplayer"] .eqrow i{width:10px;height:56px;border-radius:3px;position:relative;background:linear-gradient(180deg,#101418,#05070a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
[data-theme="ttplayer"] .eqrow i::after{content:"";position:absolute;left:-3px;width:16px;height:10px;border-radius:2px;background:linear-gradient(180deg,#ffd76a,#e89b00);top:var(--e,42%)}
[data-theme="ttplayer"] #player.playing .eqrow i::after{animation:eqbob 1.1s ease-in-out infinite alternate}
[data-theme="ttplayer"] .eqrow i:nth-child(2)::after{animation-delay:.14s}
[data-theme="ttplayer"] .eqrow i:nth-child(3)::after{animation-delay:.28s}
[data-theme="ttplayer"] .eqrow i:nth-child(4)::after{animation-delay:.07s}
[data-theme="ttplayer"] .eqrow i:nth-child(5)::after{animation-delay:.34s}
[data-theme="ttplayer"] .eqrow i:nth-child(6)::after{animation-delay:.2s}
[data-theme="ttplayer"] .eqrow i:nth-child(7)::after{animation-delay:.42s}
[data-theme="ttplayer"] .eqrow i:nth-child(8)::after{animation-delay:.1s}
@keyframes eqbob{from{top:12%}to{top:68%}}
[data-theme="ttplayer"] .nprog{bottom:104px}
[data-theme="ttplayer"] #nbar{height:12px;border-radius:4px;background:repeating-linear-gradient(90deg,#0c1013 0 6px,#131a20 6px 8px);overflow:hidden}
[data-theme="ttplayer"] #nfill{background:linear-gradient(180deg,#ffd76a,#e89b00)}
[data-theme="ttplayer"] #nknob{width:8px;height:18px;border-radius:2px;background:#f4f4f7}
[data-theme="ttplayer"] .nprog span{color:#c8d2dc}
[data-theme="ttplayer"] .nctrl{bottom:16px}
[data-theme="ttplayer"] .nplay{background:linear-gradient(180deg,#f0f3f7,#c2ccd8);border:1px solid #8a94a2;color:#1d2733;border-radius:8px}

/* ---- 主题：QQ 音乐 ---- */
[data-theme="qq"] #nbg{background:radial-gradient(80% 60% at 50% 30%,#17222b,#0b1116 70%);filter:none;opacity:1}
[data-theme="qq"] #nbg::after{content:"";position:absolute;inset:0;background:radial-gradient(50% 36% at 50% 34%,rgba(49,194,124,.18),transparent 72%)}
[data-theme="qq"] #nshade{background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.45))}
[data-theme="qq"] .nlyr{top:50%;transform:translateY(-52%)}
[data-theme="qq"] #ipa{color:#31c27c}
[data-theme="qq"] .nico2.fav{color:#31c27c;text-shadow:0 0 14px rgba(49,194,124,.5)}
[data-theme="qq"] .nplay{border-color:#31c27c;color:#31c27c}
[data-theme="qq"] #nfill{background:#31c27c}
[data-theme="qq"] #nknob{background:#31c27c}
[data-theme="qq"] #bigword{text-shadow:0 4px 34px rgba(49,194,124,.35)}

/* ---- 主题：酷狗音乐（蓝色圆环进度） ---- */
[data-theme="kugou"] #nbg{background:linear-gradient(160deg,#06263f,#0a3a5c 55%,#04121f);filter:none;opacity:1}
[data-theme="kugou"] #nshade{background:radial-gradient(60% 40% at 50% 18%,rgba(53,186,250,.28),transparent 70%)}
[data-theme="kugou"] .nicons{display:none}
[data-theme="kugou"] .nlyr{top:50%;transform:translateY(-54%)}
[data-theme="kugou"] #ipa{color:#7fd0ff}
[data-theme="kugou"] #mean{color:#eaf6ff}
[data-theme="kugou"] .nplay{width:88px;height:88px;border:none;background:conic-gradient(#35bafa var(--kp,0%),rgba(255,255,255,.16) 0);color:#fff;font-size:19px;position:relative}
[data-theme="kugou"] .nplay::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#0a2033}
[data-theme="kugou"] .nplay span{position:relative;z-index:1}
[data-theme="kugou"] #nfill{background:#35bafa}
[data-theme="kugou"] #nknob{background:#35bafa}

/* ---- 主题：酷我音乐（金黄圆角） ---- */
[data-theme="kuwo"] #nbg{background:radial-gradient(100% 70% at 50% 0%,#3a2a12 0%,#1c1207 60%,#0c0805 100%);filter:none;opacity:1}
[data-theme="kuwo"] .nicons{display:none}
[data-theme="kuwo"] .nlyr{top:50%;transform:translateY(-54%)}
[data-theme="kuwo"] #ipa{color:#ffce3f}
[data-theme="kuwo"] .nplay{border:none;background:linear-gradient(135deg,#ffd94d,#ffaa00);color:#3a2a00;border-radius:22px;width:84px;font-weight:800;box-shadow:0 10px 30px rgba(255,180,0,.35)}
[data-theme="kuwo"] #nfill{background:#ffce3f}
[data-theme="kuwo"] #nknob{background:#ffce3f}

/* ---- 主题：虾米音乐（白底橙） ---- */
[data-theme="xiami"] #nbg{background:linear-gradient(180deg,#ffffff,#f2f3f7);filter:none;opacity:1}
[data-theme="xiami"] #nshade{background:none}
[data-theme="xiami"] #tword{color:#6a707d}
[data-theme="xiami"] .nico{color:#555}

const SRC_NAME={yd1:"有道·美音",yd0:"有道·英音",bd:"百度",gg:"谷歌"};
const ALL_SRC=["yd1","yd0","bd","gg"];
const ONLINE_VOICES=[["yd1","美式 · 有道（推荐）"],["yd0","英式 · 有道"],["bd","百度翻译 · 女声"],["mute","🔇 不朗读"]];
let ONLINE="yd1";
let SRC_ORDER=["yd1","yd0","bd","gg"];
let audio=null;
function applyVoiceOrder(){
  const i=ALL_SRC.indexOf(ONLINE);
  SRC_ORDER=i<0?ALL_SRC.slice():ALL_SRC.slice(i).concat(ALL_SRC.slice(0,i));
}
function ttsURL(src,t,zh){
  const q=encodeURIComponent(t);
  if(zh){ // 中文释义：有道词典源不支持中文，落到百度/谷歌
    if(src==="bd")return `https://fanyi.baidu.com/gettts?lan=zh&text=${q}&spd=5&source=web`;
    return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh&q=${q}`;
  }
  if(src==="yd1")return `https://dict.youdao.com/dictvoice?type=1&audio=${q}`;
  if(src==="yd0")return `https://dict.youdao.com/dictvoice?type=0&audio=${q}`;
  if(src==="bd")return `https://fanyi.baidu.com/gettts?lan=en&text=${q}&spd=5&source=web`;
  return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${q}`;
}
let saying=0,audioFrac=0;
function updateFrac(f){audioFrac=Math.max(0,Math.min(1,f));updateBar();}
function sayWord(t,onend,kind="word"){ // kind: "word"=全部源 "zh"=中文(百度/谷歌) "sent"=英文整句(百度/谷歌，有道不支持整句)
  if(ONLINE==="mute"){try{if(audio){audio.pause();audio=null}}catch(e){}return false}
  const my=++saying;
  const order=kind==="word"?SRC_ORDER:["bd","gg"];
  trySrc(0,t,my,onend,kind,order);
  return true;
}
function trySrc(i,t,my,onend,kind,order){
  if(my!==saying){return}
  if(i>=order.length){ // 无可用源：当作播完处理，流程不卡死
    const sl=document.getElementById("srcLive");if(sl&&kind==="word")sl.textContent="（无可用源）";
    if(onend)setTimeout(()=>{if(my===saying)onend()},600);
    return;
  }
  const src=order[i];
  const st=document.getElementById("srcState");
  const sl=document.getElementById("srcLive");
  if(kind==="word"){const nm=SRC_NAME[src]||src;
    if(st)st.textContent="源:"+nm;
    if(sl)sl.textContent="· 源:"+nm;}
  try{if(audio){audio.pause();audio=null}}catch(e){}
  const a=new Audio(ttsURL(src,t,kind==="zh"));
  let ok=false,advanced=false,done=false;
  const advance=()=>{ if(!ok&&!advanced&&my===saying){advanced=true;trySrc(i+1,t,my,onend,kind,order);} };
  const finish=()=>{ if(!done&&my===saying){done=true;updateFrac(1);if(onend)onend();} };
  a.addEventListener("playing",()=>{ok=true;});
  a.addEventListener("timeupdate",()=>{ if(my===saying&&a.duration){updateFrac(a.currentTime/a.duration);} });
  a.addEventListener("ended",finish);
  a.addEventListener("error",advance);
  audio=a;
  a.play().catch(advance);
  setTimeout(()=>{ if(!ok&&my===saying&&a.paused)advance(); },2500);
}
function stopAudio(){saying++;try{if(audio){audio.pause();audio=null}}catch(e){}}

/* ---- 设置 ---- */
const S={lv:new Set(["4","6","k","p"]),sec:new Set(DATA.map(s=>s.sec)),order:"seq",pause:2000,mode:"full",zh:false,ex:false,useskip:true};
try{const c=JSON.parse(localStorage.getItem("listen_cfg")||"{}");
  if(c.lv)S.lv=new Set(c.lv); if(c.sec)S.sec=new Set(c.sec);
  if(c.order)S.order=c.order; if(c.pause)S.pause=c.pause; if(c.mode)S.mode=c.mode;
  if(typeof c.zh==="boolean")S.zh=c.zh;
  if(typeof c.ex==="boolean")S.ex=c.ex;
  if(typeof c.useskip==="boolean")S.useskip=c.useskip;
  if(typeof c.voice==="string"&&["yd1","yd0","bd","gg","mute"].includes(c.voice))ONLINE=c.voice;
}catch(e){}
applyVoiceOrder();
function saveCfg(){try{localStorage.setItem("listen_cfg",JSON.stringify({lv:[...S.lv],sec:[...S.sec],order:S.order,pause:S.pause,mode:S.mode,zh:S.zh,ex:S.ex,useskip:S.useskip,voice:ONLINE}))}catch(e){}}
let skips=new Set(); // 已掌握（太简单）的词，全局按词存储
try{skips=new Set(JSON.parse(localStorage.getItem("vocab_skip")||"[]"))}catch(e){}
function saveSkips(){try{localStorage.setItem("vocab_skip",JSON.stringify([...skips]))}catch(e){}}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderChips(){
  const lc={};ITEMS.forEach(w=>lc[w.lv]=(lc[w.lv]||0)+1);
  document.getElementById("lvChips").innerHTML=["4","6","k","p"].map(l=>
    `<button class="chip ${S.lv.has(l)?"on":""}" data-lv="${l}">${LVN[l]}<span class="n">${lc[l]||0}</span></button>`).join("");
  const merged=ITEMS.some(w=>w.paper);
  if(merged){
    const groups={};DATA.forEach(s=>{(groups[s.paper||"未命名词库"]=groups[s.paper||"未命名词库"]||[]).push(s)});
    document.getElementById("secChips").innerHTML=Object.keys(groups).map(p=>{
      const n=groups[p].reduce((a,s)=>a+s.words.length,0);
      const on=groups[p].every(s=>S.sec.has(s.sec));
      const nm=p.length>20?p.slice(0,20)+"…":p;
      return `<button class="chip ${on?"on":""}" data-pap="${esc(p)}">${esc(nm)}<span class="n">${n}</span></button>`;
    }).join("");
  }else{
    document.getElementById("secChips").innerHTML=DATA.map(s=>
      `<button class="chip ${S.sec.has(s.sec)?"on":""}" data-sec="${esc(s.sec)}">${esc(s.icon+" "+s.short)}<span class="n">${s.words.length}</span></button>`).join("");
  }
  document.getElementById("cnt").textContent=`· 已选 ${queue0().length} / ${ITEMS.length} 词`;
  const sc=document.getElementById("skipCnt");if(sc)sc.textContent=`已跳过 ${skips.size} 词`;
}
function updateSkipCnt(){renderChips();}
function queue0(){return ITEMS.filter(w=>S.lv.has(w.lv)&&S.sec.has(w.sec)&&!(S.useskip&&skips.has(w.w)))}
document.getElementById("lvChips").onclick=e=>{const b=e.target.closest("[data-lv]");if(!b)return;
  const l=b.dataset.lv; S.lv.has(l)?S.lv.delete(l):S.lv.add(l); saveCfg();renderChips();};
document.getElementById("secChips").onclick=e=>{const b=e.target.closest("[data-sec],[data-pap]");if(!b)return;
  if(b.dataset.pap){
    const secs=DATA.filter(s=>(s.paper||"未命名词库")===b.dataset.pap).map(s=>s.sec);
    const all=secs.every(k=>S.sec.has(k));
    secs.forEach(k=>all?S.sec.delete(k):S.sec.add(k));
  }else{
    const k=b.dataset.sec; S.sec.has(k)?S.sec.delete(k):S.sec.add(k);
  }
  saveCfg();renderChips();};
document.getElementById("secAll").onclick=()=>{S.sec=new Set(DATA.map(s=>s.sec));saveCfg();renderChips();};
document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{S.order=b.dataset.order;syncOpts();saveCfg();});
document.querySelectorAll("[data-pause]").forEach(b=>b.onclick=()=>{S.pause=+b.dataset.pause;saveCfg();syncOpts();});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;syncOpts();saveCfg();});
function syncOpts(){
  document.querySelectorAll("[data-order]").forEach(b=>b.classList.toggle("on",b.dataset.order===S.order));
  document.querySelectorAll("[data-pause]").forEach(b=>b.classList.toggle("on",+b.dataset.pause===S.pause));
  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  document.getElementById("zhBtn").classList.toggle("on",S.zh);
  document.getElementById("exBtn").classList.toggle("on",S.ex);
  document.getElementById("useSkipBtn").classList.toggle("on",S.useskip);
}

/* ---- 音色选择 + 中文释义 ---- */
const vs=document.getElementById("voiceSel");
vs.innerHTML=ONLINE_VOICES.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
vs.value=ONLINE;
vs.onchange=()=>{ONLINE=vs.value;applyVoiceOrder();saveCfg();
  if(ONLINE!=="mute")sayWord("Hello, let us learn new words together.");};
document.getElementById("zhBtn").onclick=()=>{S.zh=!S.zh;syncOpts();saveCfg();
  if(S.zh)sayWord("语料库",null,"zh");};
document.getElementById("exBtn").onclick=()=>{S.ex=!S.ex;syncOpts();saveCfg();
  if(S.ex)sayWord("The quick brown fox jumps over the lazy dog.",null,"sent");};
document.getElementById("useSkipBtn").onclick=()=>{S.useskip=!S.useskip;syncOpts();saveCfg();renderChips();
  toast(S.useskip?"已开启：朗读时跳过已掌握词":"已关闭：已掌握词也会朗读");};
document.getElementById("clearSkipBtn").onclick=()=>{
  if(!skips.size){toast("跳过列表是空的");return}
  if(confirm("确定清空全部 "+skips.size+" 个已跳过的单词？（之后会重新朗读）")){
    skips.clear();saveSkips();renderChips();toast("已清空跳过列表");}};
const stripPos=m=>m.replace(/^[a-z./]+\s*/,"");

/* ---- 收藏 ---- */
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("vocab_fav")||"[]"))}catch(e){}
function saveFavs(){try{localStorage.setItem("vocab_fav",JSON.stringify([...favs]))}catch(e){}}

/* ---- 播放器 ---- */
let queue=[],qi=0,playing=false,timer=null,toastTimer=null,noteTimer=null,prevW=null;
function stopFx(){if(noteTimer){clearInterval(noteTimer);noteTimer=null}
  const pool=$("notepool");if(pool)pool.innerHTML="";}
function fxSpawnNote(){if(document.body.dataset.theme!=="notes")return;
  const pool=$("notepool");if(!pool)return;
  const n=document.createElement("span");n.className="nt";
  n.textContent=["♪","♫","♩"][Math.floor(Math.random()*3)];
  n.style.left=(8+Math.random()*84)+"%";n.style.fontSize=(18+Math.random()*18)+"px";
  n.style.animationDuration=(4.5+Math.random()*2.5).toFixed(2)+"s";
  pool.appendChild(n);setTimeout(()=>n.remove(),7400);}
function fxStart(){stopFx();
  if(document.body.dataset.theme==="notes")noteTimer=setInterval(fxSpawnNote,780);}
function fxSpawnChip(t){if(document.body.dataset.theme!=="waterfall")return;
  const pool=$("fallpool");if(!pool)return;
  const c=document.createElement("span");c.className="fchip";c.textContent=t;
  pool.appendChild(c);setTimeout(()=>c.remove(),5800);}
function fxInitBars(){if(document.body.dataset.theme!=="spectrum")return;
  document.querySelectorAll("#specrow i").forEach(b=>{b.style.animationDuration=(0.5+Math.random()*0.5).toFixed(2)+"s";b.style.animationDelay=(-Math.random()).toFixed(2)+"s";});}
function toast(msg){const t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("on");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),1400);}
const $=id=>document.getElementById(id);
const P=()=>$("player");
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
function fmt(t){t=Math.max(0,Math.round(t));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function perWord(){return 1.6+(S.zh?1.4:0)+(S.ex?3.8:0)+S.pause/1000}
function updateBar(){
  if(!queue.length)return;
  const pct=Math.min(100,(qi+audioFrac)/queue.length*100);
  $("nfill").style.width=pct+"%";$("nknob").style.left=pct+"%";
  P().style.setProperty("--kp",pct.toFixed(1)+"%");
  $("tel").textContent=fmt(qi*perWord()+audioFrac*1.6);
  $("ttot").textContent=fmt(queue.length*perWord());
}
function hue(w){let h=7;for(const c of w)h=(h*31+c.charCodeAt(0))%360;return h}
function buildQueue(){
  queue=queue0();
  if(S.order==="rand"){for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}}
}
function startPlayer(){
  if(!queue0().length)return;
  buildQueue();qi=0;playing=true;
  $("setup").style.display="none";P().classList.add("on");
  fxStart();playCurrent();
}
function backToSetup(){clearTimer();stopAudio();stopFx();playing=false;P().classList.remove("on","playing","paused");$("setup").style.display="";updateBar();}
function renderPlayer(w,hidden){
  $("tword").innerHTML=`${w.paper?esc(w.paper)+" · ":""}${esc(w.sec)} · ${LVN[w.lv]} · 第 ${qi+1}/${queue.length} 词 <span id="srcLive" style="color:rgba(255,255,255,.4);font-size:13px"></span>`;
  const H=hue(w.w);
  if(document.body.dataset.theme==="netease")$("nbg").style.background=`linear-gradient(175deg,hsl(${H} 62% 42%),hsl(${(H+38)%360} 55% 26%) 58%,#150d0c 96%)`;
  else $("nbg").style.background="";
  if(document.body.dataset.theme==="netease")$("cover").style.background=`linear-gradient(140deg,hsl(${H} 85% 60%),hsl(${(H+32)%360} 82% 50%) 60%,hsl(${(H+55)%360} 70% 42%))`;
  $("cletter").textContent=hidden?"♪":w.w[0].toUpperCase();
  $("cletter").style.opacity=hidden?".55":"1";
  const bw=$("bigword");bw.textContent=hidden?"♪ ♪ ♪":w.w;bw.style.opacity=hidden?".4":"1";
  $("ipa").innerHTML=`/${esc(w.ipa)}/ <span class="p">${esc(w.pos)}</span>`;
  $("mean").textContent=w.m;
  $("ex").textContent=`“${w.ex}”`;
  $("lyrics").classList.toggle("hiddenl",!!hidden);
  $("bigword").classList.toggle("hiddenl",!!hidden);
  if(prevW&&prevW!==w.w)fxSpawnChip(prevW);
  prevW=w.w;
  const bg=$("badges");
  if(bg)bg.innerHTML=`<span class="b ${LVC[w.lv]}">${LVN[w.lv]}</span>`+(w.ov?`<span class="b ${w.ov==="t"?"ovt":"ovg"}">${w.ov==="t"?"雅思托福":"GRE"}</span>`:"");
  $("favBtn").classList.toggle("fav",favs.has(w.w));
  const pt=$("pp2t");if(pt)pt.textContent=playing?"❚❚":"▶";
  const ob=$("ordBtn");if(ob)ob.textContent=S.order==="rand"?"🔀 随机":"⟳ 顺序";
  const sb=$("skipBtn");if(sb)sb.style.display=SHOW_SKIP?"":"none";
  const st=$("starBtn");
  if(st){const on=skips.has(w.w);st.textContent=on?"★":"☆";st.classList.toggle("on",on);st.title=on?"已标记太简单（点此取消）":"太简单？标记后不再朗读";}
  updateBar();
}
function playCurrent(){
  clearTimer();stopAudio();audioFrac=0;
  const w=queue[qi];if(!w)return;
  const hide=playing&&S.mode==="reveal";
  renderPlayer(w,hide);
  P().classList.toggle("playing",playing);
  P().classList.toggle("paused",!playing);
  if(!playing)return;
  const ended=()=>{
    if(S.mode==="reveal")renderPlayer(w,false);
    const go=()=>{timer=setTimeout(()=>{qi=(qi+1)%queue.length;playCurrent();},S.pause)};
    const afterZh=()=>{
      if(S.ex){
        timer=setTimeout(()=>{
          const ok=sayWord(w.ex,go,"sent");
          if(ok===false)go();
        },500);
      }else go();
    };
    if(S.zh){
      timer=setTimeout(()=>{
        const ok=sayWord(stripPos(w.m),afterZh,"zh");
        if(ok===false)afterZh();
      },450);
    }else afterZh();
  };
  const ok=sayWord(w.w,ended);
  if(ok===false){ // 无音频：按固定节奏走
    if(S.mode==="reveal")renderPlayer(w,false);
    timer=setTimeout(()=>{qi=(qi+1)%queue.length;playCurrent();},Math.max(S.pause,1200));
  }
}
function nav(d){qi=(qi+d+queue.length)%queue.length;playing=true;playCurrent();}
function togglePause(){
  playing=!playing;
  if(playing){fxStart();playCurrent();}
  else{clearTimer();stopAudio();stopFx();P().classList.remove("playing");P().classList.add("paused");renderPlayer(queue[qi],false);}
}
$("start").onclick=startPlayer;
$("pp2").onclick=togglePause;
$("prev2").onclick=()=>nav(-1);
$("next2").onclick=()=>nav(1);
$("backBtn").onclick=backToSetup;
$("skipBtn").onclick=()=>{const w=queue[qi];if(!w)return;
  skips.add(w.w);saveSkips();updateSkipCnt();
  queue.splice(qi,1);toast("已掌握，不再朗读「"+w.w+"」");
  if(!queue.length){backToSetup();return}
  if(qi>=queue.length)qi=0;
  playCurrent();};
$("starBtn").onclick=()=>{const w=queue[qi];if(!w)return;
  if(skips.has(w.w)){skips.delete(w.w);saveSkips();renderPlayer(w,false);toast("已取消标记，「"+w.w+"」恢复朗读");}
  else{skips.add(w.w);saveSkips();renderPlayer(w,false);
    const tip=S.useskip?"已标记太简单，不再朗读":"已标记太简单（提示：请在播放方式开启「跳过已掌握词」）";
    toast(tip+"「"+w.w+"」");}
  updateSkipCnt();};
$("listBtn").onclick=backToSetup;
$("replayBtn").onclick=()=>{playing=true;playCurrent();};
$("vwrap").onclick=()=>{playing=true;playCurrent();};
$("ordBtn").onclick=()=>{S.order=S.order==="seq"?"rand":"seq";syncOpts();saveCfg();
  const w=queue[qi];buildQueue();qi=Math.max(0,queue.indexOf(w));
  $("ordBtn").textContent=S.order==="rand"?"🔀 随机":"⟳ 顺序";
  toast(S.order==="rand"?"已切换为随机播放":"已切换为顺序播放");};
$("favBtn").onclick=()=>{const w=queue[qi];if(!w)return;
  favs.has(w.w)?favs.delete(w.w):favs.add(w.w);saveFavs();
  $("favBtn").classList.toggle("fav",favs.has(w.w));};
document.addEventListener("keydown",e=>{
  if(!P().classList.contains("on"))return;
  if(e.code==="Space"){e.preventDefault();togglePause()}
  else if(e.key==="ArrowRight")nav(1);
  else if(e.key==="ArrowLeft")nav(-1);
  else if((e.key==="s"||e.key==="S")&&SHOW_SKIP){$("skipBtn").click()}
  else if(e.key==="Escape")backToSetup();
});

const BRANDS={
 netease:{n:"网易云音乐",c:"#ff7a7a",bg:"#d33a31",ch:"云"},
 qq:{n:"QQ音乐",c:"#31c27c",bg:"#31c27c",ch:"Q"},
 kugou:{n:"酷狗音乐",c:"#5ec5ff",bg:"linear-gradient(135deg,#35bafa,#1877c9)",ch:"K"},
 kuwo:{n:"酷我音乐",c:"#ffce3f",bg:"#ffce3f",ch:"酷",dark:true},
 xiami:{n:"虾米音乐",c:"#ff5a1f",bg:"#ff5a1f",ch:"✕"},
 spotify:{n:"Spotify",c:"#1db954",bg:"#1db954",ch:"♫"},
 ttpod:{n:"天天动听",c:"#39c6cf",bg:"#0e2b31",ch:"听",bord:"#39c6cf"},
 ttplayer:{n:"千千静听",c:"#ffb200",bg:"#3b6fb0",ch:"千"}
};
let SHOW_BRAND=0;
let SHOW_SKIP=0;
function renderBrand(){
  const th=document.body.dataset.theme,b=BRANDS[th],el=$("brandmark");
  if(!el)return;
  if(!SHOW_BRAND||!b){el.style.display="none";return}
  el.style.display="flex";
  el.innerHTML=`<span class="ai" style="background:${b.bg};color:${b.dark?"#3a2a00":"#fff"}${b.bord?";border:1.5px solid "+b.bord:""}">${b.ch}</span>`
    +`<span class="bn" style="color:${b.c}">${b.n}<i>风格致敬</i></span>`;
}
renderChips();syncOpts();updateBar();renderBrand();fxInitBars();
</script>
</body>
</html>
