<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYOL_听力 · 单词连播</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;justify-content:center;font-family:"PingFang SC",-apple-system,sans-serif;background:#111}

  /* ============ 皮肤 ============ */
  .app{
    --h:356;
    --bg-a:#fcf6da; --bg-b:#f8ecb0; --bg-c:#eeda8e;
    --card-bg:rgba(255,252,240,.35); --card-br:rgba(255,255,255,.9);
    --disc-a:#eeda84; --disc-b:#d9bd5e;
    --groove:rgba(150,110,30,.10); --dshadow:rgba(160,120,30,.35);
    --arm-a:rgba(255,255,255,.95); --arm-b:rgba(255,255,255,.7);
    --tx:#2f2416; --tx2:#6b5a35; --tx3:#8a7850;
    --bar-bg:rgba(90,70,30,.25); --bar-fill:#2f2416;
    --sheet-bg:rgba(255,252,240,.97); --accent:#e4574f;
  }
  .app[data-skin="qq"]{
    --bg-a:hsl(356 85% 88%); --bg-b:hsl(352 70% 76%); --bg-c:hsl(348 62% 66%);
    --card-bg:rgba(255,255,255,.22); --card-br:rgba(255,255,255,.75);
    --disc-a:hsl(356 62% 66%); --disc-b:hsl(354 55% 58%);
    --groove:rgba(120,30,30,.10); --dshadow:rgba(120,40,40,.45);
    --tx:#332424; --tx2:#5a4644; --tx3:#6b5450;
    --bar-bg:rgba(70,40,40,.25); --bar-fill:#3a2c2c;
    --sheet-bg:rgba(255,252,250,.96);
  }
  .app[data-skin="nred"]{           /* 网易云 · 红 */
    --bg-a:#fdeeed; --bg-b:#fbdcd9; --bg-c:#f6c6c1;
    --card-bg:rgba(255,255,255,.42); --card-br:rgba(255,255,255,.9);
    --disc-a:#e0584f; --disc-b:#c0342c;
    --groove:rgba(150,40,30,.10); --dshadow:rgba(190,70,60,.35);
    --tx:#3a1f1c; --tx2:#7a524e; --tx3:#9b7a76;
    --bar-bg:rgba(120,50,40,.22); --bar-fill:#c0342c;
    --sheet-bg:rgba(255,246,245,.97); --accent:#d33a31;
  }
  .app[data-skin="qqgreen"]{        /* QQ音乐 · 绿 */
    --bg-a:#eafaf2; --bg-b:#d6f4e6; --bg-c:#bcead6;
    --card-bg:rgba(255,255,255,.45); --card-br:rgba(255,255,255,.9);
    --disc-a:#3fce8c; --disc-b:#22a96c;
    --groove:rgba(20,110,70,.10); --dshadow:rgba(30,150,100,.32);
    --tx:#123328; --tx2:#4a7a66; --tx3:#7ba191;
    --bar-bg:rgba(30,110,80,.2); --bar-fill:#1f9a63;
    --sheet-bg:rgba(246,255,251,.97); --accent:#31c27c;
  }
  .app[data-skin="kugou"]{          /* 酷狗 · 蓝 */
    --bg-a:#e9f6fe; --bg-b:#d3edfd; --bg-c:#b6e0fa;
    --card-bg:rgba(255,255,255,.45); --card-br:rgba(255,255,255,.9);
    --disc-a:#4cc0f7; --disc-b:#1a86d0;
    --groove:rgba(20,90,150,.10); --dshadow:rgba(30,120,190,.32);
    --tx:#0f2b40; --tx2:#4a6c86; --tx3:#7a99b0;
    --bar-bg:rgba(30,90,140,.2); --bar-fill:#1a86d0;
    --sheet-bg:rgba(245,251,255,.97); --accent:#1a9bf0;
  }
  .app[data-skin="xiami"]{          /* 虾米 · 橙（白底） */
    --bg-a:#fff6ef; --bg-b:#ffe9d8; --bg-c:#ffd7ba;
    --card-bg:rgba(255,255,255,.5); --card-br:rgba(255,255,255,.95);
    --disc-a:#ff8a4c; --disc-b:#e85f1f;
    --groove:rgba(160,80,20,.10); --dshadow:rgba(220,120,50,.32);
    --tx:#3d2415; --tx2:#8a5f42; --tx3:#a8856a;
    --bar-bg:rgba(140,80,30,.2); --bar-fill:#e85f1f;
    --sheet-bg:rgba(255,250,245,.97); --accent:#ff5a1f;
  }
  .app[data-skin="netease"]{
    --bg-a:#3a2429; --bg-b:#241619; --bg-c:#150d10;
    --card-bg:rgba(255,255,255,.06); --card-br:rgba(255,255,255,.16);
    --disc-a:#1b1b1b; --disc-b:#0d0d0d;
    --groove:rgba(255,255,255,.055); --dshadow:rgba(0,0,0,.6);
    --tx:#f2ecec; --tx2:rgba(240,232,232,.72); --tx3:rgba(240,232,232,.5);
    --bar-bg:rgba(255,255,255,.22); --bar-fill:#f2ecec;
    --sheet-bg:rgba(28,20,20,.96); --accent:#ec4141;
  }
  .app[data-skin="vinyl"]{
    --bg-a:#eef0f6; --bg-b:#e3e6f0; --bg-c:#d6dae8;
    --card-bg:rgba(255,255,255,.55); --card-br:#fff;
    --disc-a:#1c1c1c; --disc-b:#0c0c0c;
    --groove:rgba(255,255,255,.05); --dshadow:rgba(40,50,90,.4);
    --arm-a:rgba(255,255,255,.95); --arm-b:#c9c9d8;
    --tx:#232333; --tx2:#5b5b76; --tx3:#7b7b95;
    --bar-bg:rgba(40,40,80,.18); --bar-fill:#35354a;
    --sheet-bg:rgba(252,252,255,.96); --accent:#6b6bf2;
  }
  .app[data-skin="gold"]{
    --bg-a:#f7ead0; --bg-b:#efdcbb; --bg-c:#e2c795;
    --card-bg:rgba(255,255,255,.38); --card-br:rgba(255,255,255,.8);
    --disc-a:#4a341c; --disc-b:#2e1f0f;
    --groove:rgba(255,235,200,.07); --dshadow:rgba(90,60,20,.45);
    --arm-a:rgba(255,250,240,.95); --arm-b:rgba(240,225,200,.72);
    --tx:#3a2a12; --tx2:#6b5430; --tx3:#8a7048;
    --bar-bg:rgba(80,55,20,.22); --bar-fill:#4a3418;
    --sheet-bg:rgba(255,250,240,.97); --accent:#b8860b;
  }
  .app[data-skin="sakura"]{         /* 樱花粉 */
    --bg-a:#fdeef3; --bg-b:#f9d7e2; --bg-c:#f4c2d4;
    --card-bg:rgba(255,255,255,.42); --card-br:rgba(255,255,255,.9);
    --disc-a:#f08cb2; --disc-b:#e0618f;
    --groove:rgba(160,50,90,.10); --dshadow:rgba(210,90,140,.35);
    --tx:#3d1f2b; --tx2:#7a4f61; --tx3:#9b7486;
    --bar-bg:rgba(140,60,95,.2); --bar-fill:#e0618f;
    --sheet-bg:rgba(255,247,250,.97); --accent:#e8638c;
  }
  .app[data-skin="matcha"]{         /* 抹茶（同全站主题色） */
    --bg-a:#f1f4ea; --bg-b:#e4ecd7; --bg-c:#d5e2c2;
    --card-bg:rgba(255,255,255,.5); --card-br:rgba(255,255,255,.92);
    --disc-a:#93b073; --disc-b:#66854a;
    --groove:rgba(70,100,40,.10); --dshadow:rgba(100,130,70,.32);
    --tx:#2c3a1e; --tx2:#5d7247; --tx3:#84976d;
    --bar-bg:rgba(80,110,50,.2); --bar-fill:#5f7d46;
    --sheet-bg:rgba(250,252,246,.97); --accent:#6b8e4e;
  }
  .app[data-skin="mint"]{           /* 薄荷 */
    --bg-a:#eefaf7; --bg-b:#daf2ec; --bg-c:#c2e8df;
    --card-bg:rgba(255,255,255,.48); --card-br:rgba(255,255,255,.92);
    --disc-a:#55c7b2; --disc-b:#2ba58f;
    --groove:rgba(20,110,95,.10); --dshadow:rgba(40,150,130,.3);
    --tx:#12332c; --tx2:#4a7368; --tx3:#7a998f;
    --bar-bg:rgba(30,110,95,.2); --bar-fill:#2ba58f;
    --sheet-bg:rgba(247,253,251,.97); --accent:#2bbfa3;
  }
  .app[data-skin="ocean"]{          /* 海盐蓝 */
    --bg-a:#eef5fc; --bg-b:#dcebf9; --bg-c:#c5ddf3;
    --card-bg:rgba(255,255,255,.48); --card-br:rgba(255,255,255,.92);
    --disc-a:#63a1dd; --disc-b:#3a6fb8;
    --groove:rgba(30,80,150,.10); --dshadow:rgba(60,110,180,.32);
    --tx:#122a44; --tx2:#4a6886; --tx3:#7a93ab;
    --bar-bg:rgba(40,90,150,.2); --bar-fill:#3a6fb8;
    --sheet-bg:rgba(247,251,255,.97); --accent:#3a7bd5;
  }
  .app[data-skin="grape"]{          /* 星空紫 */
    --bg-a:#f2eefa; --bg-b:#e5dcf6; --bg-c:#d4c6ee;
    --card-bg:rgba(255,255,255,.45); --card-br:rgba(255,255,255,.9);
    --disc-a:#9a7fda; --disc-b:#7257bd;
    --groove:rgba(80,50,150,.10); --dshadow:rgba(120,90,190,.32);
    --tx:#2c2144; --tx2:#5f4f80; --tx3:#8677a3;
    --bar-bg:rgba(90,60,160,.2); --bar-fill:#7257bd;
    --sheet-bg:rgba(251,249,255,.97); --accent:#7c5cd6;
  }
  .app[data-skin="amusic"]{         /* Apple Music 红 */
    --bg-a:#fff4f4; --bg-b:#ffe3e5; --bg-c:#ffd2d6;
    --card-bg:rgba(255,255,255,.5); --card-br:rgba(255,255,255,.95);
    --disc-a:#fb5c74; --disc-b:#e11d3f;
    --groove:rgba(170,20,50,.10); --dshadow:rgba(230,50,80,.32);
    --tx:#3d1420; --tx2:#844a58; --tx3:#a87581;
    --bar-bg:rgba(150,30,60,.2); --bar-fill:#e11d3f;
    --sheet-bg:rgba(255,248,248,.97); --accent:#fa233b;
  }
  .app[data-skin="mocha"]{          /* 摩卡棕 */
    --bg-a:#f7f1ea; --bg-b:#eee1d3; --bg-c:#e0cdb8;
    --card-bg:rgba(255,255,255,.45); --card-br:rgba(255,255,255,.88);
    --disc-a:#7d5c42; --disc-b:#553a28;
    --groove:rgba(90,60,35,.10); --dshadow:rgba(120,85,55,.35);
    --tx:#38271a; --tx2:#6e5540; --tx3:#93795f;
    --bar-bg:rgba(110,75,45,.2); --bar-fill:#5d4128;
    --sheet-bg:rgba(253,250,246,.97); --accent:#8b5e3c;
  }
  .app[data-skin="spotify"]{        /* Spotify 黑绿 */
    --bg-a:#1d2420; --bg-b:#121713; --bg-c:#0b0e0c;
    --card-bg:rgba(255,255,255,.06); --card-br:rgba(255,255,255,.15);
    --disc-a:#181d18; --disc-b:#0c0f0c;
    --groove:rgba(255,255,255,.05); --dshadow:rgba(0,0,0,.6);
    --tx:#f0f5f0; --tx2:rgba(235,245,235,.72); --tx3:rgba(235,245,235,.5);
    --bar-bg:rgba(255,255,255,.2); --bar-fill:#f0f5f0;
    --sheet-bg:rgba(18,23,19,.96); --accent:#1db954;
  }
  .app[data-skin="midnight"]{       /* 深夜蓝（暗色） */
    --bg-a:#1e2740; --bg-b:#151c30; --bg-c:#0d1220;
    --card-bg:rgba(255,255,255,.06); --card-br:rgba(255,255,255,.15);
    --disc-a:#141a2b; --disc-b:#090c15;
    --groove:rgba(255,255,255,.05); --dshadow:rgba(0,0,0,.6);
    --tx:#eef2fb; --tx2:rgba(235,240,250,.72); --tx3:rgba(235,240,250,.5);
    --bar-bg:rgba(255,255,255,.2); --bar-fill:#eef2fb;
    --sheet-bg:rgba(18,24,40,.96); --accent:#4a9eff;
  }
  .app[data-skin="vinylx"]{          /* 悬浮黑胶（参照网易云图标：黑盘+大蓝标+顶部细针） */
    --bg-a:#e9e8f0; --bg-b:#e9e8f0; --bg-c:#e2e1ec;
    --card-bg:transparent; --card-br:transparent;
    --disc-a:#191919; --disc-b:#0b0b0b;
    --groove:rgba(255,255,255,.055); --dshadow:rgba(70,70,110,.28);
    --tx:#2b2b38; --tx2:#5c5c6e; --tx3:#8b8b9c;
    --bar-bg:rgba(60,60,90,.18); --bar-fill:#2b2b38;
    --sheet-bg:rgba(250,250,253,.97); --accent:#5b5bd6;
  }
  .app[data-skin="vinylx"] .card{background:transparent;border-color:transparent;box-shadow:none}
  .app[data-skin="vinylx"] .vinyl{box-shadow:0 0 0 2px rgba(255,255,255,.45),0 16px 36px rgba(70,70,110,.3)}
  .app[data-skin="vinylx"] .art{inset:24%;box-shadow:none;
    background:radial-gradient(circle at 32% 26%,#7a7ae8,#4b4bcd 62%,#3d3dbe)}
  .app[data-skin="vinylx"] .arm{display:none}
  .app[data-skin="vinylx"] .needle{display:block}
  .app{
    position:relative;width:min(430px,100vw);max-width:430px;overflow:hidden;
    min-height:calc(100vh / var(--z,1));   /* 缩放后仍刚好铺满一屏 */
    zoom:var(--z,1);                        /* 整体等比放大（含所有 px 尺寸） */
    display:flex;flex-direction:column;color:var(--tx);
    background:
      radial-gradient(120% 60% at 85% 4%, var(--bg-a) 0%, transparent 55%),
      radial-gradient(140% 70% at 15% 30%, var(--bg-b) 0%, transparent 60%),
      linear-gradient(178deg,var(--bg-b) 0%,var(--bg-a) 55%,var(--bg-c) 100%);
    transition:background .5s,color .5s;
  }

  /* 顶栏 */
  .top{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
  .top .pt{flex:1;min-width:0;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .top .ic svg{width:20px;height:20px;stroke:var(--tx2);fill:none;stroke-width:2}
  .top .dot{stroke:var(--tx2);fill:var(--tx2)}
  /* 收藏/星标：未点亮时一律中性灰，避免被皮肤色染成"像已收藏的红心" */
  .top .ic.neutral svg{stroke:rgba(118,124,134,.92)}
  .top .ic.neutral .slash{stroke:rgba(118,124,134,.92)}
  .top .ic.neutral.on svg{stroke:var(--accent)}
  .top .ic.on svg{stroke:var(--accent)}
  .top .ic.on svg .fillable{fill:var(--accent)}
  /* 「跳过/已掌握」新图标是实心路径（无描边）：中性灰 → 点亮用强调色 */
  .top .ic svg.solid{stroke:none;fill:rgba(118,124,134,.92)}
  .top .ic.on svg.solid{fill:var(--accent)}
  /* 斜线 = 「已划掉」标记：默认不显示，点了 ✓ 之后才划掉 */
  .top .ic svg .slash{opacity:0;transition:opacity .2s}
  .top .ic.on svg .slash{opacity:1}
  .top{gap:9px}
  .top .ic{width:30px;height:30px}
  .top .ic svg{width:19px;height:19px}
  .srow.col{flex-direction:column;align-items:stretch;gap:9px}
  .seg.wrap{flex-wrap:wrap;justify-content:flex-start}
  .clr{font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600}
  .repin{width:56px;padding:4px 6px;border-radius:8px;border:1px solid var(--bar-bg);
    background:transparent;color:var(--tx);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
  .repin:focus{outline:none;border-color:var(--accent)}

  /* 唱片卡 */
  .card{
    position:relative;margin:10px 26px 0;aspect-ratio:1/1.02;border-radius:30px;
    background:var(--card-bg);border:2px solid var(--card-br);
    box-shadow:0 18px 44px var(--dshadow);flex:none;
  }
  .vinyl{
    position:absolute;left:50%;top:50%;width:86%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,var(--groove) 0 1px,transparent 1px 4px),
      radial-gradient(circle at 50% 50%,var(--disc-a) 0 61%,var(--disc-b) 61% 100%);
    box-shadow:0 10px 30px var(--dshadow),inset 0 0 0 1px rgba(255,255,255,.18);
    animation:spin 14s linear infinite;animation-play-state:paused;
  }
  .playing .vinyl{animation-play-state:running}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .vinyl::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 200deg,transparent 0 40deg,rgba(255,255,255,.22) 62deg,
      transparent 92deg 210deg,rgba(255,255,255,.12) 235deg,transparent 268deg);
  }
  /* 盘心标签：跟随皮肤色系（同盘深色 + 白色高光），不再用单词色相，避免红胶紫标这种撞色 */
  .art{
    position:absolute;inset:27%;border-radius:50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
      var(--disc-b);
    box-shadow:0 0 0 5px rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;
  }
  .art svg{width:42%;height:42%;fill:#fff;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
  .art .cl{font-size:clamp(30px,8vw,46px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3)}

  /* 唱臂 */
  .arm{position:absolute;top:-4px;right:0;width:110px;height:100%;z-index:5;pointer-events:none}
  .arm .cap{position:absolute;top:0;right:30px;width:30px;height:16px;border-radius:9px 9px 5px 5px;background:var(--arm-a);box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .arm .pivot{position:absolute;top:12px;right:20px;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--arm-a),var(--arm-b));box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .arm .pivot::before{content:"";position:absolute;inset:13px;border-radius:50%;background:rgba(140,140,160,.35)}
  .arm .bar{position:absolute;top:32px;right:40px;width:7px;height:70%;border-radius:4px;
    background:linear-gradient(var(--arm-a),var(--arm-b));transform-origin:3.5px 3.5px;
    transform:rotate(var(--arm,0deg));transition:transform .6s cubic-bezier(.34,1.2,.5,1);
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .arm .bar .head{position:absolute;left:50%;bottom:-10px;width:22px;height:44px;
    transform:translateX(-50%) rotate(12deg);border-radius:11px;
    background:linear-gradient(var(--arm-a),var(--arm-b));box-shadow:0 3px 8px rgba(0,0,0,.22)}

  /* 顶部细针（vinylx 悬浮黑胶：轴点在上，细臂弯折落盘，照网易云图标） */
  .needle{display:none;position:absolute;left:50%;top:-2px;width:26%;
    transform:translateX(-50%) rotate(var(--nd,-30deg));
    transform-origin:34% 3%;                 /* 旋转轴 = 轴点圆心 */
    z-index:6;pointer-events:none;transition:transform .7s cubic-bezier(.34,1.2,.5,1)}
  .needle svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}

  /* 主区：左唱片 + 右信息列；PC 自动变横向矩形 */
  .main{flex:1;display:flex;flex-direction:column;min-height:0}
  .side{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .timerChip{position:absolute;right:0;top:0;font-size:11px;color:var(--tx3);opacity:.9;
    letter-spacing:.4px;font-variant-numeric:tabular-nums;pointer-events:none}
  /* 当前词的来源标记（星标/收藏/已跳过）：点一下即取消，专门救误点 */
  .mkbadge{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
  .mkbadge .mk{font-style:normal;display:flex;align-items:center;font-size:11px;line-height:1;
    padding:5px 8px;border-radius:99px;
    border:1px solid var(--accent);color:var(--accent);cursor:pointer;user-select:none;
    background:transparent;transition:opacity .15s,transform .15s}
  .mkbadge .mk svg{width:14px;height:14px;display:block}
  .mkbadge .mk svg.fill{fill:currentColor}
  /* 标记统计：和「词库来源」用同一套图标，不再用 ⭐❤✓ 这种混搭 */
  #markCnt{display:flex;align-items:center;gap:13px}
  #markCnt b{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--tx2)}
  #markCnt b svg{width:14px;height:14px;display:block}
  #markCnt b svg.fill{fill:currentColor}
  #clearBox{display:flex;gap:6px}
  #clearBox b{display:flex;align-items:center;gap:3px;padding:5px 9px;font-size:12px}
  #clearBox b svg{width:13px;height:13px;display:block}
  #clearBox b svg.fill{fill:currentColor}
  #clearBox b i{font-style:normal;font-size:10px;opacity:.65}
  .mkbadge .mk:hover{opacity:.6}
  .mkbadge .mk:active{transform:scale(.94)}
  .mkbadge .mk::after{content:" ✕"}
  @media (min-width:760px){
    /* 宽屏：定成横向矩形（16:10）并随缩放等比，别再被 100vh 拉成竖长方形 */
    body{align-items:center}
    .app{width:min(1280px,calc(96vw / var(--z,1)));max-width:none;zoom:var(--z,1);
      aspect-ratio:16/10;min-height:0;max-height:calc(96vh / var(--z,1));margin:auto;padding-bottom:8px}
    .main{flex-direction:row;align-items:center;gap:40px;padding:8px 30px 0}
    /* 唱片按视口宽高的较小者放大：既大又不至于撑出屏幕 */
    .main>.card{margin:0;flex:0 0 calc(clamp(400px,min(40vw,66vh),640px) / var(--z,1));align-self:center}
    .side{align-self:stretch;justify-content:flex-start}
    /* 单词区在「角标」与「底部控制」之间的剩余空间里垂直居中 → 整体下移到中间 */
    .side .word{padding:0;min-height:0;text-align:center;margin-top:auto;margin-bottom:auto}
    .side .sec{font-size:11.5px;margin-bottom:12px}
    .side .word .big{font-size:clamp(50px,5vw,74px);text-shadow:0 2px 10px rgba(0,0,0,.06)}
    .side .word .ipa{font-size:20px;transform:translateY(-9px)}
    .side .word .wrow{gap:12px}
    .side .word .mean{font-size:clamp(16px,1.5vw,21px)}
    .side .word .ex{font-size:17px}
    .side .wav{--wvh:28px;height:42px;gap:5px}
    .side .slot{min-height:96px;margin-top:34px;margin-bottom:26px}
    .side .wav i{width:5px}
    .side .skins{margin-top:8px}   /* 由 .word 的下 auto 外边距顶到列底 */
    /* 用 .side 前缀提权重：压过写在后面的基础规则（margin-top:auto 等） */
    .side .prog{padding:14px 0 0}
    .side .ctrl{margin-top:8px;padding:6px 0 0}
    .side .ctrl svg{width:27px;height:27px}
    .side .ctrl .ord{font-size:13px}
    .side .play{width:72px;height:72px}
    .side .play svg{width:29px;height:29px}
    .top .pt{font-size:13px}
  }

  /* 波浪：恢复原来的紧凑居中款，峰值收敛（不铺满、不高） */
  .wav{--wvh:22px;display:none;align-items:flex-end;justify-content:center;gap:4px;height:34px}
  .wav i{width:4px;height:5px;border-radius:2px;background:var(--tx3);opacity:.5;transition:opacity .3s}
  .playing .wav i{opacity:.85;animation:wv .8s ease-in-out infinite alternate}
  @keyframes wv{from{height:5px}to{height:var(--wvh,22px)}}

  /* 单词区 */
  .word{padding:20px 26px 0;text-align:center;min-height:150px}
  /* 章节/级别/进度：左上角角标，弱化处理不抢单词（小字 + 拉开距离 + 降透明度） */
  .side .sec{font-size:10px;color:var(--tx3);opacity:.72;margin:0 0 10px;text-align:left;letter-spacing:.3px}
  .word .wrow{display:inline-flex;align-items:flex-end;justify-content:center;gap:9px}
  .word .big{font-size:clamp(36px,9.5vw,50px);font-weight:800;letter-spacing:.5px;line-height:1.15;color:var(--tx);
    font-family:var(--wfont,"PingFang SC",-apple-system,sans-serif)}
  /* 音标：贴在单词右下角当注音，不再单独占一行 */
  .word .ipa{font-size:15px;color:var(--tx2);white-space:nowrap;transform:translateY(-7px)}
  /* 固定槽位：高度锁死，波浪↔释义原地切换，不产生位移 */
  .slot{display:flex;align-items:center;justify-content:center;min-height:72px;margin-top:26px}
  .slot .txt{width:100%}
  /* 释义：压成一行、字号收小（过长时省略，避免撑破排版） */
  .word .mean{font-size:16px;font-weight:700;color:var(--tx);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .word .ex{font-size:13.5px;font-style:italic;color:var(--tx3);margin-top:8px;line-height:1.5}
  .hiddenl{filter:blur(9px);opacity:.55;transition:filter .4s,opacity .4s}

  /* 皮肤切换 */
  .skins{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
  .skins .lb{font-size:10.5px;color:var(--tx3)}
  .skins .sw{width:25px;height:25px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 7px rgba(0,0,0,.2);transition:transform .2s}
  .skins .sw:hover{transform:scale(1.08)}
  .skins .sw.on{border-color:var(--accent);transform:scale(1.14)}
  .skins .zbtn{font-size:10.5px;color:var(--tx2);border:1px solid var(--bar-bg);border-radius:99px;padding:3px 10px;cursor:pointer;user-select:none}
  .skins .zbtn:hover{color:var(--accent);border-color:var(--accent)}

  /* 进度：时间贴近两端（对齐官方） */
  .prog{display:flex;align-items:center;gap:10px;padding:14px 20px 0}
  .prog .t{flex:none;min-width:50px;font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .prog .t.r{text-align:right}
  .bar{position:relative;flex:1;height:4px;border-radius:2px;background:var(--bar-bg);cursor:pointer}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--bar-fill)}
  .bar .knob{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:var(--bar-fill);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}

  /* 控制：全宽分布 顺序 · 快退 · 播放 · 快进 · 列表 */
  .ctrl{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 22px 26px}
  .ctrl svg{width:24px;height:24px;stroke:var(--tx);fill:none;stroke-width:1.8;cursor:pointer;transition:stroke .15s}
  .ctrl svg:hover{stroke:var(--accent)}
  .ctrl .ord{font-size:12px;color:var(--tx2);cursor:pointer;user-select:none;min-width:36px}
  .ctrl .ord:hover{color:var(--accent)}
  .play{width:64px;height:64px;border-radius:50%;background:transparent;border:2.5px solid var(--tx);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .play:active{transform:scale(.92)}
  .play svg{width:26px;height:26px;stroke:none;fill:var(--tx)}

  /* 设置面板 */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--sheet-bg);backdrop-filter:blur(14px);
    border-radius:22px 22px 0 0;padding:0 22px 28px;transform:translateY(105%);
    /* 关键：面板必须限高且可滚动，否则顶部选项会被顶出屏幕点不到 */
    max-height:calc(100% - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    transition:transform .35s cubic-bezier(.3,1,.4,1);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .sheet.on{transform:translateY(0)}
  .sheet::-webkit-scrollbar{width:6px}
  .sheet::-webkit-scrollbar-thumb{background:var(--bar-bg);border-radius:3px}
  .sheet h3{font-size:14px;color:var(--tx);margin-bottom:0}
  /* 标题行吸顶：滚动时「返回播放」始终可见 */
  .shd{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;
    background:var(--sheet-bg);padding:16px 0 12px}
  .shb{font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;user-select:none}
  .shb:hover{opacity:.75}
  .top .ic{flex:none}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    padding:10px 0;border-bottom:1px solid var(--bar-bg)}
  .srow:last-of-type{border-bottom:none}
  .srow span{font-size:13.5px;color:var(--tx);white-space:nowrap}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg b{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;
    border:1px solid var(--bar-bg);color:var(--tx2);display:flex;align-items:center;justify-content:center}
  .seg b svg{width:15px;height:15px;display:block}
  .seg b.icn{padding:5px 10px;min-width:34px}
  .seg b.off{opacity:.5;cursor:not-allowed;border-style:dashed}
  .seg b svg.fill{fill:currentColor}
  .seg b.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sback{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:1px solid var(--bar-bg);
    background:transparent;color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}

  .toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
    background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:8px 14px;border-radius:99px;
    opacity:0;transition:.3s;pointer-events:none;z-index:30;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app" data-skin="lemon">

  <div class="main">

<script>
const ITEMS=[{"w": "augmented", "ipa": "ɔːɡˈmen.tɪd", "pos": "adj.", "m": "增强的，经过数据增强处理的", "ex": "From an augmented view of an image, we train the online network to predict the target network representation.", "lv": "考研", "ov": "", "sec": "Abstract"}, {"w": "representation", "ipa": "ˌrep.rɪ.zenˈteɪ.ʃən", "pos": "n.", "m": "表示，表征", "ex": "BYOL relies on two neural networks that interact and learn from each other for representation learning.", "lv": "六级", "ov": "", "sec": "Abstract"}, {"w": "collapsed", "ipa": "kəˈlæpst", "pos": "adj.", "m": "坍塌的，崩溃的", "ex": "While this objective admits collapsed solutions, we empirically show that BYOL does not converge to such solutions.", "lv": "考博", "ov": "", "sec": "Abstract"}, {"w": "robust", "ipa": "roʊˈbʌst", "pos": "adj.", "m": "鲁棒的，稳健的", "ex": "BYOL achieves a new state of the art and is more robust to the choice of image augmentations.", "lv": "六级", "ov": "", "sec": "Abstract"}, {"w": "linear evaluation", "ipa": "ˈlɪn.i.ər ɪˌvæl.juˈeɪ.ʃən", "pos": "n.", "m": "线性评估", "ex": "BYOL reaches 74.3% top-1 classification accuracy on ImageNet using a linear evaluation with a ResNet-50 architecture.", "lv": "考博", "ov": "", "sec": "Abstract"}, {"w": "benchmark", "ipa": "ˈbentʃ.mɑːrk", "pos": "n.", "m": "基准测试", "ex": "BYOL performs on par or better than the current state of the art on both transfer and semi-supervised benchmarks.", "lv": "考博", "ov": "", "sec": "Abstract"}, {"w": "state-of-the-art", "ipa": "ˌsteɪt.əv.ðəˈɑːrt", "pos": "adj.", "m": "最先进的", "ex": "While state-of-the-art methods rely on negative pairs, BYOL achieves a new state of the art without them.", "lv": "考博", "ov": "", "sec": "Abstract"}, {"w": "classification", "ipa": "ˌklæs.ɪ.fɪˈkeɪ.ʃən", "pos": "n.", "m": "分类", "ex": "BYOL reaches 74.3% top-1 classification accuracy on ImageNet.", "lv": "四级", "ov": "", "sec": "Abstract"}, {"w": "representation", "ipa": "ˌrep.rɪ.zenˈteɪ.ʃən", "pos": "n.", "m": "表示，表征", "ex": "Learning good image representations is a key challenge in computer vision.", "lv": "六级", "ov": "", "sec": "Intro"}, {"w": "contrastive", "ipa": "kənˈtræs.tɪv", "pos": "adj.", "m": "对比的", "ex": "State-of-the-art contrastive methods are trained by reducing the distance between representations of different augmented views.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "augmentation", "ipa": "ˌɔːɡ.menˈteɪ.ʃən", "pos": "n.", "m": "增强，数据增强", "ex": "Their performance critically depends on the choice of image augmentations.", "lv": "考博", "ov": "GRE", "sec": "Intro"}, {"w": "bootstrap", "ipa": "ˈbuːt.stræp", "pos": "v.", "m": "自举，引导", "ex": "BYOL iteratively bootstraps the outputs of a network to serve as targets for an enhanced representation.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "latently", "ipa": "ˈleɪ.tənt.li", "pos": "adv.", "m": "潜在地，隐含地", "ex": "BYOL trains its online network to predict the target network's representation of another augmented view.", "lv": "六级", "ov": "", "sec": "Intro"}, {"w": "hypothesize", "ipa": "haɪˈpɒθ.ə.saɪz", "pos": "v.", "m": "假设，假定", "ex": "We hypothesize that the combination of a predictor and a moving average avoids collapsed solutions.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "pretext", "ipa": "ˈpriː.tekst", "pos": "n.", "m": "借口， pretext task 伪装任务", "ex": "Many different training approaches have been proposed, usually relying on visual pretext tasks.", "lv": "六级", "ov": "", "sec": "Intro"}, {"w": "negative pairs", "ipa": "ˈneɡ.ə.tɪv perz", "pos": "n.", "m": "负样本对", "ex": "These methods need careful treatment of negative pairs by either relying on large batch sizes or memory banks.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "retrieve", "ipa": "rɪˈtriːv", "pos": "v.", "m": "检索，取回", "ex": "Memory banks or customized mining strategies are used to retrieve the negative pairs.", "lv": "六级", "ov": "", "sec": "Intro"}, {"w": "incentivized", "ipa": "ɪnˈsen.tɪ.vaɪzd", "pos": "v.", "m": "激励，鼓励", "ex": "BYOL is incentivized to keep any information captured by the target representation into its online network.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "sufﬁciently", "ipa": "səˈfɪʃ.ənt.li", "pos": "adv.", "m": "充分地", "ex": "This discriminative approach typically requires comparing each representation with many negative examples, to find ones sufficiently close.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "circumvent", "ipa": "ˌsɜː.kəmˈvent", "pos": "v.", "m": "规避，绕过", "ex": "Contrastive methods circumvent this problem by reformulating the prediction problem into one of discrimination.", "lv": "考博", "ov": "", "sec": "Intro"}, {"w": "collapsing", "ipa": "kəˈlæp.sɪŋ", "pos": "v.", "m": "坍塌，崩溃", "ex": "In the vast majority of cases, this prevents the training from finding collapsed representations.", "lv": "四级", "ov": "", "sec": "Intro"}, {"w": "discrimination", "ipa": "dɪˌskrɪm.ɪˈneɪ.ʃən", "pos": "n.", "m": "判别，区分", "ex": "They learn to discriminate between the representation of another augmented view of the same image, and representations of different images.", "lv": "四级", "ov": "", "sec": "Intro"}, {"w": "indispensable", "ipa": "ˌɪn.dɪˈspen.sə.bəl", "pos": "adj.", "m": "不可或缺的", "ex": "We tasked ourselves to find out whether these negative examples are indispensable to prevent collapsing.", "lv": "四级", "ov": "", "sec": "Intro"}, {"w": "generative", "ipa": "ˈdʒen.ər.ə.tɪv", "pos": "adj.", "m": "生成式的", "ex": "Most unsupervised methods for representation learning can be categorized as either generative or discriminative.", "lv": "六级", "ov": "", "sec": "RelWork"}, {"w": "discriminative", "ipa": "dɪˈskrɪm.ɪ.nə.tɪv", "pos": "adj.", "m": "判别式的", "ex": "Generative approaches build a distribution over data and latent embedding.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "autoencoding", "ipa": "ˌɔː.toʊ.ɪnˈkoʊ.dɪŋ", "pos": "n.", "m": "自编码", "ex": "Many approaches rely on auto-encoding of images or adversarial learning.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "adversarial", "ipa": "ˌæd.vɜːrˈseɪ.ʃəl", "pos": "adj.", "m": "对抗的", "ex": "Generative approaches rely on adversarial learning, jointly modelling data and representation.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "consistency", "ipa": "kənˈsɪs.tən.si", "pos": "n.", "m": "一致性", "ex": "Mean teacher uses an l2 consistency loss between the softmax predictions of the teacher and the student.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "momentum encoder", "ipa": "moʊˈmen.təm ɪnˈkoʊ.dər", "pos": "n.", "m": "动量编码器", "ex": "MoCo uses a slow-moving average network (momentum encoder) to maintain consistent representations.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "memory bank", "ipa": "ˈmem.ər.i bæŋk", "pos": "n.", "m": "内存库", "ex": "MoCo maintains consistent representations of negative pairs drawn from a memory bank.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "pretext task", "ipa": "ˈpriː.tekst tæsk", "pos": "n.", "m": "前置任务", "ex": "Self-supervised methods rely on pretext tasks such as predicting image rotations or solving jigsaw puzzles.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "invariance", "ipa": "ɪnˈver.i.əns", "pos": "n.", "m": "不变性", "ex": "Learning deep representations aims to capture invariances across different augmented views.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "empirical", "ipa": "ɪmˈpɪr.ɪ.kəl", "pos": "adj.", "m": "经验的，实证的", "ex": "We provide empirical evidence that BYOL does not collapse during training.", "lv": "六级", "ov": "", "sec": "RelWork"}, {"w": "representation learning", "ipa": "ˌrep.rɪ.zenˈteɪ.ʃən ˈɜːr.nɪŋ", "pos": "n.", "m": "表示学习", "ex": "Self-supervised representation learning has achieved significant progress in recent years.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "pseudo-label", "ipa": "ˈsuː.doʊ ˈleɪ.bəl", "pos": "n.", "m": "伪标签", "ex": "Previous methods based on bootstrapping have used pseudo-labels or cluster indices.", "lv": "考博", "ov": "", "sec": "RelWork"}, {"w": "predictor", "ipa": "prɪˈdɪk.tər", "pos": "n.", "m": "预测器", "ex": "BYOL introduces an additional predictor on top of the online network, which prevents collapse.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "projector", "ipa": "prəˈdʒek.tər", "pos": "n.", "m": "投影器", "ex": "The representation y is projected to a smaller space by a multi-layer perceptron (MLP) projector.", "lv": "六级", "ov": "", "sec": "Method"}, {"w": "stop-gradient", "ipa": "stɑːp ˈɡreɪ.di.ənt", "pos": "n.", "m": "停止梯度", "ex": "BYOL updates online parameters with respect to θ only, but not ξ, as depicted by the stop-gradient.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "exponential moving average", "ipa": "ɪkˌspoʊ.nen.ʃəl ˈmuːv.ɪŋ ˈæv.ər.ɪdʒ", "pos": "n.", "m": "指数移动平均", "ex": "The target network is updated with a slow-moving average of the online network.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "normalized", "ipa": "ˈnɔːr.mə.laɪzd", "pos": "adj.", "m": "归一化的", "ex": "We l2-normalize both q_θ(z_θ) and z'_ξ before computing the loss.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "symmetrize", "ipa": "sɪˈmet.ər.aɪz", "pos": "v.", "m": "对称化", "ex": "We symmetrize the loss by separately feeding v' to the online network and v to the target network.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "conditional variance", "ipa": "kənˈdɪʃ.ən.əl ˈver.i.əns", "pos": "n.", "m": "条件方差", "ex": "BYOL's updates on θ follow in expectation the gradient of the expected conditional variance.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "optimal", "ipa": "ˈɑːp.tɪ.məl", "pos": "adj.", "m": "最优的", "ex": "When assuming BYOL's predictor to be optimal, we can analyze the training dynamics.", "lv": "六级", "ov": "", "sec": "Method"}, {"w": "collapse", "ipa": "kəˈlæps", "pos": "n./v.", "m": "坍塌，崩溃", "ex": "To prevent collapse, a straightforward approach is to add an explicit regularization term.", "lv": "四级", "ov": "", "sec": "Method"}, {"w": "clipped", "ipa": "klɪpt", "pos": "adj.", "m": "裁剪的", "ex": "We regularize the linear classifier by clipping the logits using a hyperbolic tangent function.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "momentum", "ipa": "moʊˈmen.təm", "pos": "n.", "m": "动量", "ex": "We use SGD with Nesterov momentum over 80 epochs.", "lv": "六级", "ov": "", "sec": "Method"}, {"w": "vanishing", "ipa": "ˈvæn.ɪ.ʃɪŋ", "pos": "adj.", "m": "消失的", "ex": "The moving average ensures smoother changes in the target representation to avoid vanishing gradients.", "lv": "四级", "ov": "", "sec": "Method"}, {"w": "ensemble", "ipa": "ɪnˈsem.bəl", "pos": "n.", "m": "集成，组合", "ex": "BYOL combines an online network and a target network as an ensemble for learning representations.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "hard-copy", "ipa": "hɑːrd ˈkɑː.pi", "pos": "v.", "m": "硬拷贝，直接复制", "ex": "Performing a hard-copy of the online parameters into the target parameters would propagate new sources of variability.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "near-optimal", "ipa": "nɪr ˈɑːp.tɪ.məl", "pos": "adj.", "m": "近最优的", "ex": "We hypothesize that the main role of the target network is to ensure the near-optimality of the predictor.", "lv": "考博", "ov": "", "sec": "Method"}, {"w": "fine-tuning", "ipa": "faɪn ˈtuː.nɪŋ", "pos": "n.", "m": "微调", "ex": "We evaluate the performance obtained when fine-tuning BYOL's representation on a classification task.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "semi-supervised", "ipa": "ˌsem.i səˈpɜːr.vɪzd", "pos": "adj.", "m": "半监督的", "ex": "In the semi-supervised setting, an unsupervised loss is combined with a classification loss over a handful of labels.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "transfer", "ipa": "ˈtræns.fɜːr", "pos": "n./v.", "m": "迁移", "ex": "We evaluate our representation on different tasks relevant to computer vision practitioners, namely semantic segmentation and transfer learning.", "lv": "四级", "ov": "", "sec": "Experiments"}, {"w": "generalization", "ipa": "ˌdʒen.ər.əl.ɪˈzeɪ.ʃən", "pos": "n.", "m": "泛化", "ex": "This evaluation assesses whether BYOL's representation generalizes beyond classification tasks.", "lv": "四级", "ov": "", "sec": "Experiments"}, {"w": "segmentation", "ipa": "ˌseɡ.menˈteɪ.ʃən", "pos": "n.", "m": "分割", "ex": "We evaluate BYOL on the VOC2012 semantic segmentation task, where the goal is to classify each pixel.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "resilient", "ipa": "rɪˈzɪl.i.ənt", "pos": "adj.", "m": "有弹性的，恢复力强的", "ex": "BYOL is more resilient to changes in the batch size and in the set of image augmentations.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "deteriorates", "ipa": "dɪˈtɪr.i.ə.reɪts", "pos": "v.", "m": "恶化，退化", "ex": "The performance of SimCLR rapidly deteriorates with batch size.", "lv": "六级", "ov": "", "sec": "Experiments"}, {"w": "imperative", "ipa": "ɪmˈper.ə.tɪv", "pos": "adj.", "m": "必要的，强制的", "ex": "Careful treatment of negative pairs is imperative for contrastive methods.", "lv": "六级", "ov": "", "sec": "Experiments"}, {"w": "overfitting", "ipa": "ˌoʊ.vərˈfɪt.ɪŋ", "pos": "n.", "m": "过拟合", "ex": "Large networks are prone to overfitting as they are outperformed by ResNets with identical depth.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "ablation", "ipa": "æˈbleɪ.ʃən", "pos": "n.", "m": "消融实验", "ex": "We provide additional ablations in Appendix F.3 to analyze individual image transformations.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "hyperparameter", "ipa": "ˌhaɪ.pərˈpær.ə.mɪ.tər", "pos": "n.", "m": "超参数", "ex": "We select the hyperparameters achieving the best performance on our local validation set.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "pretrained", "ipa": "priːˈtreɪnd", "pos": "adj.", "m": "预训练的", "ex": "We compare our pretrained representation with supervised and other self-supervised baselines.", "lv": "考博", "ov": "", "sec": "Experiments"}, {"w": "spatial", "ipa": "ˈspeɪ.ʃəl", "pos": "adj.", "m": "空间的", "ex": "At training time, we apply spatial augmentations, i.e., random crops with resize.", "lv": "六级", "ov": "", "sec": "Experiments"}, {"w": "interpolation", "ipa": "ɪnˌtɜːr.pəˈleɪ.ʃən", "pos": "n.", "m": "插值", "ex": "This patch is then resized to the target size of 224 × 224 using bicubic interpolation.", "lv": "考博", "ov": "GRE", "sec": "Experiments"}, {"w": "collapse", "ipa": "kəˈlæps", "pos": "n./v.", "m": "坍塌，崩溃", "ex": "In contrast, BYOL introduces an additional predictor on top of the online network, which prevents collapse.", "lv": "四级", "ov": "", "sec": "Discuss"}, {"w": "negative examples", "ipa": "ˈneɡ.ə.tɪv ɪɡˈzæm.pəlz", "pos": "n.", "m": "负样本", "ex": "The only variant that performs well without negative examples is BYOL, using both a bootstrap target network and a predictor.", "lv": "考博", "ov": "", "sec": "Discuss"}, {"w": "stabilization", "ipa": "ˌsteɪ.bəl.ɪˈzeɪ.ʃən", "pos": "n.", "m": "稳定化", "ex": "By mere stabilization effect, even when using the same number of negative examples, using a target network is beneficial.", "lv": "考博", "ov": "雅思托福", "sec": "Discuss"}, {"w": "consistency", "ipa": "kənˈsɪs.tən.si", "pos": "n.", "m": "一致性", "ex": "An l2 consistency loss between the softmax predictions of the teacher and the student is added.", "lv": "考博", "ov": "", "sec": "Discuss"}, {"w": "resilient", "ipa": "rɪˈzɪl.i.ənt", "pos": "adj.", "m": "有弹性的，稳健的", "ex": "BYOL is more resilient to changes in the batch size and in the set of image augmentations compared to its contrastive counterparts.", "lv": "考博", "ov": "", "sec": "Discuss"}, {"w": "deterioration", "ipa": "dɪˌtɪr.i.əˈreɪ.ʃən", "pos": "n.", "m": "恶化，退化", "ex": "The performance of SimCLR rapidly deteriorates with batch size, likely due to the decrease in the number of negative examples.", "lv": "六级", "ov": "", "sec": "Discuss"}, {"w": "sensitivity", "ipa": "ˌsen.səˈtɪv.ə.ti", "pos": "n.", "m": "敏感性", "ex": "Contrastive methods are sensitive to the choice of image augmentations.", "lv": "六级", "ov": "", "sec": "Discuss"}, {"w": "incentivized", "ipa": "ɪnˈsen.tɪ.vaɪzd", "pos": "v.", "m": "激励，鼓励", "ex": "BYOL is incentivized to keep any information captured by the target representation into its online network.", "lv": "考博", "ov": "", "sec": "Discuss"}, {"w": "prone", "ipa": "proʊn", "pos": "adj.", "m": "倾向于", "ex": "Large networks are prone to overfitting as they are outperformed by ResNets with identical depth.", "lv": "六级", "ov": "", "sec": "Discuss"}, {"w": "regularization", "ipa": "ˌreɡ.jə.lər.ɪˈzeɪ.ʃən", "pos": "n.", "m": "正则化", "ex": "Regularization methods are thus recommended when tuning on large architectures.", "lv": "考博", "ov": "", "sec": "Discuss"}, {"w": "malfunction", "ipa": "ˈmæl.fʌŋk.ʃən", "pos": "n.", "m": "故障，失灵", "ex": "When either the predictor or target network is removed, the representation may malfunction and collapse.", "lv": "四级", "ov": "", "sec": "Discuss"}, {"w": "dynamic", "ipa": "daɪˈnæm.ɪk", "pos": "n./adj.", "m": "动态；动态的", "ex": "BYOL's dynamics are summarized by the update equations for online and target parameters.", "lv": "四级", "ov": "", "sec": "Discuss"}, {"w": "drastically", "ipa": "ˈdræs.tɪ.kli", "pos": "adv.", "m": "急剧地，显著地", "ex": "Performance drops drastically when color distortions are removed from SimCLR's augmentations.", "lv": "六级", "ov": "", "sec": "Discuss"}, {"w": "collapse", "ipa": "kəˈlæps", "pos": "n./v.", "m": "坍塌，崩溃", "ex": "The representation does collapse when either the predictor or target network is removed.", "lv": "四级", "ov": "", "sec": "Discuss"}, {"w": "introduced", "ipa": "ɪn.trəˈdjuːst", "pos": "v.", "m": "引入，介绍", "ex": "We introduced BYOL, a new algorithm for self-supervised learning of image representations.", "lv": "考博", "ov": "", "sec": "Conclusion"}, {"w": "bridging", "ipa": "ˈbrɪdʒ.ɪŋ", "pos": "v.", "m": "弥合，桥接", "ex": "BYOL bridges most of the remaining gap between self-supervised methods and the supervised learning baseline.", "lv": "四级", "ov": "", "sec": "Conclusion"}, {"w": "modalities", "ipa": "moʊˈdæl.ə.tiz", "pos": "n.", "m": "模态", "ex": "To generalize BYOL to other modalities (e.g., audio, video, text) it is necessary to obtain similar augmentations.", "lv": "考博", "ov": "", "sec": "Conclusion"}, {"w": "generalize", "ipa": "ˈdʒen.ər.əl.aɪz", "pos": "v.", "m": "泛化，推广", "ex": "Designing such augmentations may require significant effort and expertise to generalize BYOL to other modalities.", "lv": "六级", "ov": "", "sec": "Conclusion"}, {"w": "automating", "ipa": "ˈɔː.tə.meɪ.tɪŋ", "pos": "v.", "m": "自动化", "ex": "Automating the search for augmentations would be an important next step.", "lv": "六级", "ov": "", "sec": "Conclusion"}, {"w": "susceptible", "ipa": "səˈsep.tə.bəl", "pos": "adj.", "m": "易受影响的", "ex": "As vision datasets could be biased, the representation learned by BYOL could be susceptible to replicate these biases.", "lv": "六级", "ov": "", "sec": "Conclusion"}, {"w": "bias", "ipa": "ˈbaɪ.əs", "pos": "n.", "m": "偏差，偏见", "ex": "Vision datasets could be biased, and the representation learned by BYOL could replicate these biases.", "lv": "六级", "ov": "", "sec": "Conclusion"}, {"w": "dual use", "ipa": "ˈdjuː.əl juːz", "pos": "n.", "m": "双重用途", "ex": "A particular use may have both positive or negative impacts, which is known as the dual use problem.", "lv": "考博", "ov": "", "sec": "Conclusion"}, {"w": "versatile", "ipa": "ˈvɜːr.sə.taɪl", "pos": "adj.", "m": "多才多艺的，多功能的", "ex": "BYOL's representation is versatile across various downstream tasks.", "lv": "六级", "ov": "", "sec": "Conclusion"}, {"w": "paradigm", "ipa": "ˈper.ə.daɪm", "pos": "n.", "m": "范式", "ex": "BYOL represents a new paradigm in self-supervised learning by removing the need for negative pairs.", "lv": "考研", "ov": "", "sec": "Conclusion"}, {"w": "annihilate", "ipa": "əˈnaɪ.ə.leɪt", "pos": "v.", "m": "消灭，彻底击败", "ex": "BYOL effectively annihilates the gap with supervised baselines on several benchmarks.", "lv": "考博", "ov": "", "sec": "Conclusion"}, {"w": "subsequent", "ipa": "ˈsʌb.sɪ.kwənt", "pos": "adj.", "m": "随后的，接下来的", "ex": "Subsequent work can build upon BYOL's approach to further improve self-supervised learning.", "lv": "四级", "ov": "", "sec": "Conclusion"}, {"w": "unsupervised", "ipa": "ˌʌn.səˈpɜːr.vɪzd", "pos": "adj.", "m": "无监督的", "ex": "The presented research should be categorized as research in the field of unsupervised learning.", "lv": "考博", "ov": "", "sec": "Impact"}, {"w": "biased", "ipa": "ˈbaɪ.əst", "pos": "adj.", "m": "有偏见的", "ex": "As vision datasets could be biased, the representation learned by BYOL could be susceptible to replicate these biases.", "lv": "六级", "ov": "", "sec": "Impact"}, {"w": "replicate", "ipa": "ˈrep.lɪ.keɪt", "pos": "v.", "m": "复制，重现", "ex": "The representation learned by BYOL could be susceptible to replicate biases present in the training data.", "lv": "考博", "ov": "", "sec": "Impact"}, {"w": "algorithm", "ipa": "ˈæl.ɡə.rɪ.ðəm", "pos": "n.", "m": "算法", "ex": "This work may inspire new algorithms, theoretical, and experimental investigation.", "lv": "考博", "ov": "", "sec": "Impact"}, {"w": "inspire", "ipa": "ɪnˈspaɪ.ər", "pos": "v.", "m": "激励，启发", "ex": "This work may inspire new algorithms, theoretical, and experimental investigation.", "lv": "四级", "ov": "", "sec": "Impact"}, {"w": "applicable", "ipa": "əˈplɪk.ə.bəl", "pos": "adj.", "m": "可应用的", "ex": "The algorithm presented here can be used for many different vision applications.", "lv": "四级", "ov": "", "sec": "Impact"}, {"w": "theoretical", "ipa": "ˌθiː.əˈret.ɪ.kəl", "pos": "adj.", "m": "理论的", "ex": "This work may inspire new algorithms, theoretical, and experimental investigation.", "lv": "四级", "ov": "", "sec": "Impact"}, {"w": "experimental", "ipa": "ɪkˌsper.ɪˈmen.təl", "pos": "adj.", "m": "实验的", "ex": "This work may inspire new algorithms, theoretical, and experimental investigation.", "lv": "四级", "ov": "", "sec": "Impact"}, {"w": "investigation", "ipa": "ɪnˌves.tɪˈɡeɪ.ʃən", "pos": "n.", "m": "调查，研究", "ex": "This work may inspire new algorithms, theoretical, and experimental investigation.", "lv": "四级", "ov": "", "sec": "Impact"}, {"w": "vision applications", "ipa": "ˈvɪʒ.ən ˌæp.lɪˈkeɪ.ʃənz", "pos": "n.", "m": "视觉应用", "ex": "The algorithm presented here can be used for many different vision applications.", "lv": "考博", "ov": "", "sec": "Impact"}];

sarial.mp3", "collapsed": "../listen-audio/w_brian_collapsed.mp3", "linear evaluation": "../listen-audio/w_brian_linear_evaluation.mp3", "classification": "../listen-audio/w_brian_classification.mp3", "contrastive": "../listen-audio/w_brian_contrastive.mp3", "bootstrap": "../listen-audio/w_brian_bootstrap.mp3", "latently": "../listen-audio/w_brian_latently.mp3", "pretext": "../listen-audio/w_brian_pretext.mp3", "negative pairs": "../listen-audio/w_brian_negative_pairs.mp3", "incentivized": "../listen-audio/w_brian_incentivized.mp3", "sufﬁciently": "../listen-audio/w_brian_sufﬁciently.mp3", "circumvent": "../listen-audio/w_brian_circumvent.mp3", "collapsing": "../listen-audio/w_brian_collapsing.mp3", "discrimination": "../listen-audio/w_brian_discrimination.mp3", "indispensable": "../listen-audio/w_brian_indispensable.mp3", "generative": "../listen-audio/w_brian_generative.mp3", "autoencoding": "../listen-audio/w_brian_autoencoding.mp3", "momentum encoder": "../listen-audio/w_brian_momentum_encoder.mp3", "memory bank": "../listen-audio/w_brian_memory_bank.mp3", "pretext task": "../listen-audio/w_brian_pretext_task.mp3", "invariance": "../listen-audio/w_brian_invariance.mp3", "representation learning": "../listen-audio/w_brian_representation_learning.mp3", "pseudo-label": "../listen-audio/w_brian_pseudo_label.mp3", "predictor": "../listen-audio/w_brian_predictor.mp3", "projector": "../listen-audio/w_brian_projector.mp3", "stop-gradient": "../listen-audio/w_brian_stop_gradient.mp3", "exponential moving average": "../listen-audio/w_brian_exponential_moving_average.mp3", "symmetrize": "../listen-audio/w_brian_symmetrize.mp3", "conditional variance": "../listen-audio/w_brian_conditional_variance.mp3", "collapse": "../listen-audio/w_brian_collapse.mp3", "clipped": "../listen-audio/w_brian_clipped.mp3", "vanishing": "../listen-audio/w_brian_vanishing.mp3", "hard-copy": "../listen-audio/w_brian_hard_copy.mp3", "near-optimal": "../listen-audio/w_brian_near_optimal.mp3", "segmentation": "../listen-audio/w_brian_segmentation.mp3", "resilient": "../listen-audio/w_brian_resilient.mp3", "deteriorates": "../listen-audio/w_brian_deteriorates.mp3", "imperative": "../listen-audio/w_brian_imperative.mp3", "pretrained": "../listen-audio/w_brian_pretrained.mp3", "spatial": "../listen-audio/w_brian_spatial.mp3", "interpolation": "../listen-audio/w_brian_interpolation.mp3", "negative examples": "../listen-audio/w_brian_negative_examples.mp3", "stabilization": "../listen-audio/w_brian_stabilization.mp3", "deterioration": "../listen-audio/w_brian_deterioration.mp3", "prone": "../listen-audio/w_brian_prone.mp3", "malfunction": "../listen-audio/w_brian_malfunction.mp3", "dynamic": "../listen-audio/w_brian_dynamic.mp3", "drastically": "../listen-audio/w_brian_drastically.mp3", "introduced": "../listen-audio/w_brian_introduced.mp3", "automating": "../listen-audio/w_brian_automating.mp3", "susceptible": "../listen-audio/w_brian_susceptible.mp3", "dual use": "../listen-audio/w_brian_dual_use.mp3", "versatile": "../listen-audio/w_brian_versatile.mp3", "paradigm": "../listen-audio/w_brian_paradigm.mp3", "annihilate": "../listen-audio/w_brian_annihilate.mp3", "algorithm": "../listen-audio/w_brian_algorithm.mp3", "applicable": "../listen-audio/w_brian_applicable.mp3", "experimental": "../listen-audio/w_brian_experimental.mp3", "investigation": "../listen-audio/w_brian_investigation.mp3", "vision applications": "../listen-audio/w_brian_vision_applications.mp3"}, "e": {"From an augmented view of an image, we train the online network to predict the target network representation.": "../listen-audio/e_brian_0cfb6f104522.mp3", "BYOL relies on two neural networks that interact and learn from each other for representation learning.": "../listen-audio/e_brian_b4ff5d346ef6.mp3", "While this objective admits collapsed solutions, we empirically show that BYOL does not converge to such solutions.": "../listen-audio/e_brian_801344306dbf.mp3", "BYOL achieves a new state of the art and is more robust to the choice of image augmentations.": "../listen-audio/e_brian_66b30eb3b9c7.mp3", "BYOL reaches 74.3% top-1 classification accuracy on ImageNet using a linear evaluation with a ResNet-50 architecture.": "../listen-audio/e_brian_2a45fbeff2aa.mp3", "BYOL performs on par or better than the current state of the art on both transfer and semi-supervised benchmarks.": "../listen-audio/e_brian_613239628bab.mp3", "While state-of-the-art methods rely on negative pairs, BYOL achieves a new state of the art without them.": "../listen-audio/e_brian_95ec4a304484.mp3", "BYOL reaches 74.3% top-1 classification accuracy on ImageNet.": "../listen-audio/e_brian_6b4281aed2c7.mp3", "Learning good image representations is a key challenge in computer vision.": "../listen-audio/e_brian_e0252dd3dc26.mp3", "State-of-the-art contrastive methods are trained by reducing the distance between representations of different augmented views.": "../listen-audio/e_brian_a5c153ad15d9.mp3", "Their performance critically depends on the choice of image augmentations.": "../listen-audio/e_brian_312941ed5b37.mp3", "BYOL iteratively bootstraps the outputs of a network to serve as targets for an enhanced representation.": "../listen-audio/e_brian_adf69245e96f.mp3", "BYOL trains its online network to predict the target network's representation of another augmented view.": "../listen-audio/e_brian_1113a757152a.mp3", "We hypothesize that the combination of a predictor and a moving average avoids collapsed solutions.": "../listen-audio/e_brian_aca06f9827d7.mp3", "Many different training approaches have been proposed, usually relying on visual pretext tasks.": "../listen-audio/e_brian_71bf5e254d70.mp3", "These methods need careful treatment of negative pairs by either relying on large batch sizes or memory banks.": "../listen-audio/e_brian_a5b773e8153a.mp3", "Memory banks or customized mining strategies are used to retrieve the negative pairs.": "../listen-audio/e_brian_9a6a71cf7544.mp3", "BYOL is incentivized to keep any information captured by the target representation into its online network.": "../listen-audio/e_brian_ce11c6163f22.mp3", "This discriminative approach typically requires comparing each representation with many negative examples, to find ones sufficiently close.": "../listen-audio/e_brian_d21b69672b91.mp3", "Contrastive methods circumvent this problem by reformulating the prediction problem into one of discrimination.": "../listen-audio/e_brian_8b60fd2fe0ca.mp3", "In the vast majority of cases, this prevents the training from finding collapsed representations.": "../listen-audio/e_brian_5cc92e0d16fb.mp3", "They learn to discriminate between the representation of another augmented view of the same image, and representations of different images.": "../listen-audio/e_brian_5ae5f9464254.mp3", "We tasked ourselves to find out whether these negative examples are indispensable to prevent collapsing.": "../listen-audio/e_brian_7e6dc9cc0f6e.mp3", "Most unsupervised methods for representation learning can be categorized as either generative or discriminative.": "../listen-audio/e_brian_563b40b9e4c8.mp3", "Generative approaches build a distribution over data and latent embedding.": "../listen-audio/e_brian_26c3b6de75c2.mp3", "Many approaches rely on auto-encoding of images or adversarial learning.": "../listen-audio/e_brian_69c1883ad7aa.mp3", "Generative approaches rely on adversarial learning, jointly modelling data and representation.": "../listen-audio/e_brian_a348bf850a05.mp3", "Mean teacher uses an l2 consistency loss between the softmax predictions of the teacher and the student.": "../listen-audio/e_brian_2bd2d8b07029.mp3", "MoCo uses a slow-moving average network (momentum encoder) to maintain consistent representations.": "../listen-audio/e_brian_c0a5480c392c.mp3", "MoCo maintains consistent representations of negative pairs drawn from a memory bank.": "../listen-audio/e_brian_765ae0d52494.mp3", "Self-supervised methods rely on pretext tasks such as predicting image rotations or solving jigsaw puzzles.": "../listen-audio/e_brian_6654f8382f0a.mp3", "Learning deep representations aims to capture invariances across different augmented views.": "../listen-audio/e_brian_4908614dbb91.mp3", "We provide empirical evidence that BYOL does not collapse during training.": "../listen-audio/e_brian_3d541e143838.mp3", "Self-supervised representation learning has achieved significant progress in recent years.": "../listen-audio/e_brian_44af3d9d8385.mp3", "Previous methods based on bootstrapping have used pseudo-labels or cluster indices.": "../listen-audio/e_brian_860fe2eb2af3.mp3", "BYOL introduces an additional predictor on top of the online network, which prevents collapse.": "../listen-audio/e_brian_6619dcdbcb3b.mp3", "The representation y is projected to a smaller space by a multi-layer perceptron (MLP) projector.": "../listen-audio/e_brian_6c9770abdf97.mp3", "BYOL updates online parameters with respect to θ only, but not ξ, as depicted by the stop-gradient.": "../listen-audio/e_brian_930e96857938.mp3", "The target network is updated with a slow-moving average of the online network.": "../listen-audio/e_brian_311b118b9515.mp3", "We l2-normalize both q_θ(z_θ) and z'_ξ before computing the loss.": "../listen-audio/e_brian_5cf374fe1852.mp3", "We symmetrize the loss by separately feeding v' to the online network and v to the target network.": "../listen-audio/e_brian_444bb6ebe281.mp3", "BYOL's updates on θ follow in expectation the gradient of the expected conditional variance.": "../listen-audio/e_brian_46717154108c.mp3", "When assuming BYOL's predictor to be optimal, we can analyze the training dynamics.": "../listen-audio/e_brian_98faa3bb9796.mp3", "To prevent collapse, a straightforward approach is to add an explicit regularization term.": "../listen-audio/e_brian_4c8fc37bbb0b.mp3", "We regularize the linear classifier by clipping the logits using a hyperbolic tangent function.": "../listen-audio/e_brian_18963b7ae294.mp3", "We use SGD with Nesterov momentum over 80 epochs.": "../listen-audio/e_brian_7d869f32efe6.mp3", "The moving average ensures smoother changes in the target representation to avoid vanishing gradients.": "../listen-audio/e_brian_ea8cd054a98b.mp3", "BYOL combines an online network and a target network as an ensemble for learning representations.": "../listen-audio/e_brian_da9b58e129a1.mp3", "Performing a hard-copy of the online parameters into the target parameters would propagate new sources of variability.": "../listen-audio/e_brian_4f9180fefcfd.mp3", "We hypothesize that the main role of the target network is to ensure the near-optimality of the predictor.": "../listen-audio/e_brian_6c4a0aa35475.mp3", "We evaluate the performance obtained when fine-tuning BYOL's representation on a classification task.": "../listen-audio/e_brian_4d8ce90e4927.mp3", "In the semi-supervised setting, an unsupervised loss is combined with a classification loss over a handful of labels.": "../listen-audio/e_brian_6ee35082c223.mp3", "We evaluate our representation on different tasks relevant to computer vision practitioners, namely semantic segmentation and transfer learning.": "../listen-audio/e_brian_ff02b7998785.mp3", "This evaluation assesses whether BYOL's representation generalizes beyond classification tasks.": "../listen-audio/e_brian_62c88ba95e9d.mp3", "We evaluate BYOL on the VOC2012 semantic segmentation task, where the goal is to classify each pixel.": "../listen-audio/e_brian_6ab07b713ad5.mp3", "BYOL is more resilient to changes in the batch size and in the set of image augmentations.": "../listen-audio/e_brian_4710ca6fdc95.mp3", "The performance of SimCLR rapidly deteriorates with batch size.": "../listen-audio/e_brian_5be4e7a90b78.mp3", "Careful treatment of negative pairs is imperative for contrastive methods.": "../listen-audio/e_brian_d3af2491ddb5.mp3", "Large networks are prone to overfitting as they are outperformed by ResNets with identical depth.": "../listen-audio/e_brian_8739a61b81d1.mp3", "We provide additional ablations in Appendix F.3 to analyze individual image transformations.": "../listen-audio/e_brian_939b436db7ad.mp3", "We select the hyperparameters achieving the best performance on our local validation set.": "../listen-audio/e_brian_9e2a1db88a17.mp3", "We compare our pretrained representation with supervised and other self-supervised baselines.": "../listen-audio/e_brian_1205f5684487.mp3", "At training time, we apply spatial augmentations, i.e., random crops with resize.": "../listen-audio/e_brian_d83bf7f099f2.mp3", "This patch is then resized to the target size of 224 × 224 using bicubic interpolation.": "../listen-audio/e_brian_b27645560976.mp3", "In contrast, BYOL introduces an additional predictor on top of the online network, which prevents collapse.": "../listen-audio/e_brian_d141c3354170.mp3", "The only variant that performs well without negative examples is BYOL, using both a bootstrap target network and a predictor.": "../listen-audio/e_brian_fa9cb3b2ef59.mp3", "By mere stabilization effect, even when using the same number of negative examples, using a target network is beneficial.": "../listen-audio/e_brian_8b94b9e77012.mp3", "An l2 consistency loss between the softmax predictions of the teacher and the student is added.": "../listen-audio/e_brian_1c4a806c9005.mp3", "BYOL is more resilient to changes in the batch size and in the set of image augmentations compared to its contrastive counterparts.": "../listen-audio/e_brian_c0a1cfe3993e.mp3", "The performance of SimCLR rapidly deteriorates with batch size, likely due to the decrease in the number of negative examples.": "../listen-audio/e_brian_4a8d798311b4.mp3", "Contrastive methods are sensitive to the choice of image augmentations.": "../listen-audio/e_brian_2892b687af1c.mp3", "Regularization methods are thus recommended when tuning on large architectures.": "../listen-audio/e_brian_12b220d1b041.mp3", "When either the predictor or target network is removed, the representation may malfunction and collapse.": "../listen-audio/e_brian_c8ebd1df49a9.mp3", "BYOL's dynamics are summarized by the update equations for online and target parameters.": "../listen-audio/e_brian_106b2a622d32.mp3", "Performance drops drastically when color distortions are removed from SimCLR's augmentations.": "../listen-audio/e_brian_fd84183f26a1.mp3", "The representation does collapse when either the predictor or target network is removed.": "../listen-audio/e_brian_3c991cac05ff.mp3", "We introduced BYOL, a new algorithm for self-supervised learning of image representations.": "../listen-audio/e_brian_75b2a5949b17.mp3", "BYOL bridges most of the remaining gap between self-supervised methods and the supervised learning baseline.": "../listen-audio/e_brian_0be141cda23e.mp3", "To generalize BYOL to other modalities (e.g., audio, video, text) it is necessary to obtain similar augmentations.": "../listen-audio/e_brian_ffb78ac46123.mp3", "Designing such augmentations may require significant effort and expertise to generalize BYOL to other modalities.": "../listen-audio/e_brian_4dd4c89bd859.mp3", "Automating the search for augmentations would be an important next step.": "../listen-audio/e_brian_0b04617daad7.mp3", "As vision datasets could be biased, the representation learned by BYOL could be susceptible to replicate these biases.": "../listen-audio/e_brian_35f0829b1b67.mp3", "Vision datasets could be biased, and the representation learned by BYOL could replicate these biases.": "../listen-audio/e_brian_a805633ab0c4.mp3", "A particular use may have both positive or negative impacts, which is known as the dual use problem.": "../listen-audio/e_brian_e7ce9cb24b0f.mp3", "BYOL's representation is versatile across various downstream tasks.": "../listen-audio/e_brian_ed13ca6d9645.mp3", "BYOL represents a new paradigm in self-supervised learning by removing the need for negative pairs.": "../listen-audio/e_brian_3cffc83b1e39.mp3", "BYOL effectively annihilates the gap with supervised baselines on several benchmarks.": "../listen-audio/e_brian_e26cf467f118.mp3", "Subsequent work can build upon BYOL's approach to further improve self-supervised learning.": "../listen-audio/e_brian_cedd3418d265.mp3", "The presented research should be categorized as research in the field of unsupervised learning.": "../listen-audio/e_brian_4bbf9e51104c.mp3", "The representation learned by BYOL could be susceptible to replicate biases present in the training data.": "../listen-audio/e_brian_a9b68b337f11.mp3", "This work may inspire new algorithms, theoretical, and experimental investigation.": "../listen-audio/e_brian_d0e25d97ccd4.mp3", "The algorithm presented here can be used for many different vision applications.": "../listen-audio/e_brian_46f6618abc8d.mp3"}}, "en-US-AndrewNeural": {"w": {"transfer": "../listen-audio/w_andrew_transfer.mp3", "generalization": "../listen-audio/w_andrew_generalization.mp3", "robust": "../listen-audio/w_andrew_robust.mp3", "benchmark": "../listen-audio/w_andrew_benchmark.mp3", "unsupervised": "../listen-audio/w_andrew_unsupervised.mp3", "empirical": "../listen-audio/w_andrew_empirical.mp3", "optimal": "../listen-audio/w_andrew_optimal.mp3", "regularization": "../listen-audio/w_andrew_regularization.mp3", "state-of-the-art": "../listen-audio/w_andrew_state_of_the_art.mp3", "fine-tuning": "../listen-audio/w_andrew_fine_tuning.mp3", "retrieve": "../listen-audio/w_andrew_retrieve.mp3", "normalized": "../listen-audio/w_andrew_normalized.mp3", "representation": "../listen-audio/w_andrew_representation.mp3", "ensemble": "../listen-audio/w_andrew_ensemble.mp3", "generalize": "../listen-audio/w_andrew_generalize.mp3", "subsequent": "../listen-audio/w_andrew_subsequent.mp3", "theoretical": "../listen-audio/w_andrew_theoretical.mp3", "hypothesize": "../listen-audio/w_andrew_hypothesize.mp3", "overfitting": "../listen-audio/w_andrew_overfitting.mp3", "hyperparameter": "../listen-audio/w_andrew_hyperpa let queue=[], qi=0, playing=false, timer=null, audio=null;
let autoplayBlocked=false;   /* 只有浏览器明确拒绝播放（NotAllowedError）才置位 */

function buildQueue(){
  let list=ITEMS.filter(i=>range[i.sec]!==false);
  /* 词汇级别筛选（四级/六级/考研/考博/雅思托福/GRE） */
  if(lvOff&&lvOff.size) list=list.filter(i=>!lvOff.has(i.lv)&&!(i.ov&&lvOff.has(i.ov)));
  if(S.source==="star")      list=list.filter(i=>stars.has(i.w));    /* 只背星标词 */
  else if(S.source==="fav")  list=list.filter(i=>favs.has(i.w));     /* 只读收藏词 */
  else if(S.source==="skip") list=list.filter(i=>skips.has(i.w));    /* 仅跳过：回看被跳过的，方便取消 */
  else if(S.source==="new")  list=list.filter(i=>!skips.has(i.w));   /* 仅新词：只读还没标已掌握的 */
  else if(S.skipOn)          list=list.filter(i=>!skips.has(i.w));   /* 全部：按开关跳过已划掉的 */
  /* 专背模式不再二次排除已跳过的：否则「星标+已跳过」的词根本读不到，没法取消误点 */
  if(S.order==="rand"){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  queue=list;
  if(qi>=queue.length)qi=0;
}
function rebuild(keep){
  const cur=queue[qi];
  buildQueue();
  if(keep&&cur){const k=queue.findIndex(x=>x.w===cur.w);qi=k>=0?k:0}
}
function updateBtns(){
  const w=queue[qi];
  $("favBtn").classList.toggle("on",!!(w&&favs.has(w.w)));
  $("starBtn").classList.toggle("on",!!(w&&stars.has(w.w)));
  $("okBtn").classList.toggle("on",!!(w&&skips.has(w.w)));
}
function updateCounts(){
  $("skipCnt").textContent="已跳过 "+skips.size+" 词";
  /* 和「词库来源」同一套图标：星标 / 收藏 / 跳过（原先是 ⭐❤✓ emoji 混搭） */
  $("markCnt").innerHTML="<b>"+IC.star+stars.size+"</b><b>"+IC.heart+favs.size+"</b><b>"+IC.skip+skips.size+"</b>";
}
/* 当前词的标记：只显示「跳过」（星标/收藏看顶栏图标即可，不重复占地方） */
function renderMarks(w){
  const box=$("mkBadge"); if(!box)return;
  if(!w||!skips.has(w.w)){box.style.display="none";return}
  box.innerHTML='<i class="mk" data-cancel="skip" title="此词已跳过 · 点一下恢复朗读">'+IC.skip+'<i>✕</i></i>';
  box.style.display="flex";
}
$("mkBadge").onclick=e=>{
  const el=e.target.closest("[data-cancel]"); if(!el)return;
  const w=queue[qi]; if(!w)return;
  const k=el.dataset.cancel;
  if(k==="star"){stars.delete(w.w);wr("listen_qq_star",stars);toast("已取消星标「"+w.w+"」")}
  else if(k==="fav"){favs.delete(w.w);wr("listen_qq_fav",favs);toast("已取消收藏「"+w.w+"」")}
  else if(k==="skip"){skips.delete(w.w);wr("listen_qq_skip",skips);toast("已恢复朗读「"+w.w+"」")}

/* 本篇已生成哪些音色：w/e = 英文音色，m = 中文音色 */
function audioVoices(kind){ try{ return AUDIO?Object.keys(AUDIO).filter(v=>AUDIO[v]&&AUDIO[v][kind]):[] }catch(e){ return [] } }
function localAudio(t,kind){
  try{
    if(!AUDIO)return "";
    const map = kind==="word"?"w" : kind==="zh"?"m" : kind==="sent"?"e" : null;
    if(!map)return "";
    const key = kind==="word" ? String(t).toLowerCase()
              : kind==="zh"   ? String(t).replace(/^[a-z]+\.\s*/i,"")
              : String(t);
    const all = audioVoices(map);
    const want = kind==="zh" ? S.zhVoice : S.enVoice;
    const order = (want&&all.indexOf(want)>=0) ? [want].concat(all.filter(v=>v!==want)) : all;
    for(let i=0;i<order.length;i++){
      const m=AUDIO[order[i]]&&AUDIO[order[i]][map];
      if(m&&m[key])return m[key];
    }
  }catch(e){}
  return "";
}
/* 中文朗读文本：去掉词性前缀 + 去掉括号里的英文注释。
   否则中文音色会把括号里的英文也念出来，中英混读听着就是"机器音" */
function zhText(w){
  return String((w&&w.m)||"")
    .replace(/^[a-z]+\.\s*/i,"")
    .replace(/[（(][^）)]*[A-Za-z][^）)]*[）)]/g,"")
    .replace(/\s+/g," ").trim();
}
function ttsURL(t,kind){
  const e=encodeURIComponent(t);
  const yd="https://dict.youdao.com/dictvoice?type="+(S.voice==="uk"?0:1)+"&audio="+e;
  const bd=lan=>"https://fanyi.baidu.com/gettts?lan="+lan+"&spd=5&source=web&text="+e;   /* 老版参数：spd=5 */
  const L=localAudio(t,kind); if(L)return L;
  if(kind==="zh")return bd("zh");
  if(kind==="sent")return bd("en");
  return yd;
}
function ttsURLs(t,kind){
  const e=encodeURIComponent(t);
  const yd="https://dict.youdao.com/dictvoice?type="+(S.voice==="uk"?0:1)+"&audio="+e;
  const bd=lan=>"https://fanyi.baidu.com/gettts?lan="+lan+"&spd=5&source=web&text="+e;   /* 老版参数：spd=5 */
  const urls=[];
  const L=localAudio(t,kind); if(L)urls.push(L);   /* 1) 微软预生成音频（有就用） */
  if(kind==="zh")urls.push(bd("zh"));
  else if(kind==="sent")urls.push(bd("en"));
  else urls.push(yd,bd("en"));                     /* 单词：有道 → 百度 */
  return urls;
}

/* ===== 李沐老师讲解视频（构建时按篇匹配注入；没匹配到就隐藏整行）===== */
(function videoRow(){
  try{
    if(!VIDEO||(!VIDEO.bili&&!VIDEO.yt&&!VIDEO.zhihu))return;
    const row=$("videoRow"), box=$("videoBox"); if(!row||!box)return;

    const sp=row.querySelector("span");

      b.onclick=()=>window.open(x[1],"_blank","noopener");
      box.appendChild(b);
    });

})();

/* ===== 音色选择器：只列本篇已生成的音色（在设置里切换，立即重播当前词）===== */
(function voiceRows(){
  const en=audioVoices("w"), zh=audioVoices("m");
  const rowOf=id=>{const e=$(id); return e?e.closest(".srow"):null};
  const rEn=rowOf("segEnVoice"), rZh=rowOf("segZhVoice");
  if(en.length){
    if(!S.enVoice||en.indexOf(S.enVoice)<0)S.enVoice=(en.find(v=>/brian/i.test(v))||en[0]);
    seg($("segEnVoice"),en.map(v=>({t:voiceLabel(v),v})),()=>S.enVoice,v=>{S.enVoice=v},
        ()=>refreshCurrent("单词音色： "+voiceLabel(S.enVoice)));
    const vr=$("segVoice")&&$("segVoice").closest(".srow"); if(vr)vr.style.display="none";  /* 有微软音后，美音/英音已无意义 */
  }else if(rEn){ rEn.style.display="none" }
  if(zh.length){
    if(!S.zhVoice||zh.indexOf(S.zhVoice)<0)S.zhVoice=(zh.find(v=>/yunyang/i.test(v))||zh[0]);
    seg($("segZhVoice"),zh.map(v=>({t:voiceLabel(v),v})),()=>S.zhVoice,v=>{S.zhVoice=v},
        ()=>refreshCurrent("中文音色： "+voiceLabel(S.zhVoice)));
  }else if(rZh){ rZh.style.display="none" }
})();
let failStreak=0;   /* 连续失败计数：防止音源全挂时疯狂空转刷完词表 */
/* 系统语音兜底：在线音源都不可用时，用浏览器自带语音朗读，保证有声音 */
function speakLocal(text,lang,cb){
  try{
    if(!window.speechSynthesis){ cb&&cb(false); return }
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=Math.max(.5,Math.min(2,(+S.rate||1)*.95));   /* 系统语音也跟着语速 */
    let done=false; const fin=ok=>{ if(done)return; done=true; cb&&cb(ok) };
    u.onend=()=>fin(true); u.onerror=()=>fin(false);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(()=>fin(true),Math.min(12000,1200+String(text).length*90));  /* 无 onend 时按字长估算收尾 */
  }catch(e){ cb&&cb(false) }
}
function say(text,kind,cb){
  const urls=ttsURLs(text,kind);
  const t0=Date.now();
  let i=0, done=false, local=false;
  const finish=ok=>{
    if(done)return; done=true;
    failStreak=ok?0:failStreak+1;
    if(!ok&&failStreak>=3){                 /* 连续 3 次完全没声：停下来告诉用户，别静默刷词 */
      clearT(); stopAudio(); setPlaying(false);
      toast("⚠️ 朗读音源暂时不可用，已暂停。检查网络后点 ▶ 继续");
      return;
    }
    const wait=Math.max(0,700-(Date.now()-t0));   /* 最短停留 0.7s，杜绝秒刷 */
    setTimeout(()=>cb&&cb(ok),wait);
  };
  const tryNext=()=>{
    if(done)return;
    if(i>=urls.length){                            /* 在线音源都不行 → 系统语音兜底 */
      if(local)return;                             /* 防重入：重复调用会把上一句 cancel 掉，等于没声 */
      local=true;
      speakLocal(text, kind==="zh"?"zh-CN":"en-US", finish);
      return;
    }
    stopAudio();
    const a=new Audio(urls[i++]);
    audio=a;
    try{a.playbackRate=+S.rate||1}catch(e){}      /* 语速（preservesPitch 默认开，不改音调） */
    let started=false;
    a.addEventListener("playing",()=>{ started=true });
    a.addEventListener("ended",()=>{ if(started)finish(true); else tryNext() });
    a.addEventListener("error",()=>{ if(!started)tryNext(); else finish(true) });
    a.play().catch(err=>{
      if(err&&err.name==="NotAllowedError"){ autoplayBlocked=true; finish(false) }
      else tryNext();
    });
    setTimeout(()=>{ if(!started&&!done)tryNext() },2500);   /* 2.5s 没出声 → 换下一个音源 */
    setTimeout(()=>{ if(!done)finish(!!started) },15000);
  };
  tryNext();
}
function stopAudio(){try{if(audio){audio.pause();audio=null}}catch(e){}}
function clearT(){if(timer){clearTimeout(timer);timer=null}}

/* 池子为空（比如「只背星标」但一个都没标）时的提示 */
function emptyHint(){
  const src=S.source;
  $("wsec").textContent="";
  $("wbig").textContent="—";
  $("wipa").textContent="";
  $("wmean").textContent = src==="star"?"还没有 ⭐ 星标词"
    : src==="fav"?"还没有 ❤ 收藏词"
    : src==="skip"?"还没有 ✓ 跳过的词"
    : "这里还没有可读的词";
  $("wex").textContent = src==="skip"?"在词上点「✓ 跳过」标记后，这里能集中回看并一键取消"
    : "点右上角 "+(src==="fav"?"❤":"☆")+" 标记后，这里会自动连播";
  renderMarks(null);
  $("wav").style.display="none";
  $("wtxt").style.display="";
  $("art").style.opacity=1;
  $("cur").textContent="第 0 词"; $("dur").textContent="共 0 词";
  $("fill").style.width="0%"; $("knob").style.left="0%";
}

/* 播放代际：每次 playCurrent 换代，上一代残留的延时/回执一律作废。
   否则旧链的 420/450ms 延时会插进新链 → 开关关了还在读、中文被顶掉、读串词 */
let gen=0;
function playCurrent(){
  const g=++gen;
  clearT();stopAudio();
  const w=queue[qi]; if(!w)return;
  const live=fn=>(...a)=>{ if(g!==gen)return; return fn(...a) };
  render(w,!(S.reveal));
  updateArm();
  if(!playing)return;
  const goNext=live(()=>{
    if(S.reveal)render(w,true);
    timer=setTimeout(live(()=>{qi=(qi+1)%queue.length;playCurrent()}),S.pause);
  });
  /* 例句：有本地微软音频就播本地，没有就走百度在线（老版方案） */
  const afterEx=live(()=>{ if(S.ex){say(w.ex,"sent",live(()=>goNext()))} else goNext(); });
  const afterZh=live(()=>{
    if(S.zh){ timer=setTimeout(live(()=>say(zhText(w),"zh",afterEx)),450) }
    else afterEx();
  });
  /* 单词可重复朗读 N 次（默认 1），全部读完再走中文/例句 */
  let left=Math.max(1,Math.min(20,Math.round(+S.repeat||1)));
  const again=live(()=>{
    left--;
    if(left>0){ timer=setTimeout(live(()=>say(w.w,"word",again)),420) }
    else afterZh();
  });
  say(w.w,"word",again);
}

function setPlaying(on){
  playing=on; app.classList.toggle("playing",on);
  $("icPlay").style.display=on?"none":""; $("icPause").style.display=on?"":"none";
  updateArm();
}
$("play").onclick=()=>{ setPlaying(!playing); if(playing)playCurrent(); else {clearT();stopAudio();} };
/* 上一词/下一词：抽成函数——它们是 <svg>，没有 .click()，键盘里点会直接抛异常 */
function prevWord(){if(!queue.length)return;qi=(qi-1+queue.length)%queue.length;if(playing)playCurrent();else render(queue[qi],true)}
function nextWord(){if(!queue.length)return;qi=(qi+1)%queue.length;if(playing)playCurrent();else render(queue[qi],true)}
$("prevBtn").onclick=prevWord;
$("nextBtn").onclick=nextWord;
$("moreBtn").onclick=()=>$("sheet").classList.add("on");
$("listBtn").onclick=()=>$("sheet").classList.add("on");
$("sheetBack").onclick=()=>{$("sheet").classList.remove("on");if(!playing){setPlaying(true);playCurrent()}};
$("backBtn").onclick=()=>{
  if(history.length>1)history.back();          // 从站点点进来的：退回上一页
  else location.href="../../listen/";          // 直接打开的：回听力索引
};
$("ordBtn").textContent=S.order==="rand"?"随机":"顺序";
$("ordBtn").onclick=()=>{
  S.order=S.order==="seq"?"rand":"seq"; save();
  $("ordBtn").textContent=S.order==="rand"?"随机":"顺序";
  rebuild(true); updateArm();
  toast(S.order==="rand"?"随机播放":"顺序播放");
  if(playing)playCurrent(); else if(queue[qi])render(queue[qi],true);
};
$("setupBack").onclick=()=>{$("sheet").classList.remove("on");if(!playing){setPlaying(true);playCurrent()}};
$("bar").onclick=e=>{
  if(!queue.length)return;
  const r=$("bar").getBoundingClientRect();
  qi=Math.min(queue.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*queue.length)));
  if(playing)playCurrent(); else render(queue[qi],true);
};
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();$("play").click()}
  else if(e.key==="ArrowRight")nextWord();
  else if(e.key==="ArrowLeft")prevWord();
  else if(e.key==="Escape")$("sheet").classList.remove("on");
});

// 释义/例句位置的律动波浪：恢复原来的固定 26 根、紧凑居中
(function(){
  const box=$("wav");
  for(let i=0;i<26;i++){
    const b=document.createElement("i");
    b.style.animationDuration=(0.55+Math.random()*0.55).toFixed(2)+"s";
    b.style.animationDelay=(-Math.random()*0.9).toFixed(2)+"s";

// 界面缩放：设置面板里切档（窄屏才生效；宽屏走双栏，固定 1x）
const ZOOMS=[1,1.25,1.5,2];
function setZ(z,persist){
  app.style.setProperty("--z",z);
  const zs=$("segZoom");
  if(zs)zs.querySelectorAll("b").forEach(b=>b.classList.toggle("on",+b.dataset.v===+z));
  if(persist){try{localStorage.setItem("listen_qq_zoom",z)}catch(e){}}
}
seg($("segZoom"),ZOOMS.map(z=>({t:z+"x",v:z})),()=>+(localStorage.getItem("listen_qq_zoom")||1),v=>setZ(v,true));
function measureDesign(){
  const prev=app.style.minHeight; app.style.minHeight="0px";
  const h=app.scrollHeight; app.style.minHeight=prev; return h;
}
addEventListener("resize",()=>{
  if(innerWidth<760 && !localStorage.getItem("listen_qq_zoom")) initZoom();
});
function initZoom(){
  const saved=+(localStorage.getItem("listen_qq_zoom")||0);
  /* 用户手动选过档位：任何屏幕都尊重，别再被自动逻辑覆盖 */
  if(saved&&ZOOMS.indexOf(saved)>=0){ setZ(saved,false); return }
  if(innerWidth>=760){ setZ(1,false); return }      // 宽屏默认 1x（双栏本来就够大）
  app.style.setProperty("--z","1");
  const dh=Math.max(measureDesign(),640);
  const fit=Math.min(2,(innerWidth-20)/430,(innerHeight-20)/dh);
  const ok=ZOOMS.filter(v=>v<=fit+1e-6);
  setZ(ok.length?ok[ok.length-1]:1,false);
}
initZoom();

// 进入即播放；被浏览器拦截则停在 ▶ 等点击
(function autoStart(){
  buildQueue();
  if(!queue.length){ emptyHint(); return }
  setPlaying(true); playCurrent();
  let heard=false; const mark=()=>{heard=true};
  const iv=setInterval(()=>{if(audio){audio.addEventListener("playing",mark);audio.addEventListener("timeupdate",mark)}},250);
  setTimeout(()=>{
    clearInterval(iv);
    if(heard)return;                        /* 真的出声了：正常播放 */
    if(!autoplayBlocked)return;             /* 没出声但不是被拦（网络慢/无音频设备）：不干预，别误暂停 */
    clearT();stopAudio();setPlaying(false);qi=0;render(queue[0],true);
    toast("浏览器拦截了自动播放，点 ▶ 开始");
  },3000);
})();
</script>
