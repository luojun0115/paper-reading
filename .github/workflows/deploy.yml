name: Deploy DeepRead
on:
  push:
    branches: [build]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
      - id: deploy
        uses: actions/deploy-pages@v4
